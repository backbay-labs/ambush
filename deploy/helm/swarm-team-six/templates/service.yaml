apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarm-team-six.fullname" . }}
  labels:
    {{- include "swarm-team-six.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "swarm-team-six.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
