{{- /*
The Perch bridge's two seeds and the operator bearer.

Three separate values on purpose. The Nostr seed and the SPINE seed derive
under different domain strings so the transport chain and the record chain
never share key material -- a compromise of one must not let anyone forge the
other. The operator bearer is a third thing again: it authenticates a READ, and
signing anything with a credential that also grants approve was the defect B5
closed.

`existingSecret` is the production path. Values written here land in the release
manifest, which is stored in the cluster and visible to anyone who can read
release history -- acceptable for an evaluation, not for a deployment.
*/}}
{{- if and .Values.perch.enabled (not .Values.perch.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swarm-team-six.fullname" . }}-perch
  labels:
    {{- include "swarm-team-six.labels" . | nindent 4 }}
type: Opaque
stringData:
  PERCH_BRIDGE_NOSTR_SEED: {{ required "perch.nostrSeed is required unless perch.existingSecret is set" .Values.perch.nostrSeed | quote }}
  PERCH_BRIDGE_SPINE_SEED: {{ required "perch.spineSeed is required unless perch.existingSecret is set" .Values.perch.spineSeed | quote }}
  SWARM_OPERATOR_TOKEN: {{ required "perch.operatorToken is required unless perch.existingSecret is set" .Values.perch.operatorToken | quote }}
{{- end }}
