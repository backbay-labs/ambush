name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"

      - name: Generate release changelog
        run: bash tools/generate-changelog.sh --tag "${GITHUB_REF_NAME}" --to "${GITHUB_SHA}" --output artifacts/CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog-${{ github.ref_name }}
          path: artifacts/CHANGELOG.md
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked

      - name: Generate workspace SBOM
        run: bash tools/generate-sbom.sh artifacts/sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarm-team-six-sbom-${{ github.ref_name }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error

  release-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Task #15. This script proves that `-C panic=abort` and
      # `-C overflow-checks=on` actually reach the release rustc invocations for
      # swarm_detect and swarmctl -- and it ran in no workflow at all.
      #
      # Which mattered here specifically: `publish-container` below cosign-signs
      # and attests an image whose binaries come from Dockerfile:8,
      #
      #   cargo build --locked --release -p swarm-runtime-http \
      #     --bin swarm_detect --bin swarmctl
      #
      # the exact command this script runs and inspects. The only thing making
      # those flags true is `[profile.release]` in Cargo.toml:139-141, and a
      # profile key is one edit away from silently not applying to the binary
      # you ship. Signing and attesting an unhardened binary is worse than not
      # signing it: the signature asserts provenance, and nothing asserted the
      # hardening. The script does not reuse the shared target cache -- it sets
      # its own CARGO_TARGET_DIR under mktemp -d so the `-v` log it greps is a
      # full, unmemoized set of rustc invocations rather than a cached subset.
      - name: Verify release hardening flags reach the shipped binaries
        run: bash tools/verify-release-hardening.sh

  publish-container:
    needs:
      - changelog
      - sbom
      - release-hardening
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Record container image reference
        id: image-ref
        run: echo "value=${REGISTRY}/${IMAGE_NAME}" >>"$GITHUB_OUTPUT"

      - name: Build and publish multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release image
        env:
          COSIGN_YES: "true"
        run: cosign sign "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    needs:
      - changelog
      - sbom
      - publish-container
    runs-on: ubuntu-latest
    steps:
      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: release-changelog-${{ github.ref_name }}
          path: artifacts

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: swarm-team-six-sbom-${{ github.ref_name }}
          path: artifacts/sbom

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: artifacts/CHANGELOG.md
          files: |
            artifacts/CHANGELOG.md
            artifacts/sbom/*.cdx.json
