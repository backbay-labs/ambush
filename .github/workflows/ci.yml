          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.19.4"
      CARGO_AUDIT_VERSION: "0.22.0"
      CARGO_CYCLONEDX_VERSION: "0.5.9"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-cyclonedx-${{ env.CARGO_CYCLONEDX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-cyclonedx-${{ env.CARGO_CYCLONEDX_VERSION }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --force
          cargo-deny --version

      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked --force
          cargo-audit --version

      - name: Install cargo-cyclonedx
        run: |
          CYCLONEDX_INSTALL_ROOT="${RUNNER_TEMP}/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}"
          cargo install cargo-cyclonedx --version "${CARGO_CYCLONEDX_VERSION}" --locked --force --root "${CYCLONEDX_INSTALL_ROOT}"
          CARGO_CYCLONEDX_BIN="${CYCLONEDX_INSTALL_ROOT}/bin/cargo-cyclonedx"
          test "$("${CARGO_CYCLONEDX_BIN}" cyclonedx --version)" = "cargo-cyclonedx-cyclonedx ${CARGO_CYCLONEDX_VERSION}"
          printf 'CARGO_CYCLONEDX_BIN=%s\n' "${CARGO_CYCLONEDX_BIN}" >>"${GITHUB_ENV}"

      - name: Run supply-chain checks
        run: bash tools/check-supply-chain.sh
