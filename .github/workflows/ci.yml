name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci

jobs:
  phase285-workspace-tests:
    name: phase285-workspace-tests (${{ github.sha }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: .
    steps:
      - name: Checkout the candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Cache Cargo sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Populate the locked Cargo source cache
        run: cargo fetch --locked

      - name: Run ordinary workspace tests as the final candidate step
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/phase285-workspace-tests-target
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --workspace --locked --offline

  phase285-wave0-contract:
    name: phase285-wave0-contract (${{ github.sha }})
    runs-on: ubuntu-24.04
    # This is a CI self-consistency boundary, not a hostile sandbox. Intentional
    # same-UID privilege or Docker-daemon abuse, mutate-use-restore inside one
    # child invocation, and compromised hosted toolchain/cache infrastructure
    # remain outside the local frozen-tree manifest threat model. Live external
    # assurance is separately required.
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: .
    steps:
      - name: Checkout the candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Cache Cargo sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - name: Populate the locked Cargo source cache
        run: cargo fetch --locked

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run the isolated Phase 285 assurance monolith as the final candidate step
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/phase285-assurance-target
          CARGO_INCREMENTAL: "0"
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_OPTIONAL_LOCKS: "0"
        run: |
          phase285_assurance_main() {
          set -euo pipefail
          PHASE285_TARGET_ROOT="$CARGO_TARGET_DIR"
          PHASE285_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          PHASE285_DOCKER_CONFIG="$RUNNER_TEMP/phase285-docker-config"
          unset BASH_ENV ENV CDPATH PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONINSPECT
          unset RUSTFLAGS RUSTDOCFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          unset SHELLCHECK_OPTS CLIPPY_CONF_DIR
          unset DOCKER_HOST DOCKER_CONTEXT DOCKER_CONFIG
          while IFS= read -r phase285_git_variable; do
            unset "$phase285_git_variable"
          done < <(compgen -A variable GIT_)
          while IFS= read -r phase285_cargo_variable; do
            case "$phase285_cargo_variable" in
              CARGO_TERM_COLOR) ;;
              CARGO_*) unset "$phase285_cargo_variable" ;;
            esac
          done < <(compgen -A variable CARGO_)
          CARGO_HOME="$PHASE285_CARGO_HOME"
          CARGO_INCREMENTAL=0
          RUSTFLAGS=
          RUSTDOCFLAGS=
          RUSTC_WRAPPER=
          RUSTC_WORKSPACE_WRAPPER=
          SHELLCHECK_OPTS=
          GIT_NO_REPLACE_OBJECTS=1
          GIT_OPTIONAL_LOCKS=0
          GIT_CONFIG_GLOBAL=/dev/null
          GIT_CONFIG_SYSTEM=/dev/null
          GIT_CONFIG_NOSYSTEM=1
          GIT_ATTR_NOSYSTEM=1
          DOCKER_CONFIG="$PHASE285_DOCKER_CONFIG"
          /usr/bin/python3 -I - "$PHASE285_TARGET_ROOT" "$DOCKER_CONFIG" <<'PY'
          import os
          import pathlib
          import stat
          import sys

          for label, text in zip(("target-root", "docker-config"), sys.argv[1:]):
              path = pathlib.Path(text)
              if not path.is_absolute() or os.path.lexists(path):
                  raise SystemExit(f"phase285_assurance_setup[{label}:not-fresh-absolute]")
              path.mkdir(mode=0o700)
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit(f"phase285_assurance_setup[{label}:type]")
              if stat.S_IMODE(metadata.st_mode) != 0o700:
                  raise SystemExit(f"phase285_assurance_setup[{label}:mode]")
          PY
          export CARGO_HOME CARGO_INCREMENTAL RUSTFLAGS RUSTDOCFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER SHELLCHECK_OPTS
          export GIT_NO_REPLACE_OBJECTS GIT_OPTIONAL_LOCKS GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_ATTR_NOSYSTEM DOCKER_CONFIG
          readonly HOME CARGO_HOME CARGO_INCREMENTAL RUSTFLAGS RUSTDOCFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER SHELLCHECK_OPTS GIT_NO_REPLACE_OBJECTS GIT_OPTIONAL_LOCKS GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_ATTR_NOSYSTEM DOCKER_CONFIG PHASE285_TARGET_ROOT PHASE285_CARGO_HOME PHASE285_DOCKER_CONFIG
          PHASE285_BASH=/bin/bash
          PHASE285_GIT=/usr/bin/git
          PHASE285_PYTHON=/usr/bin/python3
          PHASE285_SHASUM=/usr/bin/shasum
          PHASE285_AWK=/usr/bin/awk
          PHASE285_MKTEMP=/usr/bin/mktemp
          PHASE285_CONNZ_CURL_BIN=/usr/bin/curl
          export PHASE285_CONNZ_CURL_BIN
          PHASE285_RUSTUP="$(command -v rustup)"
          PHASE285_CARGO="$("$PHASE285_RUSTUP" which cargo)"
          PHASE285_RUSTC="$("$PHASE285_RUSTUP" which rustc)"
          PHASE285_RUSTFMT="$("$PHASE285_RUSTUP" which rustfmt)"
          PHASE285_CARGO_CLIPPY="$("$PHASE285_RUSTUP" which cargo-clippy)"
          PHASE285_CLIPPY_DRIVER="$("$PHASE285_RUSTUP" which clippy-driver)"
          PHASE285_SYSROOT="$("$PHASE285_RUSTC" --print sysroot)"
          PHASE285_GO="$(command -v go)"
          PHASE285_SHELLCHECK="$(command -v shellcheck)"
          PHASE285_DOCKER="$(command -v docker)"
          PHASE285_ACTIONLINT="$($PHASE285_GO env GOPATH)/bin/actionlint"
          capture_candidate_baseline() {
            /usr/bin/python3 -I - "$GITHUB_SHA" "$PHASE285_CARGO_HOME" "$PHASE285_DOCKER_CONFIG" "$PHASE285_TARGET_ROOT" "$PHASE285_SYSROOT" \
              bash "$PHASE285_BASH" \
              git "$PHASE285_GIT" \
              python3 "$PHASE285_PYTHON" \
              shasum "$PHASE285_SHASUM" \
              awk "$PHASE285_AWK" \
              mktemp "$PHASE285_MKTEMP" \
              curl "$PHASE285_CONNZ_CURL_BIN" \
              rustup "$PHASE285_RUSTUP" \
              cargo "$PHASE285_CARGO" \
              rustc "$PHASE285_RUSTC" \
              rustfmt "$PHASE285_RUSTFMT" \
              cargo-clippy "$PHASE285_CARGO_CLIPPY" \
              clippy-driver "$PHASE285_CLIPPY_DRIVER" \
              go "$PHASE285_GO" \
              shellcheck "$PHASE285_SHELLCHECK" \
              docker "$PHASE285_DOCKER" \
              actionlint "$PHASE285_ACTIONLINT" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          expected_sha = sys.argv[1]
          cargo_home = pathlib.Path(sys.argv[2])
          docker_config = pathlib.Path(sys.argv[3])
          target_root = pathlib.Path(sys.argv[4])
          sysroot = pathlib.Path(sys.argv[5])
          tool_arguments = sys.argv[6:]
          if len(tool_arguments) % 2:
              raise SystemExit("candidate_baseline[tool-arguments]")
          tool_paths = dict(zip(tool_arguments[::2], tool_arguments[1::2]))
          if len(tool_paths) != len(tool_arguments) // 2:
              raise SystemExit("candidate_baseline[duplicate-tool]")
          git_root = pathlib.Path(".git")
          git_root_metadata = git_root.lstat()
          if stat.S_ISLNK(git_root_metadata.st_mode) or not stat.S_ISDIR(
              git_root_metadata.st_mode
          ):
              raise SystemExit("candidate_baseline[git-not-real-directory]")
          cargo_home_metadata = cargo_home.lstat()
          if stat.S_ISLNK(cargo_home_metadata.st_mode) or not stat.S_ISDIR(
              cargo_home_metadata.st_mode
          ):
              raise SystemExit("candidate_baseline[cargo-home-not-real-directory]")

          def recursive_inventory(root):
              entries = [[".", "directory", root.lstat().st_mode, None]]
              for directory, names, files in os.walk(
                  root, topdown=True, followlinks=False
              ):
                  names[:] = sorted(names)
                  files = sorted(files)
                  retained_names = []
                  for name in names:
                      path = pathlib.Path(directory) / name
                      relative = path.relative_to(root).as_posix()
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          entries.append(
                              [relative, "symlink", metadata.st_mode, os.readlink(path)]
                          )
                      elif stat.S_ISDIR(metadata.st_mode):
                          entries.append([relative, "directory", metadata.st_mode, None])
                          retained_names.append(name)
                      else:
                          raise SystemExit(
                              f"candidate_baseline[git-nondirectory:{relative}]"
                          )
                  names[:] = retained_names
                  for name in files:
                      path = pathlib.Path(directory) / name
                      relative = path.relative_to(root).as_posix()
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          value = os.readlink(path)
                          kind = "symlink"
                      elif stat.S_ISREG(metadata.st_mode):
                          value = hashlib.sha256(path.read_bytes()).hexdigest()
                          kind = "file"
                      else:
                          raise SystemExit(
                              f"candidate_baseline[git-nonregular:{relative}]"
                          )
                      entries.append([relative, kind, metadata.st_mode, value])
              return sorted(entries)

          def directory_control(path, label, required):
              if not path.exists() and not path.is_symlink():
                  if required:
                      raise SystemExit(f"candidate_baseline[{label}:absent]")
                  return {"state": "absent"}
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit(f"candidate_baseline[{label}:type]")
              return {
                  "entries": recursive_inventory(path),
                  "identity": [metadata.st_dev, metadata.st_ino, metadata.st_mode],
                  "path": str(path),
                  "state": "directory",
              }

          def ancestor_cargo_controls(root):
              controls = []
              ancestor = root.resolve(strict=True).parent
              while True:
                  cargo_directory = ancestor / ".cargo"
                  if cargo_directory.exists() or cargo_directory.is_symlink():
                      directory_metadata = cargo_directory.lstat()
                      if stat.S_ISLNK(directory_metadata.st_mode) or not stat.S_ISDIR(
                          directory_metadata.st_mode
                      ):
                          raise SystemExit(
                              f"candidate_baseline[ancestor-cargo-directory:{cargo_directory}]"
                          )
                  for name in ("config", "config.toml"):
                      path = cargo_directory / name
                      label = str(path)
                      if not path.exists() and not path.is_symlink():
                          controls.append([label, "absent", None, None])
                          continue
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(
                          metadata.st_mode
                      ):
                          raise SystemExit(
                              f"candidate_baseline[ancestor-cargo-control:{label}]"
                          )
                      controls.append(
                          [
                              label,
                              "file",
                              metadata.st_mode,
                              hashlib.sha256(path.read_bytes()).hexdigest(),
                          ]
                      )
                  if ancestor == ancestor.parent:
                      break
                  ancestor = ancestor.parent
              return controls

          git_inventory = recursive_inventory(git_root)
          cargo_source_trees = {
              "git": directory_control(cargo_home / "git", "cargo-git", False),
              "registry": directory_control(
                  cargo_home / "registry", "cargo-registry", False
              ),
          }
          sysroot_control = directory_control(sysroot, "sysroot", True)
          cargo_ancestor_controls = ancestor_cargo_controls(pathlib.Path.cwd())
          docker_config_metadata = docker_config.lstat()
          if stat.S_ISLNK(docker_config_metadata.st_mode) or not stat.S_ISDIR(
              docker_config_metadata.st_mode
          ):
              raise SystemExit("candidate_baseline[docker-config-not-real-directory]")
          docker_config_inventory = recursive_inventory(docker_config)
          target_root_metadata = target_root.lstat()
          if stat.S_ISLNK(target_root_metadata.st_mode) or not stat.S_ISDIR(
              target_root_metadata.st_mode
          ):
              raise SystemExit("candidate_baseline[target-root-not-real-directory]")
          if stat.S_IMODE(target_root_metadata.st_mode) != 0o700:
              raise SystemExit("candidate_baseline[target-root-mode]")
          cargo_controls = []
          for name in ("config", "config.toml", "credentials", "credentials.toml"):
              path = cargo_home / name
              if not path.exists() and not path.is_symlink():
                  cargo_controls.append([name, "absent", None, None])
                  continue
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"candidate_baseline[cargo-control-type:{name}]")
              cargo_controls.append(
                  [
                      name,
                      "file",
                      metadata.st_mode,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  ]
              )
          head_sha = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          if head_sha != expected_sha:
              raise SystemExit(f"candidate_baseline[head:{head_sha}:expected:{expected_sha}]")
          resolved_sha = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "--verify", f"{expected_sha}^{{commit}}"],
              text=True,
          ).strip()
          if resolved_sha != expected_sha:
              raise SystemExit(
                  f"candidate_baseline[object:{resolved_sha}:expected:{expected_sha}]"
              )
          tree_sha = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "--verify", f"{expected_sha}^{{tree}}"],
              text=True,
          ).strip()
          object_format = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "--show-object-format"], text=True
          ).strip()
          if object_format not in {"sha1", "sha256"}:
              raise SystemExit(f"candidate_baseline[object-format:{object_format}]")
          raw = subprocess.check_output(
              ["/usr/bin/git", "ls-tree", "-rz", "--full-tree", expected_sha]
          )
          expected = []
          expected_directories = {"."}
          for record in raw.split(b"\0"):
              if not record:
                  continue
              header, path_bytes = record.split(b"\t", 1)
              mode, kind, object_id = header.decode("ascii").split(" ")
              path = os.fsdecode(path_bytes)
              if kind != "blob" or mode not in {"100644", "100755", "120000"}:
                  raise SystemExit(f"candidate_baseline[unsupported:{mode}:{kind}:{path}]")
              expected.append([path, mode, object_id])
              parent = os.path.dirname(path)
              while parent:
                  expected_directories.add(parent)
                  parent = os.path.dirname(parent)
          if len({entry[0] for entry in expected}) != len(expected):
              raise SystemExit("candidate_baseline[duplicate-path]")
          tools = []
          for label, invocation_text in sorted(tool_paths.items()):
              invocation = pathlib.Path(invocation_text)
              if not invocation.is_absolute():
                  raise SystemExit(f"candidate_baseline[tool-relative:{label}]")
              invocation_metadata = invocation.lstat()
              resolved = invocation.resolve(strict=True)
              resolved_metadata = resolved.lstat()
              if (
                  not stat.S_ISREG(resolved_metadata.st_mode)
                  or not resolved_metadata.st_mode & 0o111
              ):
                  raise SystemExit(f"candidate_baseline[tool-nonregular:{label}]")
              tools.append(
                  {
                      "invocation": str(invocation),
                      "invocation_link": (
                          os.readlink(invocation)
                          if stat.S_ISLNK(invocation_metadata.st_mode)
                          else None
                      ),
                      "invocation_mode": invocation_metadata.st_mode,
                      "label": label,
                      "resolved": str(resolved),
                      "resolved_mode": resolved_metadata.st_mode,
                      "resolved_sha256": hashlib.sha256(resolved.read_bytes()).hexdigest(),
                  }
              )
          payload = json.dumps(
              {
                  "directories": sorted(expected_directories),
                  "files": expected,
                  "git": git_inventory,
                  "object_format": object_format,
                  "cargo_controls": cargo_controls,
                  "cargo_ancestor_controls": cargo_ancestor_controls,
                  "cargo_home": str(cargo_home),
                  "cargo_source_trees": cargo_source_trees,
                  "docker_config": str(docker_config),
                  "docker_config_inventory": docker_config_inventory,
                  "target_root": str(target_root),
                  "target_root_identity": [
                      target_root_metadata.st_dev,
                      target_root_metadata.st_ino,
                      target_root_metadata.st_mode,
                  ],
                  "sysroot": sysroot_control,
                  "sha": expected_sha,
                  "tools": tools,
                  "tree": tree_sha,
              },
              ensure_ascii=True,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("ascii")
          print(tree_sha)
          print(base64.b64encode(payload).decode("ascii"))
          print(hashlib.sha256(payload).hexdigest())
          PY
          }
          PHASE285_CAPTURED_BASELINE="$(capture_candidate_baseline)"
          {
            IFS= read -r PHASE285_CANDIDATE_TREE
            IFS= read -r PHASE285_CANDIDATE_BASELINE
            IFS= read -r PHASE285_CANDIDATE_BASELINE_SHA256
          } <<< "$PHASE285_CAPTURED_BASELINE"
          unset PHASE285_CAPTURED_BASELINE
          PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${PHASE285_CARGO%/*}:${PHASE285_RUSTUP%/*}:${PHASE285_GO%/*}:${PHASE285_ACTIONLINT%/*}:${PHASE285_SHELLCHECK%/*}:${PHASE285_DOCKER%/*}"
          RUSTC="$PHASE285_RUSTC"
          RUSTFMT="$PHASE285_RUSTFMT"
          CLIPPY_DRIVER="$PHASE285_CLIPPY_DRIVER"
          CLIPPY_CONF_DIR="$PWD"
          export PATH RUSTC RUSTFMT CLIPPY_DRIVER CLIPPY_CONF_DIR
          readonly PATH RUSTC RUSTFMT CLIPPY_DRIVER CLIPPY_CONF_DIR PHASE285_BASH PHASE285_GIT PHASE285_PYTHON PHASE285_SHASUM PHASE285_AWK PHASE285_MKTEMP PHASE285_CONNZ_CURL_BIN PHASE285_RUSTUP PHASE285_CARGO PHASE285_RUSTC PHASE285_RUSTFMT PHASE285_CARGO_CLIPPY PHASE285_CLIPPY_DRIVER PHASE285_SYSROOT PHASE285_GO PHASE285_SHELLCHECK PHASE285_DOCKER PHASE285_ACTIONLINT PHASE285_CANDIDATE_TREE PHASE285_CANDIDATE_BASELINE PHASE285_CANDIDATE_BASELINE_SHA256
          PHASE285_ACTIVE_TARGET=
          PHASE285_ACTIVE_TARGET_IDENTITY=
          verify_candidate_inventory() {
            /usr/bin/python3 -I - "$PHASE285_CANDIDATE_BASELINE_SHA256" "$GITHUB_SHA" "$PHASE285_ACTIVE_TARGET" "$PHASE285_ACTIVE_TARGET_IDENTITY" 3<<< "$PHASE285_CANDIDATE_BASELINE" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import sys

          expected_digest = sys.argv[1]
          github_sha = sys.argv[2]
          active_target_text = sys.argv[3]
          active_target_identity = sys.argv[4]
          encoded = os.fdopen(3, encoding="ascii").read().strip()
          payload = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(payload).hexdigest() != expected_digest:
              raise SystemExit("candidate_inventory[baseline-digest]")
          baseline = json.loads(payload)
          if baseline["sha"] != github_sha:
              raise SystemExit(
                  f"candidate_inventory[baseline-sha:{baseline['sha']}:expected:{github_sha}]"
              )
          object_format = baseline["object_format"]
          if object_format not in {"sha1", "sha256"}:
              raise SystemExit(f"candidate_inventory[object-format:{object_format}]")
          algorithm = getattr(hashlib, object_format)
          expected = {
              path: (mode, object_id)
              for path, mode, object_id in baseline["files"]
          }
          if len(expected) != len(baseline["files"]):
              raise SystemExit("candidate_inventory[duplicate-path]")
          expected_directories = set(baseline["directories"])
          root = pathlib.Path.cwd().resolve(strict=True)

          def recursive_inventory(inventory_root):
              entries = [[".", "directory", inventory_root.lstat().st_mode, None]]
              for directory, names, files in os.walk(
                  inventory_root, topdown=True, followlinks=False
              ):
                  names[:] = sorted(names)
                  files = sorted(files)
                  retained_names = []
                  for name in names:
                      path = pathlib.Path(directory) / name
                      relative = path.relative_to(inventory_root).as_posix()
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          entries.append(
                              [relative, "symlink", metadata.st_mode, os.readlink(path)]
                          )
                      elif stat.S_ISDIR(metadata.st_mode):
                          entries.append([relative, "directory", metadata.st_mode, None])
                          retained_names.append(name)
                      else:
                          raise SystemExit(
                              f"candidate_inventory[git-nondirectory:{relative}]"
                          )
                  names[:] = retained_names
                  for name in files:
                      path = pathlib.Path(directory) / name
                      relative = path.relative_to(inventory_root).as_posix()
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          value = os.readlink(path)
                          kind = "symlink"
                      elif stat.S_ISREG(metadata.st_mode):
                          value = hashlib.sha256(path.read_bytes()).hexdigest()
                          kind = "file"
                      else:
                          raise SystemExit(
                              f"candidate_inventory[git-nonregular:{relative}]"
                          )
                      entries.append([relative, kind, metadata.st_mode, value])
              return sorted(entries)

          def directory_control(path, label):
              if not path.exists() and not path.is_symlink():
                  return {"state": "absent"}
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit(f"candidate_inventory[{label}:type]")
              return {
                  "entries": recursive_inventory(path),
                  "identity": [metadata.st_dev, metadata.st_ino, metadata.st_mode],
                  "path": str(path),
                  "state": "directory",
              }

          def ancestor_cargo_controls(inventory_root):
              controls = []
              ancestor = inventory_root.resolve(strict=True).parent
              while True:
                  cargo_directory = ancestor / ".cargo"
                  if cargo_directory.exists() or cargo_directory.is_symlink():
                      directory_metadata = cargo_directory.lstat()
                      if stat.S_ISLNK(directory_metadata.st_mode) or not stat.S_ISDIR(
                          directory_metadata.st_mode
                      ):
                          raise SystemExit(
                              f"candidate_inventory[ancestor-cargo-directory:{cargo_directory}]"
                          )
                  for name in ("config", "config.toml"):
                      path = cargo_directory / name
                      label = str(path)
                      if not path.exists() and not path.is_symlink():
                          controls.append([label, "absent", None, None])
                          continue
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(
                          metadata.st_mode
                      ):
                          raise SystemExit(
                              f"candidate_inventory[ancestor-cargo-control:{label}]"
                          )
                      controls.append(
                          [
                              label,
                              "file",
                              metadata.st_mode,
                              hashlib.sha256(path.read_bytes()).hexdigest(),
                          ]
                      )
                  if ancestor == ancestor.parent:
                      break
                  ancestor = ancestor.parent
              return controls

          git_root = root / ".git"
          git_root_metadata = git_root.lstat()
          if stat.S_ISLNK(git_root_metadata.st_mode) or not stat.S_ISDIR(
              git_root_metadata.st_mode
          ):
              raise SystemExit("candidate_inventory[git-not-real-directory]")
          if recursive_inventory(git_root) != baseline["git"]:
              raise SystemExit("candidate_inventory[git-control-plane]")
          cargo_home = pathlib.Path(baseline["cargo_home"])
          cargo_home_metadata = cargo_home.lstat()
          if stat.S_ISLNK(cargo_home_metadata.st_mode) or not stat.S_ISDIR(
              cargo_home_metadata.st_mode
          ):
              raise SystemExit("candidate_inventory[cargo-home-not-real-directory]")
          observed_cargo_controls = []
          for name in ("config", "config.toml", "credentials", "credentials.toml"):
              path = cargo_home / name
              if not path.exists() and not path.is_symlink():
                  observed_cargo_controls.append([name, "absent", None, None])
                  continue
              metadata = path.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"candidate_inventory[cargo-control-type:{name}]")
              observed_cargo_controls.append(
                  [
                      name,
                      "file",
                      metadata.st_mode,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  ]
              )
          if observed_cargo_controls != baseline["cargo_controls"]:
              raise SystemExit("candidate_inventory[cargo-controls]")
          observed_cargo_source_trees = {
              "git": directory_control(cargo_home / "git", "cargo-git"),
              "registry": directory_control(
                  cargo_home / "registry", "cargo-registry"
              ),
          }
          if observed_cargo_source_trees != baseline["cargo_source_trees"]:
              raise SystemExit("candidate_inventory[cargo-source-trees]")
          if ancestor_cargo_controls(root) != baseline["cargo_ancestor_controls"]:
              raise SystemExit("candidate_inventory[ancestor-cargo-controls]")
          sysroot_path = pathlib.Path(baseline["sysroot"]["path"])
          if directory_control(sysroot_path, "sysroot") != baseline["sysroot"]:
              raise SystemExit("candidate_inventory[sysroot]")
          docker_config = pathlib.Path(baseline["docker_config"])
          docker_config_metadata = docker_config.lstat()
          if stat.S_ISLNK(docker_config_metadata.st_mode) or not stat.S_ISDIR(
              docker_config_metadata.st_mode
          ):
              raise SystemExit("candidate_inventory[docker-config-not-real-directory]")
          if recursive_inventory(docker_config) != baseline["docker_config_inventory"]:
              raise SystemExit("candidate_inventory[docker-config]")
          target_root = pathlib.Path(baseline["target_root"])
          target_root_metadata = target_root.lstat()
          observed_target_root_identity = [
              target_root_metadata.st_dev,
              target_root_metadata.st_ino,
              target_root_metadata.st_mode,
          ]
          if (
              stat.S_ISLNK(target_root_metadata.st_mode)
              or not stat.S_ISDIR(target_root_metadata.st_mode)
              or stat.S_IMODE(target_root_metadata.st_mode) != 0o700
              or observed_target_root_identity != baseline["target_root_identity"]
          ):
              raise SystemExit("candidate_inventory[target-root-identity]")
          target_children = sorted(target_root.iterdir(), key=lambda path: path.name)
          if active_target_text:
              active_target = pathlib.Path(active_target_text)
              if not active_target.is_absolute() or active_target.parent != target_root:
                  raise SystemExit("candidate_inventory[active-target-confinement]")
              if target_children != [active_target]:
                  raise SystemExit("candidate_inventory[active-target-child-set]")
              active_metadata = active_target.lstat()
              observed_active_identity = (
                  f"{active_metadata.st_dev}:{active_metadata.st_ino}:"
                  f"{active_metadata.st_mode}"
              )
              if (
                  stat.S_ISLNK(active_metadata.st_mode)
                  or not stat.S_ISDIR(active_metadata.st_mode)
                  or stat.S_IMODE(active_metadata.st_mode) != 0o700
                  or observed_active_identity != active_target_identity
              ):
                  raise SystemExit("candidate_inventory[active-target-identity]")
          elif active_target_identity or target_children:
              raise SystemExit("candidate_inventory[inactive-target-root-not-empty]")
          for tool in baseline["tools"]:
              invocation = pathlib.Path(tool["invocation"])
              invocation_metadata = invocation.lstat()
              if invocation_metadata.st_mode != tool["invocation_mode"]:
                  raise SystemExit(f"candidate_inventory[tool-mode:{tool['label']}]")
              invocation_link = (
                  os.readlink(invocation)
                  if stat.S_ISLNK(invocation_metadata.st_mode)
                  else None
              )
              if invocation_link != tool["invocation_link"]:
                  raise SystemExit(f"candidate_inventory[tool-link:{tool['label']}]")
              resolved = invocation.resolve(strict=True)
              if str(resolved) != tool["resolved"]:
                  raise SystemExit(f"candidate_inventory[tool-resolved:{tool['label']}]")
              resolved_metadata = resolved.lstat()
              if (
                  resolved_metadata.st_mode != tool["resolved_mode"]
                  or hashlib.sha256(resolved.read_bytes()).hexdigest()
                  != tool["resolved_sha256"]
              ):
                  raise SystemExit(f"candidate_inventory[tool-bytes:{tool['label']}]")
          observed = set()
          observed_directories = {"."}
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              relative_directory = pathlib.Path(directory).relative_to(root)
              names[:] = sorted(name for name in names if not (relative_directory == pathlib.Path(".") and name == ".git"))
              for name in names:
                  path = pathlib.Path(directory) / name
                  if path.is_symlink():
                      raise SystemExit(f"candidate_inventory[symlink-directory:{path.relative_to(root)}]")
                  observed_directories.add(path.relative_to(root).as_posix())
              for name in sorted(files):
                  observed.add((pathlib.Path(directory) / name).relative_to(root).as_posix())
          if observed != set(expected):
              raise SystemExit(
                  f"candidate_inventory[path-set:missing={sorted(set(expected)-observed)}:extra={sorted(observed-set(expected))}]"
              )
          if observed_directories != expected_directories:
              raise SystemExit(
                  f"candidate_inventory[directory-set:missing={sorted(expected_directories-observed_directories)}:extra={sorted(observed_directories-expected_directories)}]"
              )
          for path, (mode, object_id) in sorted(expected.items()):
              candidate = root / path
              metadata = candidate.lstat()
              if mode == "120000":
                  if not stat.S_ISLNK(metadata.st_mode):
                      raise SystemExit(f"candidate_inventory[type:{path}]")
                  payload = os.fsencode(os.readlink(candidate))
              else:
                  if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                      raise SystemExit(f"candidate_inventory[type:{path}]")
                  executable = bool(metadata.st_mode & 0o111)
                  if executable != (mode == "100755"):
                      raise SystemExit(f"candidate_inventory[mode:{path}]")
                  payload = candidate.read_bytes()
              framed = b"blob " + str(len(payload)).encode("ascii") + b"\0" + payload
              if algorithm(framed).hexdigest() != object_id:
                  raise SystemExit(f"candidate_inventory[bytes:{path}]")
          print(
              f"phase285_candidate_inventory sha={baseline['sha']} tree={baseline['tree']} "
              f"baseline={expected_digest} files={len(expected)} "
              f"directories={len(expected_directories)} tools={len(baseline['tools'])} "
              f"git_entries={len(baseline['git'])} cargo_controls=4 docker_config=empty "
              f"cargo_ancestor_controls={len(baseline['cargo_ancestor_controls'])} "
              f"sysroot_entries={len(baseline['sysroot']['entries'])} "
              f"target_root_identity=exact bytes_modes_tools_git_cargo_docker_sysroot=exact passed=1"
          )
          PY
          }
          verify_candidate_inventory_on_exit() {
            local prior_status=$?
            trap - EXIT
            verify_candidate_inventory || prior_status=1
            if test -n "$PHASE285_ACTIVE_TARGET"; then
              cleanup_assurance_target || prior_status=1
            fi
            exit "$prior_status"
          }
          run_assured() {
            local command_status=0 verification_status=0 cleanup_status=0
            verify_candidate_inventory || return $?
            allocate_assurance_target || return $?
            "$@" || command_status=$?
            verify_candidate_inventory || verification_status=$?
            cleanup_assurance_target || cleanup_status=$?
            if test "$verification_status" -ne 0; then
              return "$verification_status"
            fi
            if test "$cleanup_status" -ne 0; then
              return "$cleanup_status"
            fi
            return "$command_status"
          }
          run_assured_expect_status() {
            local expected_status="$1" command_status=0 verification_status=0 cleanup_status=0
            shift
            verify_candidate_inventory || return $?
            allocate_assurance_target || return $?
            "$@" || command_status=$?
            verify_candidate_inventory || verification_status=$?
            cleanup_assurance_target || cleanup_status=$?
            if test "$verification_status" -ne 0; then
              return "$verification_status"
            fi
            if test "$cleanup_status" -ne 0; then
              return "$cleanup_status"
            fi
            test "$command_status" -eq "$expected_status"
          }
          allocate_assurance_target() {
            local created_target
            test -z "$PHASE285_ACTIVE_TARGET" || {
              echo "Phase 285 assurance target already active" >&2
              return 2
            }
            case "$PHASE285_TARGET_ROOT" in
              /*) ;;
              *) echo "Phase 285 assurance target root is not absolute" >&2; return 2 ;;
            esac
            case "$PHASE285_TARGET_ROOT/" in
              "$PWD/"*) echo "Phase 285 assurance target root overlaps checkout" >&2; return 2 ;;
            esac
            case "$PWD/" in
              "$PHASE285_TARGET_ROOT/"*) echo "Phase 285 checkout overlaps assurance target root" >&2; return 2 ;;
            esac
            created_target="$("$PHASE285_MKTEMP" -d "$PHASE285_TARGET_ROOT/command.XXXXXXXX")"
            PHASE285_ACTIVE_TARGET_IDENTITY="$(
              /usr/bin/python3 -I - "$created_target" <<'PY'
          import pathlib
          import stat
          import sys

          target = pathlib.Path(sys.argv[1])
          metadata = target.lstat()
          if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
              raise SystemExit("phase285_assurance_target[type]")
          if stat.S_IMODE(metadata.st_mode) != 0o700:
              raise SystemExit("phase285_assurance_target[mode]")
          print(f"{metadata.st_dev}:{metadata.st_ino}:{metadata.st_mode}")
          PY
            )"
            PHASE285_ACTIVE_TARGET="$created_target"
            CARGO_TARGET_DIR="$created_target"
            export CARGO_TARGET_DIR
            echo "phase285_assurance_target allocated=${created_target##*/}"
          }
          cleanup_assurance_target() {
            test -n "$PHASE285_ACTIVE_TARGET" || {
              echo "Phase 285 assurance target is not active" >&2
              return 2
            }
            /usr/bin/python3 -I - "$PHASE285_TARGET_ROOT" "$PHASE285_ACTIVE_TARGET" "$PHASE285_ACTIVE_TARGET_IDENTITY" <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import sys

          root = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          expected_identity = sys.argv[3]
          root_metadata = root.lstat()
          target_metadata = target.lstat()
          if stat.S_ISLNK(root_metadata.st_mode) or not stat.S_ISDIR(root_metadata.st_mode):
              raise SystemExit("phase285_assurance_cleanup[root-type]")
          if not target.is_absolute() or target.parent != root:
              raise SystemExit("phase285_assurance_cleanup[confinement]")
          if not target.name.startswith("command."):
              raise SystemExit("phase285_assurance_cleanup[name]")
          if stat.S_ISLNK(target_metadata.st_mode) or not stat.S_ISDIR(target_metadata.st_mode):
              raise SystemExit("phase285_assurance_cleanup[target-type]")
          if stat.S_IMODE(target_metadata.st_mode) != 0o700:
              raise SystemExit("phase285_assurance_cleanup[target-mode]")
          observed_identity = (
              f"{target_metadata.st_dev}:{target_metadata.st_ino}:"
              f"{target_metadata.st_mode}"
          )
          if observed_identity != expected_identity:
              raise SystemExit("phase285_assurance_cleanup[target-identity]")
          shutil.rmtree(target)
          if os.path.lexists(target):
              raise SystemExit("phase285_assurance_cleanup[residue]")
          PY
            echo "phase285_assurance_target removed=${PHASE285_ACTIVE_TARGET##*/}"
            PHASE285_ACTIVE_TARGET=
            PHASE285_ACTIVE_TARGET_IDENTITY=
            unset CARGO_TARGET_DIR
            verify_candidate_inventory
          }
          verify_integrity_roots() {
            local observed_launcher_sha observed_manifest_sha
            observed_launcher_sha="$(/usr/bin/shasum -a 256 tools/check-phase285-witness-integrity.sh | /usr/bin/awk '{print $1}')"
            observed_manifest_sha="$(/usr/bin/shasum -a 256 tools/fixtures/phase285-witness-integrity.json | /usr/bin/awk '{print $1}')"
            test "$observed_launcher_sha" = "$PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256" || {
              echo "Phase 285 integrity launcher root mismatch" >&2
              return 1
            }
            test "$observed_manifest_sha" = "$PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256" || {
              echo "Phase 285 integrity manifest root mismatch" >&2
              return 1
            }
          }
          trap verify_candidate_inventory_on_exit EXIT

          PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256=e59ba9f62bf126bccdf8c0d3331b54adae9e74f8fe1ee6e31d43e3dec9ca66b1
          PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256=802c330e10a65524414564e0a47e4c35787c44a00698962a2f86cb80ac71957d
          export PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256 PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256
          readonly PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256 PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256
          verify_integrity_roots
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh --integrity-self-test
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh response-failure-wire
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh candidate-verifier
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh protocol-checkpoint
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh atomic-store-contract
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh in-memory-differential
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh typed-proxy
          run_assured /bin/bash tools/check-phase285-witness-integrity.sh transport-layering

          run_assured /bin/bash tools/check-witness-dependency-closure.sh --library-only
          run_assured /bin/bash tools/check-witness-dependency-closure.sh --current-targets

          run_assured /bin/bash tools/with-nats-jetstream.sh --relay-service-checkpoint /usr/bin/env PHASE285_CONNZ_CURL_BIN="$PHASE285_CONNZ_CURL_BIN" PHASE285_SERVICE_CHECKPOINT_TREE="$PHASE285_CANDIDATE_TREE" PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256="$PHASE285_WITNESS_INTEGRITY_LAUNCHER_SHA256" PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256="$PHASE285_WITNESS_INTEGRITY_MANIFEST_SHA256" /bin/bash tools/check-phase285-witness-integrity.sh --focused-service-checkpoint-ci-harness

          run_assured "$PHASE285_CARGO" clippy -p swarm-governance -p swarm-governance-witness --all-targets --all-features --locked --offline -- -D warnings
          run_assured "$PHASE285_SHELLCHECK" --norc tools/check-gates-wired.sh tools/check-negative-registry.sh tools/check-phase285-witness-conformance.sh tools/check-phase285-witness-integrity.sh tools/check-witness-dependency-closure.sh tools/with-nats-jetstream.sh
          run_assured "$PHASE285_ACTIONLINT" .github/workflows/ci.yml

          run_assured /bin/bash tools/check-phase285-witness-conformance.sh --self-test
          run_assured /bin/bash tools/check-phase285-deployment.sh --self-test
          run_assured /bin/bash tools/check-phase285-closure.sh --self-test
          run_assured /bin/bash tools/check-phase285-evidence.sh --self-test
          run_assured /bin/bash tools/check-phase285-plan-schema.sh --self-test
          run_assured /bin/bash tools/check-gates-wired.sh --phase285-self-test
          if test -x tools/check-phase285-governance-persistence.sh; then
            run_assured /bin/bash tools/check-phase285-governance-persistence.sh --self-test
          elif run_assured_expect_status 127 /bin/bash tools/check-phase285-governance-persistence.sh --self-test; then
            echo "missing target confirmed: Plan 05A owns tools/check-phase285-governance-persistence.sh"
          else
            echo "absent governance checker status or assured inventory differed" >&2
            exit 1
          fi
          }
          readonly -f phase285_assurance_main
          phase285_assurance_main

  # Phase 285 runs these gates on separate fresh hosted runners. Each job has
  # only the pinned credential-free checkout before the gate, and its explicit
  # custom shell makes /usr/bin/env the first child instead of a PATH-resolved
  # default Bash. This prevents earlier repository commands, caches,
  # GITHUB_ENV, or GITHUB_PATH from affecting either gate's bootstrap.
  # Two warm local clean-launch runs of the preceding 179-self-test registry gate
  # took 89.73s and 78.19s wall clock (38.51/38.17s user, 16.18/15.26s sys) on
  # Darwin 25.4.0 arm64 with rustc 1.97.1 on 2026-08-15. The current gate adds four
  # lexical workflow-name mutations and fourteen governance-assurance mutations; it
  # also executes the exact 94-case single-governor gate inside the protected
  # contract. These are local observations, not a CI estimate; compiled
  # actual-source mutations dominate.
  mapping-contract:
    name: mapping-contract (${{ github.sha }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check the invariant map against the source markers
        shell: /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: tools/check-mapping.sh

  negative-registry-contract:
    name: negative-registry-contract (${{ github.sha }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check every mapped invariant has a falsifying negative test
        shell: /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: tools/check-negative-registry.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Cache cargo home
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check

  panic-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` for the visibility baseline check at the end of this
          # job: it compares declarations against the phase-282 baseline commit
          # 742206d, and the default depth-1 checkout does not contain it. The
          # script fails loudly rather than passing when the commit is missing,
          # so a shallow clone here is a red job, not a silent one.
          fetch-depth: 0

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check runtime panic contract
        run: bash tools/check-runtime-panic-contract.sh

      # No toolchain needed; kept in this job because it is a fast static check.
      # A live Ed25519 seed sat tracked at rulesets/data/agent-keys/ from 69814a4
      # until the repo went public, and no gate looked for it.
      - name: Check for committed key material
        run: bash tools/check-no-committed-keys.sh

      # INCFIX-03. No toolchain needed; another fast static check. `#[path =
      # "x.inc"]` pulls real Rust into a crate that rust-analyzer and every
      # LOC/complexity tool skip, because they find code by globbing `*.rs` --
      # which is how crates/swarm-cli/src/core.inc reached 5,394 lines without
      # showing up in any size measurement. (rustc, clippy and rustfmt DO follow
      # `#[path]`; that file is fully formatted. See the script header.) Phase 281
      # converted the single-owner ones; this keeps new ones out. core.inc itself
      # is a single dated allowlist entry, deferred to phase 282.
      - name: Check for non-.rs Rust source
        run: bash tools/check-no-include-files.sh

      # SPLIT-05. Phase 282's no-widening invariant, re-baselined at the three
      # widenings ADR 0006 records and accepts, and enforced instead of asserted:
      # an item that was `pub(crate)`/`pub(super)`/`pub(in ...)` at 742206d and is
      # `pub` now fails this step unless it is one of the three. `pub` on a crate
      # is public API forever, so the fourth one is worth a review rather than a
      # commit message. Needs history -- see `fetch-depth: 0` on this job's
      # checkout.
      - name: Check visibility baseline
        run: bash tools/check-visibility-baseline.sh

      # Task #15. Three check scripts existed for months and were invoked by no
      # workflow at all, and tools/verify-release-hardening.sh -- which proves
      # the flags that harden the two binaries the container ships -- had never
      # run anywhere. Nothing detected any of it; a human read the directory.
      #
      # A gate that never runs is not a gate. This makes the omission mechanical
      # rather than something someone has to notice. No toolchain needed beyond
      # python3, so it belongs in this job for the reason stated at the top of
      # it: fast static checks live here.
      #
      # It is NOT a grep. `grep -q tools/x.sh .github/workflows/*.yml` counts a
      # comment, an `on: paths:` filter and a step under `if: false` as "wired";
      # this walks jobs -> steps -> `run:` scalars, and only a real command
      # counts. Counting a name-match as a behaviour-match is the pattern
      # .planning/STATE.md records three times.
      - name: Check every gate script is wired into a workflow
        run: bash tools/check-gates-wired.sh

      # TCBOUND-03 / TCBOUND-04. `swarm-policy`, `swarm-crypto` and
      # `swarm-spine` are the trusted computing base (ADR 0009): if any of the
      # three is wrong, every other assurance in the system is decoration. They
      # were dependency-clean by review attention and by nothing else, with six
      # milestones of capability queued to be built around them.
      #
      # In THIS job, not `build`, because it needs no build artifacts -- it
      # reads `cargo metadata`, which resolves without compiling -- and because
      # this job is where the fast static checks live. It does need the
      # toolchain, which this job already installs. Measured 6.3s wall clock in
      # a warm worktree, ten `cargo metadata` runs included.
      #
      # It is not a manifest grep. Rule 3 reads the RESOLVED normal graph, which
      # is how it catches a transport that arrives through `swarm-core` without
      # any TCB manifest changing -- the case ADR 0008 shows a declared-edge
      # reading cannot see. The rule-by-rule declared/resolved ruling, and the
      # one measured deviation the shipped tree already carries
      # (`swarm-spine -> swarm-response -> reqwest -> hyper`), are in ADR 0009.
      #
      # THE FIXTURE IS THE POINT. A layering script that has never been observed
      # to fail is the eleventh entry in .planning/STATE.md's defect catalogue.
      # Every invocation generates a real miniature cargo workspace, runs the
      # SAME rule engine with the SAME policy and baseline over it, proves the
      # clean fixture exits 0, then breaks it ten ways and proves each break is
      # caught with the right diagnostic. Five of the ten are cases cargo
      # itself accepts (dev/build cycles, a normal allow-list escape, and
      # transitive transport edges),
      # so they are violations nothing else in this pipeline would reject.
      - name: Check the trusted-computing-base layering boundary
        run: bash tools/check-workspace-layering.sh

      # BFT-03 / phase 321 criterion 3. The criterion reads "no production path
      # holds more than one governor signing key in memory" and names no method
      # of checking it, which makes it satisfiable by assertion -- the exact
      # pattern phase 321 exists to repair.
      #
      # This is the WEAKEST of the three mechanisms and its header says so. The
      # type (`LocalGovernorKey`, no `SigningKey` accessor) and the test
      # (`register_governor` returns Err on a second distinct key) are the
      # guarantee; this gate scans the three governance signing paths and pins
      # the shipped opaque-handle source, impl, and public-API inventories. It
      # still cannot prove that no other `GovernancePolicy` instance exists in a
      # process; the shipped builder's same-Arc identity test covers its concrete
      # dispatcher/ingest/containment/resume composition.
      #
      # It runs a FIXTURE on every invocation before it touches the real tree:
      # fifty-two planted violations that must be caught and six controls that
      # must not be, including a keyring inside `#[cfg(test)]` and one named only in
      # a comment. Three identifier-grep sweeps in this repository's history
      # declared themselves complete and were wrong; a grep that has never been
      # observed to fail is not evidence. Its compiler red also proves the
      # crate-level unsafe-code prohibition; this job already installs the pinned
      # Rust toolchain.
      - name: Check no production path holds a governor keyring
        run: bash tools/check-single-governor-key.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ingest::tests::generated_python_client_smoke_tests_live_platform_router
      # shells out to `uv` to exercise the GENERATED python client in
      # clients/python/ against a live platform router. Without uv on PATH the
      # test failed `Os { code: 2, kind: NotFound }` on every CI run since the
      # pipeline first executed, and it was the last remaining failure in this
      # job. A smoke test for a shipped artifact that never runs in CI is not a
      # gate, so the toolchain is installed rather than the test skipped.
      - name: Install uv (python toolchain for the generated-client smoke test)
        uses: astral-sh/setup-uv@v5

      - name: Run tests (workspace, parallel)
        run: cargo test --workspace --exclude swarm-runtime --exclude swarm-ingest-runtime

      # The `ingest::tests` module mutates shared `SWARM_*_TEST_TOKEN` environment
      # variables across its platform_api tests; the env race is
      # cargo-test-thread-scoped, so the crates holding it run serially. Tracked as
      # follow-up to scope the lock inside the affected tests instead of the whole
      # crate.
      #
      # `swarm-ingest-runtime` IS ON THIS LINE BECAUSE `ingest::tests` IS. SPLIT-05
      # moved `ingest/` out of `swarm-runtime`, and its 115 unit tests went with it
      # -- so the module this workaround was written for is now in the new crate and
      # the serial lane has to follow it. Leaving it in the parallel step above
      # reintroduces the exact race this step exists to avoid, at roughly 3 runs in
      # 5:
      #
      #   $ for i in 1 2 3 4 5; do cargo test -p swarm-ingest-runtime --lib; done
      #   test result: FAILED. 113 passed; 2 failed
      #   test result: ok.     115 passed; 0 failed
      #   test result: FAILED. 114 passed; 1 failed
      #   test result: ok.     115 passed; 0 failed
      #   test result: FAILED. 114 passed; 1 failed
      #
      #   $ for i in 1 2 3 4 5; do cargo test -p swarm-ingest-runtime --lib -- --test-threads=1; done
      #   test result: ok. 115 passed; 0 failed   (x5)
      #
      # `swarm-runtime` stays on the line too: nothing proved its remaining tests are
      # parallel-safe, and this phase is not the place to find out.
      - name: Run ingest and runtime tests (serial, env-var race workaround)
        run: cargo test -p swarm-runtime -p swarm-ingest-runtime -- --test-threads=1

      # FIXTURE-04. Test call sites, not the production config shape, keep the
      # suite out of the working tree, so a NEW test can silently reintroduce
      # drift. This step closes that mechanically.
      #
      # `if: always()` is load-bearing: without it a red test step skips this
      # one, and the gate would be inert on exactly the runs most likely to
      # leave the tree dirty.
      #
      # The four assertions moved to tools/check-worktree-clean.sh, byte for
      # byte and comment for comment, so the proof-surfaces job can run the
      # SAME four rather than a paraphrase. The history that makes two of them
      # look redundant -- `git status` never reporting an empty directory, and
      # the leaked store roots being gitignored so `--porcelain` went quiet --
      # moved with them and is the reason neither is safe to delete.
      - name: Assert the suite left the working tree clean
        if: always()
        run: bash tools/check-worktree-clean.sh "the test run"

  # THE SOLVER LANE, WHICH NO JOB ABOVE COMPILES.
  #
  # `swarm-runtime` and `swarm-evolution` both declare an optional `z3` feature
  # (`z3 = ["dep:z3"]`). Every step above builds with default features, so
  # everything under `#[cfg(feature = "z3")]` -- which is the ENTIRE real solver
  # implementation, `evaluate_custom_z3_invariant_impl` in
  # `crates/swarm-runtime/src/evolution/formal_safety.rs`, plus the three tests
  # that exercise it -- was never compiled, never linted and never run anywhere in
  # this pipeline. `grep -c z3 .github/workflows/ci.yml` was 0.
  #
  # That is the same shape as the python-client smoke test in the `test` job
  # above: a lane that exists in the repository and is executed by nothing. It is
  # worse here, because the code it covers is what decides whether an evolved
  # detector is formally safe.
  #
  # SCOPE. This job compiles, lints and RUNS the feature. It is not a
  # type-check-only lane: `cargo test --features z3` below executes
  # `z3_custom_invariant_proves_unsat_and_persists_proof` and
  # `z3_proof_persists_machine_readable_counterexample`, so the solver is
  # exercised end to end and not merely proved to parse.
  #
  # PROVISIONING. `z3 = { version = "0.20", features = ["gh-release"] }`, so
  # `z3-sys`'s build script DOWNLOADS a prebuilt z3 from GitHub releases rather
  # than needing libz3-dev or a source build. Measured in this worktree: a cold
  # `cargo check -p swarm-runtime --features z3 --all-targets` finished in 58s and
  # the test run in 1m06s. The download is a network fetch at build time; it is
  # not preserved: this lane restores registry/git sources only, then uses a cold,
  # uncached target directory and downloads the solver again. If GitHub releases
  # ever becomes unreachable this job fails loudly, which is the correct failure
  # -- silently not compiling the solver is what this job exists to end.
  solver-z3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `--all-targets` so the `#[cfg(feature = "z3")]` TESTS are linted too, not
      # just the library. Without it the three z3 tests stay unlinted even here.
      - name: Lint the solver lane with clippy
        run: >
          cargo clippy -p swarm-runtime -p swarm-evolution
          --features swarm-runtime/z3,swarm-evolution/z3
          --all-targets -- -D warnings

      # Serial for the same reason the sibling `test` job runs swarm-runtime
      # serially: nothing has proved its tests are parallel-safe.
      - name: Run the solver lane
        run: cargo test -p swarm-runtime --features z3 -- --test-threads=1

      - name: Assert the solver lane left the working tree clean
        if: always()
        run: bash tools/check-worktree-clean.sh "the z3 solver lane"

  fixture-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check detector experiment fixture freshness
        run: bash tools/check-fixture-freshness.sh

  platform-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # tools/check-platform-openapi.sh validates the committed spec through
      # `uvx --from openapi-spec-validator`, so it needs uv on PATH for the same
      # reason 64cb1be installed it in the test job.
      - name: Install uv (uvx runs the OpenAPI validator)
        uses: astral-sh/setup-uv@v5

      # Task #15. This script existed and no workflow ran it. Nothing else in
      # the repo checks that docs/openapi/v2-platform-openapi.json is valid
      # OpenAPI 3.1, or that it still matches what generate_platform_openapi
      # emits -- and clients/python/ is GENERATED FROM THAT FILE, so a stale
      # spec ships a wrong client while every other gate stays green.
      #
      # ITS OWN JOB, not a step appended to `test`. A step only runs when the
      # preceding steps of its job succeeded, so putting it there means any red
      # test masks a broken API contract. It is also the only job besides `test`
      # that needs uv and outbound PyPI, which is cleaner isolated: when PyPI is
      # having a day, exactly one job goes red.
      - name: Check platform OpenAPI contract
        run: bash tools/check-platform-openapi.sh

  proof-surfaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-sources-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-sources-v1-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Task #15. python3 only; ubuntu-latest ships it and four already-wired
      # check scripts rely on it. No services, no network.
      #
      # The tests this runs also run in the `test` job, so the CI minutes are
      # NOT justified by the tests -- they are justified by the comparison
      # against docs/benchmarks/stigmergic-feedback-baseline.json, which nothing
      # else performs. behavioral_anomaly.rs asserts only that the sigma counts
      # are ordered and non-zero; the published 3-sigma=2 / 2-sigma=4 /
      # 1-sigma=13 were pinned nowhere until this step.
      #
      # NOT a step in `benchmark`: that job's hot-path step is followed by an
      # `if: always()` artifact upload, and appending here would let a criterion
      # regression mask a baseline regression. NOT in `test`: a red test would
      # skip it.
      - name: Check stigmergic feedback benchmark against its tracked baseline
        run: bash tools/check-stigmergic-feedback-benchmark.sh

      # `!cancelled()` rather than chaining: these two gates are independent, and
      # a red stigmergic baseline must not hide an adversary-coverage regression.
      #
      # Its marginal value over the `test` job, which already runs both of its
      # cargo test lines: generate_adversary_emulation_report has never executed
      # in CI at all -- nothing else exercises that bin, its serialization, or
      # its behaviour from the repo root -- and the published 23 techniques / 4
      # detected / 19 partial / 0 not_covered / 100% were asserted nowhere.
      - name: Check adversary emulation coverage against its tracked baseline
        if: ${{ !cancelled() }}
        run: bash tools/check-adversary-emulation-coverage.sh

      # Same four assertions the test job carries, for the same reason: these
      # gates run cargo test and a report generator, so their residue footprint
      # has to be measured, not assumed. `if: always()` for the reason spelled
      # out on the test job's copy.
      - name: Assert the proof surfaces left the working tree clean
        if: always()
        run: bash tools/check-worktree-clean.sh "the proof-surface run"

  jetstream:
    runs-on: ubuntu-latest
    steps:
