name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/ci

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  panic-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check runtime panic contract
        run: bash tools/check-runtime-panic-contract.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --all-targets

  clippy:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests (workspace, parallel)
        run: cargo test --workspace --exclude swarm-runtime

      # swarm-runtime's `ingest::tests` module mutates shared `SWARM_*_TEST_TOKEN`
      # environment variables across its platform_api tests; the env race is
      # cargo-test-thread-scoped, so this single crate runs serially. Tracked as
      # follow-up to scope the lock inside the affected tests instead of the whole
      # crate.
      - name: Run swarm-runtime tests (serial, env-var race workaround)
        run: cargo test -p swarm-runtime -- --test-threads=1

      # FIXTURE-04. Test call sites, not the production config shape, keep the
      # suite out of the working tree, so a NEW test can silently reintroduce
      # drift. This step closes that mechanically.
      #
      # `if: always()` is load-bearing: without it a red test step skips this
      # one, and the gate would be inert on exactly the runs most likely to
      # leave the tree dirty.
      #
      # `--porcelain` (tracked files) is the binding assertion. Ignored
      # droppings are REPORTED, not enforced: `experiments/mutation-*.yaml` and
      # friends are gitignored, so hundreds can accumulate while `--porcelain`
      # stays empty -- which is exactly how 715 of them went unnoticed.
      - name: Assert the suite left the working tree clean
        if: always()
        run: |
          ignored_count="$(git status --porcelain --ignored | grep -c '^!!' || true)"
          echo "ignored entries after the suite: $ignored_count"
          git status --porcelain --ignored | grep '^!!' || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test run mutated tracked files"
            git status --porcelain
            exit 1
          fi

  fixture-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check detector experiment fixture freshness
        run: bash tools/check-fixture-freshness.sh

  jetstream:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run JetStream substrate suite
        run: bash tools/with-nats-jetstream.sh cargo test -p swarm-pheromone --test jetstream --test multi_instance -- --ignored

  benchmark:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run hot-path regression gate
        env:
          STS_HOT_PATH_BENCH_LOG: artifacts/benchmarks/hot-path-regression.log
        run: bash tools/check-hot-path-regression.sh

      - name: Upload benchmark regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-path-benchmark-${{ github.sha }}
          path: artifacts/benchmarks/hot-path-regression.log
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Run supply-chain checks
        run: bash tools/check-supply-chain.sh
