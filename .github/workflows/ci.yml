name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/ci

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  panic-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check runtime panic contract
        run: bash tools/check-runtime-panic-contract.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --all-targets

  clippy:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests (workspace, parallel)
        run: cargo test --workspace --exclude swarm-runtime

      # swarm-runtime's `ingest::tests` module mutates shared `SWARM_*_TEST_TOKEN`
      # environment variables across its platform_api tests; the env race is
      # cargo-test-thread-scoped, so this single crate runs serially. Tracked as
      # follow-up to scope the lock inside the affected tests instead of the whole
      # crate.
      - name: Run swarm-runtime tests (serial, env-var race workaround)
        run: cargo test -p swarm-runtime -- --test-threads=1

      # FIXTURE-04. Test call sites, not the production config shape, keep the
      # suite out of the working tree, so a NEW test can silently reintroduce
      # drift. This step closes that mechanically.
      #
      # `if: always()` is load-bearing: without it a red test step skips this
      # one, and the gate would be inert on exactly the runs most likely to
      # leave the tree dirty.
      #
      # This step used to compute `ignored_count`, echo it, and then assert ONLY
      # on `git status --porcelain`. That made it inert for the regression it
      # exists to catch, for two independent reasons:
      #
      #   1. the leaked store roots had been `git rm --cached`-ed AND added to
      #      .gitignore, so a recurrence is ignored and `--porcelain` stays
      #      empty;
      #   2. `git status` NEVER reports an empty directory, ignored or not, and
      #      the two leaks that survived phase 284 created only empty
      #      directories -- `crates/swarm-runtime/data/evolution-population/`
      #      and `.../evolution-assurance-cases/{reports,scenarios}/`.
      #
      # So the assertions below are on things that actually change when the
      # suite dirties the tree. `find` is used for the store roots precisely
      # because it is immune to .gitignore and does see empty directories.
      - name: Assert the suite left the working tree clean
        if: always()
        run: |
          status=0

          echo "== tracked files =="
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test run mutated tracked files"
            git status --porcelain
            status=1
          else
            echo "clean"
          fi

          echo "== crate-local store roots (ignore-proof, sees empty dirs) =="
          crate_residue="$(
            find crates -maxdepth 2 \
              \( -name data -type d -o -name dead-letter.jsonl -type f \) \
              -print | sort
          )"
          if [ -n "$crate_residue" ]; then
            echo "::error::the test run created store roots inside crates/"
            printf '%s\n' "$crate_residue" | while IFS= read -r path; do
              find "$path" -print | sort
            done
            status=1
          else
            echo "clean"
          fi

          echo "== untracked and ignored residue outside target/ =="
          # `--ignored=matching -uall` is required: the default `--ignored`
          # collapses to the ignored DIRECTORY and omits empty ones entirely.
          # Restricted to `??`/`!!` so it reports residue only; modified tracked
          # files are the first check's business.
          tree_residue="$(
            git status --porcelain --ignored=matching -uall \
              | grep -E '^(\?\?|!!) ' \
              | grep -v '^!! target/' || true
          )"
          if [ -n "$tree_residue" ]; then
            echo "::error::the test run left files in the working tree"
            echo "$tree_residue"
            status=1
          else
            echo "clean"
          fi

          echo "== stray empty directories anywhere in the tree =="
          # git cannot track an empty directory, so a fresh checkout has exactly
          # zero of them (verified on 4fdcd22). Any empty directory is therefore
          # residue by construction. This is the only check of the four that is
          # not scoped to a path list: `rulesets/data/deception-lifecycle` slipped
          # past the other three because they look under `crates/` (and because
          # `git status` never reports an empty directory, ignored or not).
          # Do NOT replace this with `find crates rulesets -name data`: `rulesets/data`
          # is a tracked directory and would fail the gate permanently.
          empty_dirs="$(
            find . -type d -empty \
              -not -path './.git/*' -not -path './target/*' \
              -print | sort
          )"
          if [ -n "$empty_dirs" ]; then
            echo "::error::the test run created empty directories in the checkout"
            printf '%s\n' "$empty_dirs"
            status=1
          else
            echo "clean"
          fi

          exit "$status"

  fixture-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check detector experiment fixture freshness
        run: bash tools/check-fixture-freshness.sh

  jetstream:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run JetStream substrate suite
        run: bash tools/with-nats-jetstream.sh cargo test -p swarm-pheromone --test jetstream --test multi_instance -- --ignored

  benchmark:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Restore shared target cache
        uses: actions/cache@v4
        with:
          path: target/ci
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run hot-path regression gate
        env:
          STS_HOT_PATH_BENCH_LOG: artifacts/benchmarks/hot-path-regression.log
        run: bash tools/check-hot-path-regression.sh

      - name: Upload benchmark regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-path-benchmark-${{ github.sha }}
          path: artifacts/benchmarks/hot-path-regression.log
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Run supply-chain checks
        run: bash tools/check-supply-chain.sh
