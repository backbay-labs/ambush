# DST-04 (nightly half). The deterministic-simulation harness
# (crates/swarm-runtime/tests/dst_fault_injection.rs) proves receipt-before-action,
# exact-disposition, and no-double-dispatch hold under injected crash/scheduling
# faults over the REAL SwarmRuntime::authorize_and_execute, gate, and substrate.
# The PR lane (ci.yml's `test` job) runs the 64-seed corpus on every push/PR; THIS
# workflow runs the >= 5,000-seed deep corpus -- too slow for the PR lane, but the
# scale at which a rare oracle-violating seed the 64-seed lane never reached would
# surface. The deep-corpus test is `#[ignore]`d so it never runs in the PR lane;
# on any violation it fails NAMING the exact seed, reproducible in isolation with
# `SWARM_DST_SEED=<n> cargo test -p swarm-runtime --test dst_fault_injection`.
name: DST Nightly

on:
  schedule:
    # 06:23 UTC daily. Off the hour boundary per GitHub's guidance -- on-the-hour
    # schedules contend for the shared cron pool and are delayed or dropped.
    - cron: "23 6 * * *"
  # Manual trigger so the deep corpus can be run on demand (e.g. before a risky
  # change to the runtime's dispatch/receipt path) without waiting for the cron.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/ci

jobs:
  dst-nightly:
    name: DST deep corpus (>= 5000 seeds)
    runs-on: ubuntu-latest
    # Generous headroom for a cold build plus the 5,000-seed run; the corpus
    # itself is fast (each episode is a handful of synchronous in-memory polls),
    # so this bounds a hang, not the expected duration.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: cargo-home-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # `--ignored` selects the `#[ignore]`d deep-corpus test (the only ignored
      # test in this binary); `--test-threads=1` matches ci.yml's swarm-runtime
      # lane (its tests are not proven parallel-safe) and the harness is a
      # single-threaded deterministic executor regardless. A violation fails the
      # step loudly, naming the seed for one-command reproduction.
      - name: Run the DST deep corpus (>= 5000 seeds)
        run: cargo test -p swarm-runtime --test dst_fault_injection -- --ignored --test-threads=1
