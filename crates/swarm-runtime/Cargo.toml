[package]
name = "swarm-runtime"
description = "Rust-first runtime wiring detection, substrate, policy, and response"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
z3 = ["dep:z3"]

[dependencies]
async-trait.workspace = true
# NOT REMOVED BY SPLIT-01, AND SPLIT-01 SAID IT WOULD BE. SPLIT-01 names six
# transport dependencies to take out of this manifest; five left with the moved
# code (`hyper` and `hyper-util` are now reachable only through `axum` and
# `tonic`, `tokio-rustls` only through `async-nats`, and `rustls-pemfile` and
# `x509-parser` are out of this crate's graph entirely). `axum` did not, because
# two things below the split still name it in NON-TEST code: `ingest/` imports
# it directly in six files, and `http/rate_limit.rs` -- which stayed because
# `ingest` uses it -- imports `axum::http::HeaderMap`. Both belong to SPLIT-05
# (`swarm-ingest-runtime`), so this edge leaves with that extraction, not this
# one. See `src/http/mod.rs` for the full argument. Do not read the absence of
# the other five as evidence that this crate is off the transport stack.
axum.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
swarm-core.workspace = true
swarm-consensus.workspace = true
swarm-ingest-json.workspace = true
swarm-ingest-sentinel.workspace = true
swarm-ingest-taxii.workspace = true
swarm-ingest-tetragon.workspace = true
swarm-policy.workspace = true
swarm-response.workspace = true
swarm-whisker.workspace = true
swarm-pheromone.workspace = true
swarm-spine.workspace = true
swarm-crypto.workspace = true
swarm-guard.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
prometheus-client.workspace = true
arc-swap.workspace = true
rand_core.workspace = true
uuid.workspace = true
sysinfo.workspace = true
reqwest.workspace = true
zeroize.workspace = true
z3 = { version = "0.20", optional = true, features = ["gh-release"] }

[dev-dependencies]
# Dev-only, and it must stay dev-only. `swarm-agents` depends on this crate, so a
# normal dependency here is a Cargo cycle and is rejected outright. The root's
# integration tests construct concrete agents; its non-test code does not.
swarm-agents.workspace = true
# Dev-only for the same reason, and the same way round: `swarm-ingest-runtime`
# depends on this crate, so a normal entry here is the Cargo cycle SPLIT-05 is
# organised around. The root's integration tests, examples and benches still
# drive the ingest router, `control` and `anti_tamper`; its lib and bins do not
# name them at all.
swarm-ingest-runtime.workspace = true
criterion = { version = "0.5", features = ["async_tokio"] }
tower.workspace = true

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true
