[package]
name = "swarm-runtime"
description = "Rust-first runtime wiring detection, substrate, policy, and response"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
z3 = ["dep:z3"]

[dependencies]
async-trait.workspace = true
# STILL NOT REMOVED BY SPLIT-01, BUT NO LONGER FOR THE ORIGINAL REASON. SPLIT-01
# names six transport dependencies to take out of this manifest; five left with
# the moved code (`hyper` and `hyper-util` are now reachable only through `axum`
# and `tonic`, `tokio-rustls` only through `async-nats`, and `rustls-pemfile`
# and `x509-parser` are out of this crate's graph entirely). `axum` stayed
# because two things named it in NON-TEST code: `ingest/`, in six files, and
# `http/rate_limit.rs`. Both are gone -- the rate limiter went down to
# `swarm_core::http_rate_limit`, and `ingest/` went out to
# `swarm-ingest-runtime` -- and with them the reason this line sits under
# `[dependencies]`:
#
#     $ sed -i '' '/^axum.workspace = true$/d' crates/swarm-runtime/Cargo.toml
#     $ cargo check -p swarm-runtime --lib 2>&1 | grep -c '^error'
#     0
#
# Every remaining `axum` use in this crate is under `#[cfg(test)]`, or in
# `tests/`, `examples/` or `benches/`, so the correct home for this line is
# `[dev-dependencies]`.
#
# IT IS LEFT HERE ON PURPOSE. SPLIT-05 was code motion; relocating this line is
# a manifest change and belongs to SPLIT-06, which measures it on a tree where
# nothing else is moving. Deleting it as a side effect of a file move is the
# version of this fix that cannot be checked. See `src/http/mod.rs`.
axum.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
swarm-core.workspace = true
swarm-consensus.workspace = true
swarm-ingest-json.workspace = true
swarm-ingest-sentinel.workspace = true
swarm-ingest-taxii.workspace = true
swarm-ingest-tetragon.workspace = true
swarm-policy.workspace = true
swarm-response.workspace = true
swarm-whisker.workspace = true
swarm-pheromone.workspace = true
swarm-spine.workspace = true
swarm-crypto.workspace = true
swarm-guard.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
prometheus-client.workspace = true
arc-swap.workspace = true
rand_core.workspace = true
uuid.workspace = true
sysinfo.workspace = true
reqwest.workspace = true
zeroize.workspace = true
z3 = { version = "0.20", optional = true, features = ["gh-release"] }

[dev-dependencies]
# Dev-only, and it must stay dev-only. `swarm-agents` depends on this crate, so a
# normal dependency here is a Cargo cycle and is rejected outright. The root's
# integration tests construct concrete agents; its non-test code does not.
swarm-agents.workspace = true
# Dev-only for the same reason, and the same way round: `swarm-ingest-runtime`
# depends on this crate, so a normal entry here is the Cargo cycle SPLIT-05 is
# organised around. This crate's lib, bins and benches name none of it; exactly
# thirteen dev targets do, and they are counted rather than estimated:
#
#     $ for d in tests examples benches; do
#         printf '%s %s\n' "$(grep -rl swarm_ingest_runtime crates/swarm-runtime/$d | wc -l)" "$d"
#       done
#     12 tests
#     1 examples
#     0 benches
#
# Ten of the thirteen want one free function, `control::build_composite_detector`,
# and never touch the router. Letting all thirteen follow the code would delete
# this entry; it is not done, because ten of them are `swarm-runtime` integration
# tests and would then be filed under the wrong crate. See ADR 0006.
swarm-ingest-runtime.workspace = true
criterion = { version = "0.5", features = ["async_tokio"] }
tower.workspace = true

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true
