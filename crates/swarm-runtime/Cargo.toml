[package]
name = "swarm-runtime"
description = "Rust-first runtime wiring detection, substrate, policy, and response"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
z3 = ["dep:z3"]

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
swarm-core.workspace = true
swarm-consensus.workspace = true
swarm-governance.workspace = true
swarm-ingest-json.workspace = true
swarm-ingest-sentinel.workspace = true
swarm-ingest-taxii.workspace = true
swarm-ingest-tetragon.workspace = true
swarm-policy.workspace = true
swarm-response.workspace = true
swarm-whisker.workspace = true
swarm-pheromone.workspace = true
swarm-spine.workspace = true
swarm-crypto.workspace = true
swarm-guard.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
prometheus-client.workspace = true
arc-swap.workspace = true
rand_core.workspace = true
uuid.workspace = true
sysinfo.workspace = true
reqwest.workspace = true
zeroize.workspace = true
z3 = { version = "0.20", optional = true, features = ["gh-release"] }

[dev-dependencies]
# DEV-ONLY SINCE SPLIT-01. This is the sixth of the six transport dependencies
# SPLIT-01 names; the other five left with the moved code and none of them is
# reachable from this manifest any more. `axum` could not follow them out while
# `ingest/` (six files) and `http/rate_limit.rs` named it in NON-TEST code. The
# rate limiter went down to `swarm_core::http_rate_limit` and `ingest/` went out
# to `swarm-ingest-runtime`, so no lib or bin target here names `axum` now:
#
#     $ sed -i '' '/^axum.workspace = true$/d' crates/swarm-runtime/Cargo.toml
#     $ cargo check -p swarm-runtime --lib 2>&1 | grep -c '^error'
#     0
#
# Five dev targets, across seven files, still name it, and that is why the line
# moved here rather than being deleted. Three of the files are `#[cfg(test)]`
# code inside `src/`, so they all compile into the one `lib test` target:
# `providence.rs` and `threat_intel_runtime.rs` each stand up a server inside a
# `#[cfg(test)] mod tests`, and `service/tests_support.rs` is `include!`d only
# under one of those. The other four files are dev targets outright:
# `tests/dispatch_integration.rs`, `tests/bridge_registry_integration.rs`,
# `tests/ingest_integration.rs` and `examples/end_to_end_ingest_bench.rs`.
#
# NOT A GRAPH REMOVAL, AND IT CANNOT BE ONE HERE. `axum` is still built for this
# crate's normal profile through `swarm-ingest-tetragon -> tonic -> axum`; tonic
# uses it for its own server routing. What this line controls is whether
# `swarm-runtime` may NAME `axum`, and after this it may not outside dev targets.
# See `docs/decisions/0008-split-01-axum-edge-is-now-dev-only.md`.
axum.workspace = true
# Dev-only, and it must stay dev-only. `swarm-agents` depends on this crate, so a
# normal dependency here is a Cargo cycle and is rejected outright. The root's
# integration tests construct concrete agents; its non-test code does not.
swarm-agents.workspace = true
# Dev-only for the same reason, and the same way round: `swarm-ingest-runtime`
# depends on this crate, so a normal entry here is the Cargo cycle SPLIT-05 is
# organised around. This crate's lib, bins and benches name none of it; exactly
# thirteen dev targets do, and they are counted rather than estimated:
#
#     $ for d in tests examples benches; do
#         printf '%s %s\n' "$(grep -rl swarm_ingest_runtime crates/swarm-runtime/$d | wc -l)" "$d"
#       done
#     12 tests
#     1 examples
#     0 benches
#
# Ten of the thirteen want one free function, `control::build_composite_detector`,
# and never touch the router. Letting all thirteen follow the code would delete
# this entry; it is not done, because ten of them are `swarm-runtime` integration
# tests and would then be filed under the wrong crate. See ADR 0006.
swarm-ingest-runtime.workspace = true
criterion = { version = "0.5", features = ["async_tokio"] }
tower.workspace = true
trybuild = "1.0"

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true
