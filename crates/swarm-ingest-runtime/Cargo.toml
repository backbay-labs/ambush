# `swarm-agents`, so the test import followed it. Non-test code here names
# nothing in `swarm-agents` -- it reaches governance through the
# `swarm_policy::governance::GovernanceAuthority` trait, which is the boundary
# SPLIT-05 introduced for exactly this reason.
