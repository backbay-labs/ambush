[package]
name = "swarm-ingest-runtime"
description = "Ingest HTTP surface, telemetry bridge runtime, and operator control plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The verdict-key state builder, for tests in crates that cannot see this
# crate's `#[cfg(test)]` items (`swarm-runtime-http`). Dev-dependency only.
test-fixtures = []

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
hex.workspace = true
rand_core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
swarm-core.workspace = true
swarm-crypto.workspace = true
# The decide route verifies the SAME four-member preimage the console signed.
# This is the transport-neutral wire crate (00-DECISIONS W3-27) and links no
# other `swarm-*` package, so the edge does not widen the dependency graph.
swarm-perch-wire.workspace = true
swarm-ingest-json.workspace = true
swarm-ingest-sentinel.workspace = true
swarm-ingest-tetragon.workspace = true
swarm-pheromone.workspace = true
swarm-policy.workspace = true
swarm-response.workspace = true
swarm-runtime.workspace = true
swarm-spine.workspace = true
swarm-whisker.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
# Dev-only. `ingest/tests.rs` constructs a concrete `tom_agent::GovernancePolicy`
# to drive the governance health endpoint; SPLIT-03 moved that type to
# `swarm-agents`, so the test import followed it. Non-test code here names
# nothing in `swarm-agents` -- it reaches governance through the
# `swarm_policy::governance::GovernanceAuthority` trait, which is the boundary
# SPLIT-05 introduced for exactly this reason.
swarm-agents.workspace = true
# The `test-fixtures` feature carries `held_action_fixtures`, so the decide
# tests build the same HeldAction the daemon does instead of a hand-rolled
# lookalike. Dev-only: off for the normal build, so no fixture reaches the
# daemon.
swarm-runtime = { workspace = true, features = ["test-fixtures"] }
tower.workspace = true

[lints]
workspace = true
