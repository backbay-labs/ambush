[package]
name = "swarm-pheromone"
description = "Pheromone substrate — deposit, query, decay over NATS JetStream"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["nats"]
nats = ["dep:async-nats", "dep:tokio-stream"]

[dependencies]
swarm-core.workspace = true
swarm-crypto.workspace = true
ed25519-dalek.workspace = true
async-trait.workspace = true
async-nats = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true

# Loom is a `cfg(loom)`-gated dev-dependency ONLY: it is compiled solely under
# `RUSTFLAGS="--cfg loom"` for the concurrency model in
# `tests/loom_concurrent_write.rs` and never enters the shipped dependency graph
# (`cargo tree -p swarm-pheromone` without `--cfg loom` shows no loom).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"

[lints]
workspace = true
