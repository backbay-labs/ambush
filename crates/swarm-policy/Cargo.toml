[package]
name = "swarm-policy"
description = "Deterministic live-response policy gate and capability issuance"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Optional, dependency-free feature (KANI-01). It gates the bounded-model-
# checking harness module in `src/kani_public_harnesses.rs` alongside the
# `--cfg kani` that `cargo kani` sets: the module is
# `#[cfg(any(kani, feature = "kani"))]`, so it is absent from the normal build
# and adds NOTHING to the shipped dependency graph. The `kani::` proof API is
# supplied by the Kani compiler when `cargo kani` runs, not by a cargo
# dependency, so this feature list is intentionally empty.
kani = []

[dependencies]
swarm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Loom is a `cfg(loom)`-gated dev-dependency ONLY: it is compiled solely under
# `RUSTFLAGS="--cfg loom"` for the concurrency model in
# `tests/loom_concurrent_decision.rs` and never enters the shipped dependency
# graph (`cargo tree -p swarm-policy` without `--cfg loom` shows no loom).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"

[lints]
workspace = true
