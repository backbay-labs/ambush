[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-whisker",
    "crates/swarm-pheromone",
    "crates/swarm-policy",
    "crates/swarm-response",
    "crates/swarm-runtime",
    "crates/swarm-consensus",
    "crates/swarm-spine",
    "crates/swarm-guard",
    "crates/swarm-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/swarm-team-six"

[workspace.dependencies]
# Internal crates
swarm-core = { path = "crates/swarm-core" }
swarm-whisker = { path = "crates/swarm-whisker" }
swarm-pheromone = { path = "crates/swarm-pheromone" }
swarm-policy = { path = "crates/swarm-policy" }
swarm-response = { path = "crates/swarm-response" }
swarm-runtime = { path = "crates/swarm-runtime" }
swarm-consensus = { path = "crates/swarm-consensus" }
swarm-spine = { path = "crates/swarm-spine" }
swarm-guard = { path = "crates/swarm-guard" }
swarm-crypto = { path = "crates/swarm-crypto" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Crypto
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"

# NATS
async-nats = "0.38"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Testing
proptest = "1"
