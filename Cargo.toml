[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-whisker",
    "crates/swarm-ingest-tetragon",
    "crates/swarm-ingest-json",
    "crates/swarm-ingest-taxii",
    "crates/swarm-ingest-sentinel",
    "crates/swarm-pheromone",
    "crates/swarm-policy",
    "crates/swarm-governance",
    "crates/swarm-governance-witness",
    "crates/swarm-response",
    "crates/swarm-runtime",
    "crates/swarm-agents",
    "crates/swarm-runtime-http",
    "crates/swarm-ingest-runtime",
    "crates/swarm-runtime-workbench",
    "crates/swarm-evolution",
    "crates/swarm-cli",
    "crates/swarm-consensus",
    "crates/swarm-spine",
    "crates/swarm-guard",
    "crates/swarm-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/ambush"

[workspace.dependencies]
# Internal crates
swarm-core = { version = "0.1.0", path = "crates/swarm-core" }
swarm-whisker = { version = "0.1.0", path = "crates/swarm-whisker" }
swarm-ingest-tetragon = { version = "0.1.0", path = "crates/swarm-ingest-tetragon" }
swarm-ingest-json = { version = "0.1.0", path = "crates/swarm-ingest-json" }
swarm-ingest-taxii = { version = "0.1.0", path = "crates/swarm-ingest-taxii" }
swarm-ingest-sentinel = { version = "0.1.0", path = "crates/swarm-ingest-sentinel" }
swarm-pheromone = { version = "0.1.0", path = "crates/swarm-pheromone" }
swarm-policy = { version = "0.1.0", path = "crates/swarm-policy" }
swarm-governance = { version = "0.1.0", path = "crates/swarm-governance" }
swarm-governance-witness = { version = "0.1.0", path = "crates/swarm-governance-witness" }
swarm-response = { version = "0.1.0", path = "crates/swarm-response" }
swarm-runtime = { version = "0.1.0", path = "crates/swarm-runtime" }
swarm-agents = { version = "0.1.0", path = "crates/swarm-agents" }
swarm-runtime-http = { version = "0.1.0", path = "crates/swarm-runtime-http" }
swarm-ingest-runtime = { version = "0.1.0", path = "crates/swarm-ingest-runtime" }
swarm-runtime-workbench = { version = "0.1.0", path = "crates/swarm-runtime-workbench" }
swarm-evolution = { version = "0.1.0", path = "crates/swarm-evolution" }
swarm-cli = { version = "0.1.0", path = "crates/swarm-cli" }
swarm-consensus = { version = "0.1.0", path = "crates/swarm-consensus" }
swarm-spine = { version = "0.1.0", path = "crates/swarm-spine" }
swarm-guard = { version = "0.1.0", path = "crates/swarm-guard" }
swarm-crypto = { version = "0.1.0", path = "crates/swarm-crypto" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures-util = "0.3"
async-nats = "0.47"
axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["util"] }
prometheus-client = "0.23"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "7"
arc-swap = "1"
sysinfo = "0.33"
libc = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
sha2 = "0.10"
hex = "0.4"
ryu = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "http-proto", "reqwest-rustls"] }
tracing-opentelemetry = "0.32.1"

# Error handling
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Testing
proptest = "1"

# Panic-safety lints for the live-response critical lane.
#
# CONVENTION FOR TEST-CODE EXCEPTIONS (one convention, written down here so the
# tree does not carry two):
#
#   Allowed:   `#[allow(clippy::unwrap_used, clippy::expect_used)]` on a
#              `#[cfg(test)] mod tests` declaration, or the inner `#![allow(...)]`
#              form at the top of a file that is itself only compiled under
#              `cfg(test)`. This is the shape already used at ~92 sites.
#
#   Allowed:   a per-call-site `#[allow(clippy::expect_used)]` in PRODUCTION code,
#              paired with a `// SAFETY: runtime panic contract exception` comment
#              justifying the invariant. See
#              `tools/check-runtime-panic-contract.sh`.
#
#              ORDER MATTERS. The marker must be the nearest non-blank line above
#              the call, so the attribute goes ABOVE the marker:
#                  #[allow(clippy::unwrap_used)]
#                  // SAFETY: runtime panic contract exception -- <why it cannot fail>
#                  let out = value.unwrap();
#              Putting the attribute BETWEEN the marker and the call is still a
#              contract violation, because the attribute then displaces the marker
#              as the nearest line above.
#
#   NOT allowed: a crate-wide `#![cfg_attr(test, allow(...))]` prologue. It covers
#              every current AND future test module in the crate, including ones
#              nobody reviewed, and it silently widens over time. All eight of
#              these were removed in phase 280.
#
#   NOT allowed: allowing a STYLE lint (needless_borrow, type_complexity, ...)
#              under cover of a panic-safety exception. Fix the style lint.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
