      to: node:asset:workload-a
      relation: creates
    - edge_id: edge:workload-contacted-destination
      from: node:asset:workload-a
      to: node:asset:destination-a
      relation: contacts
    - edge_id: edge:indicator-matched-destination
      from: node:asset:indicator-a
      to: node:asset:destination-a
      relation: matches_indicator
  kill_chain_stage_ids:
    - stage:initial-access
    - stage:execution
    - stage:credential-access
    - stage:lateral-movement
    - stage:command-and-control
  required_evidence_ids:
    - evidence:process:support
    - evidence:identity:support
    - evidence:kubernetes:support
    - evidence:cloudtrail:support
    - evidence:network:support
    - evidence:threat-intelligence:support
    - evidence:withheld:initial-access
    - evidence:withheld:execution
    - evidence:withheld:credential-access
    - evidence:withheld:command-and-control
