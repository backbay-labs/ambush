# The negative-falsifiability registry (Phase 285, v1.79 assurance floor,
# Task 3: FALSIFY-01; extended for Phase 286 dispatch invariants).
#
# `docs/assurance/MAPPING.md` names 17 fail-closed invariants. The two new
# dispatch entries share one test file; compiling/executing these tests and
# accepting Phase 286 remain separate gates. A positive test that
# passes proves the real function's behaviour matches the assertion -- it
# does NOT prove the assertion would have caught a REGRESSION, because a
# check that always passes (e.g. a no-op stub standing in for a real guard)
# would pass that same positive test too. This registry is the other half:
# one entry per `MAPPING.md` row, naming the `negative_<name>.rs` test that
# proves the invariant is falsifiable -- that a DELIBERATELY BROKEN variant
# of the enforcing logic (the fail-closed check weakened or removed) is
# distinguishable from the real one on the same input the real function
# denies.
#
# `tools/check-negative-registry.sh` (FALSIFY-03) keeps this file,
# `MAPPING.md`, and the real `crates/*/tests/` tree in sync: every
# `MAPPING.md` row must have an entry here, every entry here must name a
# `MAPPING.md` row, and every entry's `test_file`/`test_fn` must resolve to a
# real, present test. This file must parse as valid TOML.
#
# `target` mirrors the corresponding `MAPPING.md` row's `Path` column
# (the exact `crate::module::[Type::]function` the invariant names) so a
# reader does not have to cross-reference the two files to see what a test
# is falsifying. It is descriptive here; `check-mapping.sh` (Task 2) is the
# gate that keeps `MAPPING.md`'s own `Path` column resolved against the
# source tree.

[negative.PolicyMalformedRequestRejected]
crate = "swarm-policy"
test_file = "crates/swarm-policy/tests/negative_policy_malformed_request_rejected.rs"
test_fn = "negative_policy_malformed_request_rejected"
target = "swarm_policy::static_gate::StaticApprovalGate::validate_request"

