# DEVIATION -- see task-3-report.md. `envelope_signing_bytes` cannot be
# driven into this branch from outside the crate: a `serde_json::Value`
# cannot carry a non-finite number through any construction path the pinned
# `serde_json` exposes (verified empirically inside the test itself, not
# just claimed here). The test falsifies the guard's logic directly on a
# bare `f64` instead of calling the real function on a denying input.
[negative.SpineEnvelopeCanonicalizationRequired]
crate = "swarm-spine"
test_file = "crates/swarm-spine/tests/negative_spine_envelope_canonicalization_required.rs"
test_fn = "negative_spine_envelope_canonicalization_required"
target = "swarm_spine::envelope::envelope_signing_bytes"
status = "deviation"
note = "real function's input type cannot carry the triggering (non-finite f64) value from outside the crate; falsifies the guard logic directly instead of the real call chain"

