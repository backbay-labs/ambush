[[entry]]
invariant = "POLICY-EMPTY-RULESET-DENIES"
production_fn = "swarm_policy::configurable_gate::ConfigurableApprovalGate::evaluate"
entry_point = "swarm_policy::configurable_gate::ConfigurableApprovalGate::evaluate"
test_file = "crates/swarm-policy/tests/negative_policy_gates.rs"
test_fn = "broken_empty_ruleset_arm_permits_the_action_the_real_gate_fails_closed_on"
broken_variant = "broken_configurable_evaluate"
permits = """
A Medium-severity IsolateHost on a deployment with no configurable rules
loaded -- the shipped default -- is authorized by the static fallback."""
observed_when_neutralized = """
left: Deny, right: Allow -- "without the empty-ruleset arm an unconfigured
deployment authorizes a destructive action off the static fallback alone"."""

[[entry]]
invariant = "POLICY-NULL-EVIDENCE-REFUSED"
production_fn = "swarm_policy::static_gate::StaticApprovalGate::validate_request"
entry_point = "swarm_policy::static_gate::StaticApprovalGate::evaluate"
test_file = "crates/swarm-policy/tests/negative_policy_gates.rs"
test_fn = "broken_validate_request_permits_the_null_evidence_request_the_real_gate_refuses"
broken_variant = "SkipNullEvidence"
permits = """
A request whose evidence bundle is JSON `null` reaches a verdict instead of
being refused as malformed."""
observed_when_neutralized = """
panicked at `the broken variant admits the request it should have refused:
InvalidRequest("evidence bundle must not be null")`."""

