[[entry]]
invariant = "SPINE-ENVELOPE-HASH-BOUND"
production_fn = "swarm_spine::envelope::verify_envelope"
entry_point = "swarm_spine::envelope::verify_envelope"
test_file = "crates/swarm-spine/tests/negative_envelope_and_chain.rs"
test_fn = "broken_hash_binding_admits_the_forged_envelope_id_the_real_verifier_refuses"
broken_variant = "SkipHashBinding"
permits = """
An envelope whose `envelope_hash` was rewritten to an attacker-chosen value,
with body and signature untouched, is admitted -- so the identity the next
chain link has to match is chosen by the attacker."""
observed_when_neutralized = """
panicked at `without the hash comparison the signature alone verifies ...:
Err("hash mismatch: expected 0xabab..., computed 0x8870000df17f...")`."""

[[entry]]
invariant = "SPINE-ENVELOPE-SIGNATURE-REQUIRED"
production_fn = "swarm_spine::envelope::verify_envelope"
entry_point = "swarm_spine::envelope::verify_envelope"
test_file = "crates/swarm-spine/tests/negative_envelope_and_chain.rs"
test_fn = "broken_signature_check_admits_the_reattributed_envelope_the_real_verifier_refuses"
broken_variant = "SkipSignatureCheck"
permits = """
An envelope re-attributed to a second issuer, with its hash recomputed so the
hash binding is satisfied, is accepted as that issuer's -- and their key never
touched it. Recomputing sha256 needs no key, so this is inside any tamperer's
reach."""
observed_when_neutralized = """
panicked at `without the signature check an envelope is attributed to whichever
issuer the bytes claim, and the victim's key never touched it: Ok(false)`."""

