# One executable negative mutation per MAPPING.md row. Each entry is bound to
# an exact test, typed case identity, invariant identity, and mutation variant.
# The shared Rust protocol owns the real, mirror(None), and
# mirror(BrokenVariant) operations over one typed probe. `permits` and
# `observed_when_neutralized` remain review prose rather than parsed stdout.
# The protocol proves the registered differential; it cannot mechanically prove
# a handwritten mirror faithful for inputs outside that registered probe.

