# Negative falsifiability registry (FALSIFY-01, phase 285).
#
# One entry per row of `docs/assurance/MAPPING.md`. Each names the production
# function the row is about, the public entry point a test can reach it through,
# and the `crates/*/tests/negative_*.rs` test that proves the guard actually
# fires by constructing a deliberately-broken variant and asserting the broken
# variant PERMITS what the real function refuses.
#
# `observed_when_neutralized` is the load-bearing field and it is not
# decorative. Every mutation in this file was neutralized -- the removed guard
# put back, so the "broken" variant is no longer broken -- and the test was run
# and watched to fail. The recorded text is that failure. A negative test that
# has never been observed failing is the eleventh entry in
# `.planning/STATE.md`'s defect catalogue wearing a different hat.
#
# WHAT tools/check-negative-registry.sh CHECKS
#   - every MAPPING.md row has exactly one entry here, and every entry names a
#     MAPPING.md row (both directions, so neither file can grow orphans)
#   - `production_fn` equals the row's `Enforcing function` column
#   - `test_file` exists, lives at `crates/*/tests/negative_*.rs`, and declares
#     `fn <test_fn>`
#   - `broken_variant` is named INSIDE the body of `test_fn` and is also defined
#     somewhere else in the same file
#   - `permits` and `observed_when_neutralized` are non-empty
#
# WHAT IT CANNOT CHECK, AND SAYING SO IS THE POINT
#   That the mirror is a FAITHFUL copy of the function it claims to mirror. No
#   static check can establish that. Two things stand in for it: each test's
#   unmutated control, which asserts the mirror reproduces the real function's
#   outcome on the same probe, and review -- which is why every entry names the
#   mirror so a reviewer can diff it against the source it copies.

schema_version = 1

