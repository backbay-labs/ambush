<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Defense in depth: five layers wrap the deterministic critical lane - fail-closed authorization, a named trusted computing base, the guard pipeline, adversarial pressure, and signed evidence. Each one fails closed.">
