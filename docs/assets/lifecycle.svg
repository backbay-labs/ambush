<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Life of an event: ingest, detect, deposit, concentrate, escalate, authorize, execute, seal. Every outcome produces a signed receipt.">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <linearGradient id="l-track" gradientUnits="userSpaceOnUse" x1="100" y1="104" x2="1100" y2="104">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#4ade80" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#l-bg)"/>

  <text x="600" y="42" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#7f9c8d" fill-opacity="0.8">LIFE OF AN EVENT</text>

  <path d="M100 104 H1100" stroke="url(#l-track)" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="104" r="17" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="100" y="109" font-size="13" font-weight="700" fill="#4ade80">1</text>
      <text x="100" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Ingest</text>
      <text x="100" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">bridge normalizes</text>
    </g>
    <g>
      <circle cx="243" cy="104" r="17" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.6" stroke-width="1.4"/>
      <text x="243" y="109" font-size="13" font-weight="700" fill="#4ade80">2</text>
      <text x="243" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Detect</text>
      <text x="243" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">12 families vote</text>
    </g>
    <g>
      <circle cx="386" cy="104" r="17" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.68" stroke-width="1.4"/>
      <text x="386" y="109" font-size="13" font-weight="700" fill="#4ade80">3</text>
      <text x="386" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Deposit</text>
      <text x="386" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">signed pheromone</text>
    </g>
    <g>
      <circle cx="529" cy="104" r="17" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.76" stroke-width="1.4"/>
      <text x="529" y="109" font-size="13" font-weight="700" fill="#4ade80">4</text>
      <text x="529" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Concentrate</text>
      <text x="529" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">decay and sum</text>
    </g>
    <g>
      <circle cx="671" cy="104" r="17" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.9" stroke-width="1.4"/>
      <text x="671" y="109" font-size="13" font-weight="700" fill="#4ade80">5</text>
      <text x="671" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Escalate</text>
      <text x="671" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">mode transition</text>
    </g>
    <g>
      <circle cx="814" cy="104" r="17" fill="#191307" stroke="#f59e0b" stroke-opacity="0.9" stroke-width="1.4"/>
      <text x="814" y="109" font-size="13" font-weight="700" fill="#f59e0b">6</text>
      <text x="814" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Authorize</text>
      <text x="814" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c99a45">policy and receipt</text>
    </g>
    <g>
      <circle cx="957" cy="104" r="17" fill="#191307" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.4"/>
      <text x="957" y="109" font-size="13" font-weight="700" fill="#f59e0b">7</text>
      <text x="957" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Execute</text>
      <text x="957" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c99a45">scoped adapter</text>
    </g>
    <g>
      <circle cx="1100" cy="104" r="17" fill="#08191d" stroke="#22d3ee" stroke-opacity="0.9" stroke-width="1.4"/>
      <text x="1100" y="109" font-size="13" font-weight="700" fill="#22d3ee">8</text>
      <text x="1100" y="152" font-size="13.5" font-weight="600" fill="#e3eee8">Seal</text>
      <text x="1100" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#63b9c9">chain and checkpoint</text>
    </g>
  </g>

  <path d="M100 210 H1100" stroke="#1e3a2e" stroke-width="1"/>
  <text x="600" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9db3a8">Every outcome, authorized or denied, produces a signed receipt.</text>
</svg>
