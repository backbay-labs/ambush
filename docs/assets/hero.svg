<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ambush: rust-first autonomous threat hunting. Detect in microseconds, act under policy, prove every decision.">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-swarm" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="1.15" fill="#4ade80" fill-opacity="0.20"/>
      <circle cx="19" cy="18" r="0.75" fill="#4ade80" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="h-fade" cx="50%" cy="50%" r="54%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="h-mask">
      <rect width="1200" height="420" fill="url(#h-fade)"/>
    </mask>
    <linearGradient id="h-rule" gradientUnits="userSpaceOnUse" x1="390" y1="0" x2="810" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#h-bg)"/>
  <rect width="1200" height="420" fill="url(#h-swarm)" mask="url(#h-mask)"/>
  <rect width="1200" height="420" fill="url(#h-glow)"/>

  <g stroke="#4ade80" stroke-opacity="0.34" stroke-width="1">
    <path d="M40 46 H54 M47 39 V53"/>
    <path d="M1146 46 H1160 M1153 39 V53"/>
    <path d="M40 374 H54 M47 367 V381"/>
    <path d="M1146 374 H1160 M1153 367 V381"/>
  </g>

  <text x="600" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="5.4" fill="#8fb8a4" fill-opacity="0.82">RUST-FIRST AUTONOMOUS THREAT HUNTING</text>

  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="100" font-weight="700" letter-spacing="18" fill="#eaf3ee">AMBUSH</text>

  <rect x="390" y="272" width="420" height="1.4" fill="url(#h-rule)"/>

  <text x="600" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" fill="#a9bdb2">Detect in microseconds. Act under policy. Prove every decision.</text>

  <g>
    <path d="M356 366 H844" stroke="#4ade80" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="3 7"/>
    <circle cx="356" cy="366" r="2.2" fill="#4ade80" fill-opacity="0.30"/>
    <circle cx="454" cy="366" r="2.9" fill="#4ade80" fill-opacity="0.44"/>
    <circle cx="552" cy="366" r="3.6" fill="#4ade80" fill-opacity="0.60"/>
    <circle cx="650" cy="366" r="4.4" fill="#4ade80" fill-opacity="0.78"/>
    <circle cx="748" cy="366" r="5.2" fill="#4ade80"/>
    <circle cx="844" cy="366" r="6.2" fill="#f59e0b"/>
    <circle cx="844" cy="366" r="11" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>

  <text x="330" y="370" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#7c9187">PHEROMONE</text>
  <text x="874" y="370" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#b98a3f">ESCALATION</text>
</svg>
