<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="Six ways in: watch a case, bring your own telemetry, write a detector, shape the response playbook, deploy to a cluster, or audit a decision.">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
  </defs>

  <rect width="560" height="500" fill="url(#wm-bg)"/>

  <text x="280" y="38" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.4" fill="#7f9c8d" fill-opacity="0.8">SIX WAYS IN</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <rect x="40" y="62" width="480" height="64" rx="9" fill="#0c1613" stroke="#1e3a2e"/>
      <rect x="40" y="62" width="3" height="64" rx="1.5" fill="#4ade80"/>
      <text x="66" y="90" font-size="14.5" font-weight="600" fill="#e9f3ed">Watch a case</text>
      <text x="66" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">swarmctl first-run</text>
    </g>
    <g>
      <rect x="40" y="136" width="480" height="64" rx="9" fill="#0c1613" stroke="#1e3a2e"/>
      <rect x="40" y="136" width="3" height="64" rx="1.5" fill="#4ade80"/>
      <text x="66" y="164" font-size="14.5" font-weight="600" fill="#e9f3ed">Bring your telemetry</text>
      <text x="66" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">tetragon, cloudtrail, generic_json</text>
    </g>
    <g>
      <rect x="40" y="210" width="480" height="64" rx="9" fill="#0c1613" stroke="#1e3a2e"/>
      <rect x="40" y="210" width="3" height="64" rx="1.5" fill="#4ade80"/>
      <text x="66" y="238" font-size="14.5" font-weight="600" fill="#e9f3ed">Write a detector</text>
      <text x="66" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">crates/swarm-whisker</text>
    </g>
    <g>
      <rect x="40" y="284" width="480" height="64" rx="9" fill="#0c1613" stroke="#3a3020"/>
      <rect x="40" y="284" width="3" height="64" rx="1.5" fill="#f59e0b"/>
      <text x="66" y="312" font-size="14.5" font-weight="600" fill="#e9f3ed">Shape the playbook</text>
      <text x="66" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c99a45">rulesets/default.yaml</text>
    </g>
    <g>
      <rect x="40" y="358" width="480" height="64" rx="9" fill="#0c1613" stroke="#3a3020"/>
      <rect x="40" y="358" width="3" height="64" rx="1.5" fill="#f59e0b"/>
      <text x="66" y="386" font-size="14.5" font-weight="600" fill="#e9f3ed">Deploy to a cluster</text>
      <text x="66" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c99a45">deploy/helm/swarm-team-six</text>
    </g>
    <g>
      <rect x="40" y="432" width="480" height="64" rx="9" fill="#0c1613" stroke="#1d3740"/>
      <rect x="40" y="432" width="3" height="64" rx="1.5" fill="#22d3ee"/>
      <text x="66" y="460" font-size="14.5" font-weight="600" fill="#e9f3ed">Audit a decision</text>
      <text x="66" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#63b9c9">swarmctl evidence-verify</text>
    </g>
  </g>
</svg>
