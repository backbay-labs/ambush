<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Roadmap from September 2026 to April 2027: red swarm in-tree, machine-checked evolution, federated colonies, provenance-grade memory, rotating quorum, herd immunity, the detection commons, and ambush at fleet scale.">
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <linearGradient id="r-line" gradientUnits="userSpaceOnUse" x1="80" y1="205" x2="1120" y2="205">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#r-bg)"/>

  <text x="600" y="44" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#7f9c8d" fill-opacity="0.8">SEP 2026 THROUGH APR 2027</text>

  <path d="M80 205 H1120" stroke="url(#r-line)" stroke-width="2"/>

  <g stroke="#33544a" stroke-width="1" stroke-dasharray="2 4">
    <path d="M110 190 V150"/>
    <path d="M390 190 V150"/>
    <path d="M670 190 V150"/>
    <path d="M950 190 V150"/>
    <path d="M250 220 V258"/>
    <path d="M530 220 V258"/>
    <path d="M810 220 V258"/>
    <path d="M1090 220 V258"/>
  </g>

  <g fill="#4ade80">
    <circle cx="110" cy="205" r="5.5"/>
    <circle cx="250" cy="205" r="5"/>
    <circle cx="390" cy="205" r="5"/>
    <circle cx="530" cy="205" r="5"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="670" cy="205" r="5"/>
    <circle cx="810" cy="205" r="5"/>
    <circle cx="950" cy="205" r="5"/>
    <circle cx="1090" cy="205" r="6.5"/>
  </g>
  <circle cx="1090" cy="205" r="12" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2"/>

  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <text x="110" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#4ade80">SEP 2026</text>
      <text x="110" y="124" font-size="14" font-weight="600" fill="#e3eee8">Red swarm</text>
      <text x="110" y="142" font-size="14" font-weight="600" fill="#e3eee8">in-tree</text>
    </g>
    <g>
      <text x="390" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#4ade80">NOV 2026</text>
      <text x="390" y="124" font-size="14" font-weight="600" fill="#e3eee8">Federated</text>
      <text x="390" y="142" font-size="14" font-weight="600" fill="#e3eee8">colonies</text>
    </g>
    <g>
      <text x="670" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#22d3ee">JAN 2027</text>
      <text x="670" y="124" font-size="14" font-weight="600" fill="#e3eee8">Rotating</text>
      <text x="670" y="142" font-size="14" font-weight="600" fill="#e3eee8">quorum</text>
    </g>
    <g>
      <text x="950" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#22d3ee">MAR 2027</text>
      <text x="950" y="124" font-size="14" font-weight="600" fill="#e3eee8">Detection</text>
      <text x="950" y="142" font-size="14" font-weight="600" fill="#e3eee8">commons</text>
    </g>

    <g>
      <text x="250" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#4ade80">OCT 2026</text>
      <text x="250" y="304" font-size="14" font-weight="600" fill="#e3eee8">Machine-checked</text>
      <text x="250" y="322" font-size="14" font-weight="600" fill="#e3eee8">evolution</text>
    </g>
    <g>
      <text x="530" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#4ade80">DEC 2026</text>
      <text x="530" y="304" font-size="14" font-weight="600" fill="#e3eee8">Provenance-grade</text>
      <text x="530" y="322" font-size="14" font-weight="600" fill="#e3eee8">memory</text>
    </g>
    <g>
      <text x="810" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#22d3ee">FEB 2027</text>
      <text x="810" y="304" font-size="14" font-weight="600" fill="#e3eee8">Herd</text>
      <text x="810" y="322" font-size="14" font-weight="600" fill="#e3eee8">immunity</text>
    </g>
    <g>
      <text x="1090" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#22d3ee">APR 2027</text>
      <text x="1090" y="304" font-size="14" font-weight="700" fill="#eaf3ee">Ambush at</text>
      <text x="1090" y="322" font-size="14" font-weight="700" fill="#eaf3ee">fleet scale</text>
    </g>
  </g>
</svg>
