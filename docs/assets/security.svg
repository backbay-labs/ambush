  <rect width="1000" height="392" rx="10" fill="none" stroke="#4ade80" stroke-opacity="0.10"/>
  <rect x="26" y="28" width="948" height="332" rx="9" fill="#22d3ee" fill-opacity="0.045" stroke="#22d3ee" stroke-opacity="0.45"/>
