<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-label="Defense in depth: five layers wrap the deterministic critical lane - fail-closed authorization, a named trusted computing base, the guard pipeline, adversarial pressure, and signed evidence. Each one fails closed.">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a09"/><stop offset="1" stop-color="#0d1512"/></linearGradient>
    <linearGradient id="sc-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0.30"/><stop offset="1" stop-color="#4ade80" stop-opacity="0.02"/></linearGradient>
  </defs>
