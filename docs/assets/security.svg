  <text x="500" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#7c9187">ingest &#8594; detect &#8594; deposit &#8594; escalate &#8594; route</text>
