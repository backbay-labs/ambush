  <rect x="642" y="80" width="262" height="16" fill="#070a09"/>
  <text x="889" y="92" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.6" fill="#7c9187">forbidden path &#183; egress &#183; secrets &#183; shell</text>
