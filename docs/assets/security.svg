  <text x="81" y="62.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#4ade80" fill-opacity="0.95">ADVERSARIAL PRESSURE</text>
