<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Defense in depth: a deterministic critical lane at the core, wrapped by fail-closed authorization, a guard pipeline, continuous adversarial pressure, and signed evidence.">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <radialGradient id="s-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#s-bg)"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#7f9c8d" fill-opacity="0.8">DEFENSE IN DEPTH</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="56" y="76" width="1088" height="358" rx="12" fill="#08191d" stroke="#1d3740"/>
    <text x="84" y="102" font-size="12" font-weight="600" letter-spacing="2.6" fill="#63b9c9">SIGNED EVIDENCE</text>
    <text x="1116" y="102" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#4a7d88">canonical JSON &#183; Ed25519 &#183; Merkle checkpoints</text>

    <rect x="124" y="118" width="952" height="274" rx="11" fill="#0a1210" stroke="#2b4a3c"/>
    <text x="152" y="144" font-size="12" font-weight="600" letter-spacing="2.6" fill="#6fae8c">ADVERSARIAL PRESSURE</text>
    <text x="1048" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5c7d6d">evasion corpus &#183; decoys &#183; replay suites</text>

    <rect x="192" y="160" width="816" height="190" rx="10" fill="#0c1613" stroke="#2c5a45"/>
    <text x="220" y="186" font-size="12" font-weight="600" letter-spacing="2.6" fill="#8fd6ab">GUARD PIPELINE</text>
    <text x="980" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5c7d6d">forbidden path &#183; egress &#183; secrets &#183; shell</text>

    <rect x="260" y="202" width="680" height="112" rx="9" fill="#191307" stroke="#8a6a20"/>
    <text x="288" y="228" font-size="12" font-weight="600" letter-spacing="2.6" fill="#f0b954">FAIL-CLOSED AUTHORIZATION</text>
    <text x="912" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#a37f36">no receipt, no action</text>

    <ellipse cx="600" cy="266" rx="300" ry="76" fill="url(#s-core)"/>
    <rect x="328" y="234" width="544" height="64" rx="8" fill="#0f231c" stroke="#4ade80" stroke-width="1.4"/>
    <text x="600" y="261" text-anchor="middle" font-size="15.5" font-weight="700" letter-spacing="1.6" fill="#eaf3ee">DETERMINISTIC CRITICAL LANE</text>
    <text x="600" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7fb99a">ingest &#8594; detect &#8594; deposit &#8594; escalate &#8594; route</text>
  </g>

  <text x="600" y="472" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a9bdb2">Detection may be permissive. Action may not.</text>
</svg>
