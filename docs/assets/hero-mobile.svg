    <circle cx="186" cy="290" r="2" fill="#4ade80" fill-opacity="0.32"/>
    <circle cx="233" cy="290" r="2.7" fill="#4ade80" fill-opacity="0.50"/>
    <circle cx="280" cy="290" r="3.4" fill="#4ade80" fill-opacity="0.70"/>
    <circle cx="327" cy="290" r="4.1" fill="#4ade80"/>
    <circle cx="374" cy="290" r="5" fill="#f59e0b"/>
    <circle cx="374" cy="290" r="9" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.1"/>
