<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="Ambush: rust-first autonomous threat hunting.">
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <radialGradient id="hm-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hm-rule" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="390" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="560" height="340" fill="url(#hm-bg)"/>
  <rect width="560" height="340" fill="url(#hm-glow)"/>

  <g stroke="#4ade80" stroke-opacity="0.34" stroke-width="1">
    <path d="M26 32 H38 M32 26 V38"/>
    <path d="M522 32 H534 M528 26 V38"/>
    <path d="M26 308 H38 M32 302 V314"/>
    <path d="M522 308 H534 M528 302 V314"/>
  </g>

  <text x="280" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.4" fill="#8fb8a4" fill-opacity="0.82">AUTONOMOUS THREAT HUNTING</text>

  <text x="280" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="10" fill="#eaf3ee">AMBUSH</text>

  <rect x="170" y="194" width="220" height="1.3" fill="url(#hm-rule)"/>

  <text x="280" y="230" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a9bdb2">Detect in microseconds.</text>
  <text x="280" y="252" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a9bdb2">Act under policy. Prove every decision.</text>

  <g>
