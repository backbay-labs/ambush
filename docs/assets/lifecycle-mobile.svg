<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-label="Life of an event: ingest, detect, deposit, concentrate, escalate, authorize, execute, seal. Every outcome produces a signed receipt.">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <linearGradient id="lm-track" gradientUnits="userSpaceOnUse" x1="76" y1="78" x2="76" y2="444">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="0.74" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="560" height="520" fill="url(#lm-bg)"/>

  <text x="280" y="38" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.4" fill="#7f9c8d" fill-opacity="0.8">LIFE OF AN EVENT</text>

  <path d="M76 78 V444" stroke="url(#lm-track)" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <circle cx="76" cy="78" r="15" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="76" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">1</text>
      <text x="110" y="75" font-size="14" font-weight="600" fill="#e3eee8">Ingest</text>
      <text x="110" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">bridge normalizes</text>
    </g>
    <g>
      <circle cx="76" cy="130" r="15" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="76" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">2</text>
      <text x="110" y="127" font-size="14" font-weight="600" fill="#e3eee8">Detect</text>
      <text x="110" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">12 families vote</text>
    </g>
    <g>
      <circle cx="76" cy="182" r="15" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.68" stroke-width="1.3"/>
      <text x="76" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">3</text>
      <text x="110" y="179" font-size="14" font-weight="600" fill="#e3eee8">Deposit</text>
      <text x="110" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">signed pheromone</text>
    </g>
    <g>
      <circle cx="76" cy="234" r="15" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.76" stroke-width="1.3"/>
      <text x="76" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">4</text>
      <text x="110" y="231" font-size="14" font-weight="600" fill="#e3eee8">Concentrate</text>
      <text x="110" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">decay and sum</text>
    </g>
    <g>
      <circle cx="76" cy="286" r="15" fill="#0d1c17" stroke="#4ade80" stroke-opacity="0.9" stroke-width="1.3"/>
      <text x="76" y="291" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">5</text>
      <text x="110" y="283" font-size="14" font-weight="600" fill="#e3eee8">Escalate</text>
      <text x="110" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f9c8d">mode transition</text>
    </g>
    <g>
      <circle cx="76" cy="338" r="15" fill="#191307" stroke="#f59e0b" stroke-opacity="0.9" stroke-width="1.3"/>
      <text x="76" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">6</text>
      <text x="110" y="335" font-size="14" font-weight="600" fill="#e3eee8">Authorize</text>
      <text x="110" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c99a45">policy and receipt</text>
    </g>
    <g>
      <circle cx="76" cy="390" r="15" fill="#191307" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.3"/>
      <text x="76" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">7</text>
      <text x="110" y="387" font-size="14" font-weight="600" fill="#e3eee8">Execute</text>
      <text x="110" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c99a45">scoped adapter</text>
    </g>
    <g>
      <circle cx="76" cy="444" r="15" fill="#08191d" stroke="#22d3ee" stroke-opacity="0.9" stroke-width="1.3"/>
      <text x="76" y="449" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">8</text>
      <text x="110" y="441" font-size="14" font-weight="600" fill="#e3eee8">Seal</text>
      <text x="110" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#63b9c9">chain and checkpoint</text>
    </g>
  </g>

  <text x="280" y="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9db3a8">Authorized or denied, every outcome is signed.</text>
</svg>
