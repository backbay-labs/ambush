<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720" role="img" aria-label="Swarm Team Six system map: telemetry bridges feed Whisker detection, which deposits into the pheromone substrate; async, context, and evolution lanes read from it; Tom authorizes, Pounce routes, and the receipt chain seals every step.">
  <defs>
    <linearGradient id="am-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <marker id="am-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80" fill-opacity="0.75"/>
    </marker>
    <marker id="am-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b" fill-opacity="0.8"/>
    </marker>
    <marker id="am-c" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee" fill-opacity="0.75"/>
    </marker>
  </defs>

  <rect width="560" height="720" fill="url(#am-bg)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="40" y="30" width="480" height="46" rx="8" fill="#0a1210" stroke="#1a2f27"/>
    <text x="280" y="52" text-anchor="middle" font-size="13.5" font-weight="600" fill="#dbe9e1">Telemetry bridges</text>
    <text x="280" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f9c8d">tetragon &#183; cloudtrail &#183; sentinel &#183; generic_json</text>

    <path d="M280 76 V100" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#am-g)"/>

    <rect x="40" y="104" width="480" height="54" rx="8" fill="#0d1c17" stroke="#2c5a45" stroke-width="1.3"/>
    <rect x="40" y="104" width="480" height="2.2" rx="1.1" fill="#4ade80"/>
    <text x="280" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#eaf3ee">Whisker</text>
    <text x="280" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8fb8a4">hot path &#183; 12 detector families &#183; p50 103 &#181;s</text>

    <path d="M280 158 V182" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#am-g)"/>

    <rect x="40" y="186" width="480" height="56" rx="8" fill="#0f231c" stroke="#2c5a45"/>
    <text x="280" y="210" text-anchor="middle" font-size="14.5" font-weight="700" fill="#eaf3ee">Pheromone substrate</text>
    <text x="280" y="229" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8fb8a4">deposit &#183; evaporate &#183; concentrate &#183; escalate</text>

    <path d="M280 242 V266" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#am-g)"/>

    <rect x="40" y="270" width="480" height="112" rx="8" fill="#0a1210" stroke="#1a2f27"/>
    <text x="66" y="294" font-size="10" font-weight="600" letter-spacing="2.4" fill="#6d8a7c">READING LANES</text>
    <text x="66" y="318" font-size="13" fill="#dbe9e1">Stalker <tspan fill="#7f9c8d" font-size="11">investigates leads</tspan></text>
    <text x="66" y="340" font-size="13" fill="#dbe9e1">Weaver <tspan fill="#7f9c8d" font-size="11">correlates incidents</tspan></text>
    <text x="66" y="362" font-size="13" fill="#dbe9e1">Sphinx &#183; Calico &#183; Kitten</text>

    <path d="M280 382 V406" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#am-a)"/>

    <rect x="40" y="410" width="480" height="58" rx="8" fill="#191307" stroke="#5a4416" stroke-width="1.3"/>
    <rect x="40" y="410" width="480" height="2.2" rx="1.1" fill="#f59e0b"/>
    <text x="280" y="435" text-anchor="middle" font-size="15" font-weight="700" fill="#f7ead2">Tom &#183; governance gate</text>
    <text x="280" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c99a45">policy &#183; quorum &#183; approval &#183; lease</text>

    <path d="M280 468 V492" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#am-a)"/>

    <rect x="40" y="496" width="480" height="72" rx="8" fill="#0a1210" stroke="#2c5a45"/>
    <text x="280" y="521" text-anchor="middle" font-size="14.5" font-weight="700" fill="#eaf3ee">Pounce &#183; response router</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <rect x="72" y="534" width="102" height="22" rx="11" fill="#0d1c17" stroke="#26463a"/>
      <text x="123" y="549" text-anchor="middle" fill="#9db3a8">sandbox</text>
      <rect x="186" y="534" width="102" height="22" rx="11" fill="#0d1c17" stroke="#26463a"/>
      <text x="237" y="549" text-anchor="middle" fill="#9db3a8">http_edr</text>
      <rect x="300" y="534" width="102" height="22" rx="11" fill="#0d1c17" stroke="#26463a"/>
      <text x="351" y="549" text-anchor="middle" fill="#9db3a8">webhook</text>
      <rect x="414" y="534" width="74" height="22" rx="11" fill="#0d1c17" stroke="#26463a"/>
      <text x="451" y="549" text-anchor="middle" fill="#9db3a8">dlq</text>
    </g>

    <path d="M280 568 V592" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#am-c)"/>

    <rect x="40" y="596" width="480" height="52" rx="8" fill="#08191d" stroke="#1d3740"/>
    <rect x="40" y="596" width="480" height="2.2" rx="1.1" fill="#22d3ee"/>
    <text x="280" y="620" text-anchor="middle" font-size="14" font-weight="600" fill="#d3ecf2">Receipt chain and audit spine</text>
    <text x="280" y="638" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#63b9c9">replay bundles &#183; evidence export</text>
  </g>
</svg>
