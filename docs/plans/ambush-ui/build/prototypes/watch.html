/* ==========================================================================
   BOOT ASSERTIONS.
   These are not decoration. Four of this revision's blocking findings were
   things a render would have shown and nobody rendered: a clipped safety
   sentence, a truncated principal, a banned glyph and an AA failure that only
   appears in light mode. Each now has an assertion that runs on load and says
   so in the console rather than waiting for the next review.
   ========================================================================== */
function runAssertions(){
  const out = [];
  const ok  = (name, cond, detail) => out.push([cond ? "PASS" : "FAIL", name, detail || ""]);

  /* A1 — the canonical lane arithmetic reproduces the canonical fixture. */
  const ex = concentration("execution");
  ok("A1 execution total_strength == perch-demo-fixture at_open_row",
     Math.abs(ex.total - 2.653617) < 5e-7,
     ex.total.toFixed(6) + " vs 2.653617");
  ok("A1b execution distinct_sources == fixture", ex.sources === 2 && ex.agents === 1,
     sa(ex.sources, ex.agents));

  /* A2 — no Buzz shadcn variable name is declared or read. */
  const css = Array.from(document.styleSheets)
    .flatMap(s => { try { return Array.from(s.cssRules).map(r => r.cssText); } catch { return []; } })
    .join("\n");
  const BUZZ_NAMES = ["--background","--card","--card-foreground","--popover","--popover-foreground",
    "--foreground","--muted","--muted-foreground","--accent","--accent-foreground","--secondary",
    "--secondary-foreground","--destructive","--border","--input","--ring","--primary",
    "--sidebar-background","--sidebar-foreground","--sidebar-border","--sidebar-ring"];
  const leaked = BUZZ_NAMES.filter(n =>
    new RegExp("(^|[^a-z-])" + n.replace(/-/g, "\\-") + "\\s*[:)]", "m").test(css));
  ok("A2 no Buzz shadcn token name declared or read", leaked.length === 0, leaked.join(" "));

  /* A3 — --perch-foreground-faint carries no text. */
  ok("A3 --perch-foreground-faint referenced by no rule",
     !/--perch-foreground-faint\s*\)/.test(css), "");

  /* A4..A7 — per-state DOM checks. */
  const banned = [
    ["shield-glyph", /[\u{1F6E1}\u{1F512}\u{1F510}⚠]/u],
    ["approve",      /appro(ve|ved|val)/i],
    ["trust-claim",  /verified by|trusted|proof/i],
    ["reassurance",  /everything looks good|all clear|you.{0,3}re all caught up|no data|nothing to see/i],
    ["clowder",      /(^|[^a-z])clowders?([^a-z]|$)/i],
    ["legacy",       /swarm team six/i],
    ["exclamation",  /!/],
  ];
  /* The exempt columns below are copy-ban-list.tsv's OWN, verbatim. Nothing is
     softened here: an amendment is a row in that file, not a local kindness. */
  const softBanned = [
    ["bare-source-count", /(^|[^a-z])sources?([^a-z]|$)/i, /agent/i],
    ["bare-lease",        /(^|[^a-z])leases?([^a-z]|$)/i,
                          /capability|containment|contingency|lease_id|lease_ttl|lease_store|lease_closed/i],
    ["bare-lane",         /(^|[^a-z])lanes?([^a-z]|$)/i,
                          /threat|twelve|12|lateral|exfiltration|privilege|command and control|initial access|persistence|supply chain|defense evasion|credential|discovery|execution|impact/i],
    ["hunt-noun",         /(^|[^a-z])hunts?([^a-z]|$)/i, /hunt_id/i],
    ["deny-label",        /(^|[^A-Za-z])Den(y|ied)([^A-Za-z]|$)/, /PolicyVerdict|policy_verdict/],
  ];
  /* ONE allowance, enumerated so a second can never arrive quietly. The demo
     fixture's telemetry event ids are literally `hunt-evt-1` / `hunt-evt-2`
     (perch-demo-fixture.json deposits[].event_id), and render law 5 requires the
     Dismiss preview to name the event id it suppresses on. 22-DEMO-FIXTURE has
     already filed amendment C-A1 to add `hunt[_-][a-z0-9]` to the row's exempt
     column; until it is ratified this is a known, disclosed hit. See open item
     O-4. Anything else fails. */
  const PENDING_C_A1 = /^hunt-evt-[0-9]+$/;
  const copyHits = [], overflows = [], truncations = [];
  const savedState = S.state, savedSel = S.sel, savedOv = S.overlay;

  for (const st of STATES){
    S.state = st; S.overlay = null; reselect(); render();
    /* every rendered text node on the product surface */
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())){
      const el = n.parentElement; if (!el) continue;
      if (el.closest(".specnotes") || el.closest(".states")) continue;
      if (el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
      const t = (n.nodeValue || "").trim(); if (!t) continue;
      for (const [id, re] of banned)
        if (re.test(t) && (id !== "exclamation" || t.length > 3)) copyHits.push([st, id, t.slice(0, 70)]);
      for (const [id, re, ex2] of softBanned)
        if (re.test(t) && !ex2.test(t) && !(id === "hunt-noun" && PENDING_C_A1.test(t)))
          copyHits.push([st, id, t.slice(0, 70)]);
    }
    document.querySelectorAll(".inbox *, .detail *, .strip *, .sidebar *").forEach(el => {
      const cs = getComputedStyle(el);
      if (cs.whiteSpace === "nowrap" && el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 1)
        truncations.push([st, String(el.className).slice(0, 40), (el.textContent || "").trim().slice(0, 50)]);
      const p = el.parentElement; if (!p) return;
      if (cs.whiteSpace !== "nowrap" || cs.overflow !== "visible") return;
      const pr = p.getBoundingClientRect(), er = el.getBoundingClientRect();
      if (er.width > 0 && er.right > pr.right + 1)
        overflows.push([st, String(el.className).slice(0, 40), Math.round(er.right - pr.right)]);
    });
  }
  S.state = savedState; S.sel = savedSel; S.overlay = savedOv; reselect(); render();

  ok("A4 shipped copy-ban-list.tsv clean (one disclosed allowance: open item O-4)", copyHits.length === 0,
     copyHits.slice(0, 6).map(h => h.join(" | ")).join("  //  "));
  ok("A5 no nowrap element overflows its parent", overflows.length === 0,
     overflows.slice(0, 6).map(h => h.join(" | ")).join("  //  "));
  ok("A6 no rendered value is truncated", truncations.length === 0,
     truncations.slice(0, 6).map(h => h.join(" | ")).join("  //  "));

  /* A7 — type census over the product surface. */
  const hist = {}; let total = 0;
  const w2 = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let m;
  while ((m = w2.nextNode())){
    const el = m.parentElement; if (!el) continue;
    if (el.closest(".specnotes") || el.closest(".states")) continue;
    if (el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
    if (!(m.nodeValue || "").trim()) continue;
    const cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden") continue;
    const px = Math.round(parseFloat(cs.fontSize) * 10) / 10;
    hist[px] = (hist[px] || 0) + 1; total++;
  }
  const ge14 = Object.entries(hist).filter(([k]) => +k >= 14).reduce((s, [, v]) => s + v, 0);
  const lt12 = Object.entries(hist).filter(([k]) => +k < 12).reduce((s, [, v]) => s + v, 0);
  ok("A7 at least 40% of product text is 14px or larger",
     total > 0 && ge14 / total >= 0.40,
     `${ge14}/${total} = ${(100 * ge14 / total).toFixed(1)}%  ·  under 12px: ${lt12} (${(100 * lt12 / total).toFixed(1)}%)  ·  ${JSON.stringify(hist)}`);
  ok("A8 nothing renders at 8px", !hist["8"], "");

  window.__PERCH_WATCH_ASSERTIONS__ = out;
  const failed = out.filter(r => r[0] === "FAIL");
  const label = failed.length ? "PERCH watch.html — " + failed.length + " ASSERTION(S) FAILED"
                              : "PERCH watch.html — all " + out.length + " assertions pass";
  console.log(label);
  out.forEach(r => console.log("  " + r[0] + "  " + r[1] + (r[2] ? "   " + r[2] : "")));
}

/* ========================================================================== */
readLink();
applyTheme();
renderSpecNotes();
render();
pushHash();
runAssertions();
</script>
