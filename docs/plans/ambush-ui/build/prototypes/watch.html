<title>The Watch — Perch prototype</title>
<style>
/* ============================================================================
   PERCH — THE WATCH  ·  route "/"  ·  prototype, no build step, no network.

   REVISION 2 — what changed and why (each is a red-team finding, verified in
   source before it was accepted; the evidence is in the Spec notes panel):

   1. TOKEN NAMESPACE. Every colour, geometry and motion token is `--perch-*`
      and every value is copied from build/tokens/perch-tokens.css. Revision 1
      declared `--background --card --popover --foreground --muted-foreground
      --border --ring` on :root. Those seven names are emitted by
      `createThemeVars` (BUZZ desktop/src/shared/theme/adaptive-theme.ts:238-270)
      and written INLINE on the root element by `applyTheme`
      (ThemeProvider.tsx:445-446, `root.style.setProperty(key, value)` over every
      entry) and again on the cached-boot path at :405-406 — in the renderer
      process, on every theme load and on every reload. An inline declaration on
      :root outranks every normal-priority stylesheet rule, so revision 1's
      palette was dead on arrival inside the desktop app: the seven most-used
      colours would have silently reverted to whatever Buzz syntax theme was
      active. `--buzz-type-rem` and `--buzz-type-scale` are kept under their Buzz
      names deliberately — those two come from a STYLESHEET
      (globals/typography.css:16-17), not from createThemeVars, and READING them
      is how the prototype rides the shipped zoom dial rather than shadowing it.
      The type SIZES are not: this file's first revision declared `--text-xs`,
      `--text-sm`, `--text-base` and `--text-lg` on `:root`, and those four are
      Buzz's own (typography.css:18-21) and carry the conversation type contract
      (13/14/15px, BUZZ CLAUDE.md). Declaring them here would have re-sized every
      re-skinned Buzz surface Perch inherits. The integrator pass renamed all of
      them to `--perch-text-*`, matching build/tokens/perch-tokens.css name for
      name; `perch-tokens.test.mjs` T-M2 now fails on any live reference to a
      name build/tokens/perch-token-aliases.tsv marks `rename`.

   2. THEME ARRANGEMENT INVERTED to match perch-tokens.css: the complete light
      palette on bare `:root`; dark under `:root.dark, :root[data-theme="dark"],
      .dark`; the same dark declarations repeated under a guarded
      `prefers-color-scheme` block. No `data-theme` is hard-coded on <html>, so
      the system preference reaches the palette a reviewer is asked to trust.

   3. LIGHT SEVERITY REGENERATED from perch-tokens.css:115-116. Revision 1 shipped
      #b45309 (4.31:1 on --perch-surface-chrome) and #8a6114 (4.505:1 on raised,
      which one-decimal HSL rounding pushes under AA). Both fail WCAG AA and both
      were measured and replaced by the token package after revision 1 was drawn.

   4. --perch-foreground-faint IS REFERENCED BY NO RULE IN THIS FILE. It is the
      disabled-control token (3.45–4.23:1 light, 4.21:1 dark on the raised row)
      and revision 1 painted the render-law-2 line, both render-law-1 absence
      strings and eleven other readable strings with it. Every readable string
      here is --perch-foreground-muted or better. That is asserted, not promised:
      grep the file.

   5. TYPE RIDES THE SHIPPED DIAL. --buzz-type-scale / --buzz-type-rem are
      typography.css:15-17's own names, so the accessibility Font size preference
      moves this page. Revision 1 declared a flat `--rem: 1rem`, which zoomed but
      was inert against `data-font-size`.

   6. ADVERSARY-CONTROLLED VALUES are rendered through adv(), lifted verbatim
      from prototypes/verdict-hold.html: control, zero-width and bidi codepoints
      escaped and visibly marked, capped at 512 characters, no markdown pipeline,
      an amber leading rail per value, one ADVERSARY-CONTROLLED label per slot and
      one legend per surface. 08 §7.7 control 1 names the ACTION and BLAST RADIUS
      slots explicitly; revision 1 had HTML entity escaping and nothing else.

   7. NO ⚠. Revision 1 rendered it twice, four lines above a provenance block.
      skeleton/tools/copy-ban-list.tsv row `shield-glyph` is P0 with no exemption
      (pattern 🛡|🔒|🔐|⚠). The warning register is a 2px leading rail plus words.

   8. THE FIXTURE IS build/fixtures/perch-demo-fixture.json. Ids that scenario
      mints are used verbatim; everything The Watch needs beyond it is derived by
      that file's own function, id = sha256("perch-demo-fixture/v1/" + label),
      and every label is listed in the Spec notes so the demo fixture can absorb
      them. Revision 1 declared a fifth competing "canonical" fixture.

   Palette: build/tokens/perch-tokens.css (measured). Geometry: design-ground §7
   (measured from Buzz constants). Type: rem only, no px font sizes anywhere.
   ========================================================================= */

/* ==========================================================================
   1. LIGHT — the complete palette, on bare :root.
      Values are perch-tokens.css §1 verbatim, in its HSL-triplet form, so a
      component reading `hsl(var(--perch-x))` gets the same colour here and in
      the shipping stylesheet.
   ========================================================================== */
:root{
  color-scheme: light;

  /* -- type: typography.css:15-27's own names and its own arithmetic ------ */
  --buzz-type-scale: 1;
  --buzz-type-rem: calc(1rem * var(--buzz-type-scale));
  --perch-text-3xs:     calc(var(--buzz-type-rem) * 0.5);      /*  8px — UNUSED here */
  --perch-text-badge:   calc(var(--buzz-type-rem) * 0.625);    /* 10px */
  --perch-text-2xs:     calc(var(--buzz-type-rem) * 0.6875);   /* 11px — badges, keys */
  --perch-text-xs:      calc(var(--buzz-type-rem) * 0.75);     /* 12px — meta */
  --perch-text-eyebrow: calc(var(--buzz-type-rem) * 0.75);     /* 12px + 0.34em + 600 */
  --perch-text-sm:      calc(var(--buzz-type-rem) * 0.875);    /* 14px — content */
  --perch-text-base:    var(--buzz-type-rem);                  /* 16px */
  --perch-text-lg:      calc(var(--buzz-type-rem) * 1.125);
  --perch-text-xl:      calc(var(--buzz-type-rem) * 1.25);

  --perch-font-sans: 'Inter Variable', Inter, 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --perch-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  /* -- surfaces · perch-tokens.css §1.1 ---------------------------------- */
  --perch-surface-chrome: 140 15.8% 92.5%;   /* #e9efeb */
  --perch-background:     135 18.2% 95.7%;   /* #f2f6f3 */
  --perch-card:             0 0%   100%;     /* #ffffff */
  --perch-popover:          0 0%   100%;     /* #ffffff */
  --perch-surface-raised: 142.5 16%  90.2%;  /* #e2eae5 */
  --perch-border:         145 15.8% 85.1%;   /* #d3dfd8 */
  --perch-border-strong:  144.7 13.2% 74.7%; /* #b6c7bd */
  --perch-ring:           152.7 14.7% 29.4%; /* #40564c  6.79 chrome / 7.91 card */

  /* -- ink · perch-tokens.css §1.2 --------------------------------------- */
  --perch-foreground:           161.5 30.2% 8.4%;  /* #0f1c18  15.01–17.51 */
  --perch-foreground-secondary: 152.7 14.7% 29.4%; /* #40564c   6.79–7.91  */
  --perch-foreground-muted:     150 10.5% 37.3%;   /* #55695f   5.04–5.88  */
  --perch-foreground-faint:     148.6 8.9% 46.1%;  /* #6b8075   3.45–4.23  */
  /* --perch-foreground-faint is the DISABLED-CONTROL token and is below AA on
     every light surface by design. This file references it in ZERO rules. */

  /* -- pillar hues · perch-tokens.css §1.3 (light needs the ink/mark split) */
  --perch-pillar-substrate-ink:  142.8 64.2% 24.1%; /* #166534  6.12–7.13 */
  --perch-pillar-substrate-mark: 142.4 71.8% 29.2%; /* #15803d  4.30–5.02 */
  --perch-pillar-substrate-dim:  162.9 93.5% 24.3%; /* #047857 */
  --perch-pillar-authority-ink:   22.7 82.5% 31.4%; /* #92400e  6.08–7.09 */
  --perch-pillar-authority-mark:  26   90.5% 37.1%; /* #b45309  4.31–5.02 mark only */
  --perch-pillar-evidence-ink:   194.4 69.6% 27.1%; /* #155e75  6.23–7.27 */
  --perch-pillar-evidence-mark:  192.9 82.3% 31%;   /* #0e7490  4.60–5.36 */

  /* -- pillar borders · DECORATION, never classification (amendment T5) --- */
  --perch-border-pillar-substrate: 141.4 26.4% 79.2%; /* #bcd8c6  1.31–1.52 */
  --perch-border-pillar-authority:  41.8 47.5% 76.9%; /* #e0cfa8  1.32–1.54 */
  --perch-border-pillar-evidence:  194.3 38.2% 78.4%; /* #b3d3dd  1.36–1.58 */

  /* -- severity · perch-tokens.css §1.5, amendments T2 and T2b ------------ */
  --perch-sev-low:      152.1 15.1% 36.5%; /* #4f6b5e  4.76–5.84 */
  --perch-sev-medium:    39.1 75.7% 29%;   /* #825b12  4.96–6.08  (NOT #8a6114) */
  --perch-sev-high:      26.1 91%   34.7%; /* #a94e08  4.53–5.56  (NOT #b45309) */
  --perch-sev-critical:   3.2 71.3% 41%;   /* #b3261e  5.33–6.54 */
  --perch-danger-mark:    3.2 71.3% 41%;   /* #b3261e  5.33–6.54 */

  /* -- alphas, read out of the assets · perch-tokens.css §1.9 ------------- */
  --perch-alpha-region-fill:   0.045;  /* security-v2.svg:8  */
  --perch-alpha-region-stroke: 0.45;   /* security-v2.svg:8  */
  --perch-alpha-rail-fill:     0.07;   /* colony.svg:8       */
  --perch-alpha-chip-fill:     0.09;   /* colony.svg:11      */

  /* -- elevation: light only · perch-tokens.css §1.8 ---------------------- */
  --perch-elevation-popover: 0 8px 24px -8px hsl(161.5 30.2% 8.4% / 0.18);

  /* -- geometry · perch-tokens.css §1.10 plus three prototype-local widths - */
  --perch-rail-pillar-thickness: 2.5px;  /* pillars.svg:28 — top edge, classification */
  --perch-rail-severity-width:   4px;    /* leading edge, severity */
  --perch-radius-rail:           1.2px;  /* pillars.svg:28 */
  --perch-radius-row:            1rem;   /* InboxMessageRow.tsx:142 rounded-2xl */
  --perch-radius-region:         0.5625rem; /* security-v2.svg:8 rx="9" */
  --perch-radius-card:           0.625rem;
  --perch-radius-md:             0.5rem;
  --perch-radius-sm:             0.375rem;
  --perch-governance-strip-height: 28px; /* 04 §1.2 over 05 §12's 18px */
  /* PROTOTYPE-LOCAL, not in perch-tokens.css: three measured Buzz widths. */
  --perch-w-rail:    56px;   /* CommunityRail.tsx:377      w-14              */
  --perch-w-sidebar: 300px;  /* sidebar.tsx:31             SIDEBAR_WIDTH_DEFAULT */
  --perch-w-inbox:   365px;  /* useResizableInboxListWidth.ts:3              */
  --perch-h-terminal: 26px;

  /* -- motion · motion.css:10-21 (measured), Perch adds none here --------- */
  --perch-dur-instant: 120ms; --perch-dur-fast: 180ms; --perch-dur-standard: 240ms;
  --perch-ease-standard: cubic-bezier(0.25,1,0.5,1);
}

/* ==========================================================================
   2. DARK — an explicit choice. perch-tokens.css §2 verbatim.
   ========================================================================== */
:root.dark,
:root[data-theme="dark"],
.dark{
  color-scheme: dark;
  --perch-surface-chrome: 160 17.6% 3.3%;   /* #070a09  hero-v2.svg:3, 33 uses */
  --perch-background:     165 28.6% 5.5%;   /* #0a1210 */
  --perch-card:           162 29.4% 6.7%;   /* #0c1613  pillars.svg:27 */
  --perch-popover:        161.3 33.3% 9.4%; /* #10201b */
  --perch-surface-raised: 159.2 37.1% 13.7%;/* #163027 */
  --perch-border:         154.3 31.8% 17.3%;/* #1e3a2e  pillars.svg:27 */
  --perch-border-strong:  157.5 29.6% 21.2%;/* #26463a */
  --perch-ring:           151.2 20.2% 46.7%;/* #5f8f78  4.99 card / 5.38 chrome */
  --perch-foreground:           146.7 27.3% 93.5%; /* #eaf3ee 16.28 */
  --perch-foreground-secondary: 150 12.6% 65.9%;   /* #9db3a8  8.29 */
  --perch-foreground-muted:     149 12.8% 55.5%;   /* #7f9c8d  6.18 */
  --perch-foreground-faint:     151.4 8.7% 52.7%;  /* #7c9187  5.49 — unused here */
  --perch-pillar-substrate-ink:  141.9 69.2% 58%;  /* #4ade80 10.57 */
  --perch-pillar-substrate-mark: 141.9 69.2% 58%;
  --perch-pillar-substrate-dim:  158.1 64.4% 51.6%;/* #34d399 */
  --perch-pillar-authority-ink:   37.7 92.1% 50.2%;/* #f59e0b  8.58 */
  --perch-pillar-authority-mark:  37.7 92.1% 50.2%;
  --perch-pillar-evidence-ink:   187.9 85.7% 53.3%;/* #22d3ee 10.20 */
  --perch-pillar-evidence-mark:  187.9 85.7% 53.3%;
  --perch-border-pillar-substrate: 154.3 31.8% 17.3%;
  --perch-border-pillar-authority:  36.9 28.9% 17.6%;
  --perch-border-pillar-evidence:  195.4 37.6% 18.2%;
  --perch-sev-low:      155.2 13.2% 57.1%; /* #83a094  6.51 */
  --perch-sev-medium:    38.6 63.5% 59.2%; /* #d9aa55  8.63 */
  --perch-sev-high:      37.7 92.1% 50.2%; /* #f59e0b  8.58 — deliberately the authority hue */
  --perch-sev-critical:   0 80.9% 69.2%;   /* #f07171  6.41 */
  --perch-danger-mark:    0 69.6% 60%;     /* #e05252  4.82 card / 3.70 raised — MARK ONLY */
  --perch-elevation-popover: none;
}

/* ==========================================================================
   3. DARK by system preference, only when no explicit choice has been made.
      ThemeProvider.tsx:449-450 and :408-409 stamp an explicit `.light` class,
      so `:not(.light)` is a real guard. The declaration set is identical to §2.
   ========================================================================== */
@media (prefers-color-scheme: dark){
  :root:not(.light):not([data-theme="light"]){
    color-scheme: dark;
    --perch-surface-chrome: 160 17.6% 3.3%;
    --perch-background:     165 28.6% 5.5%;
    --perch-card:           162 29.4% 6.7%;
    --perch-popover:        161.3 33.3% 9.4%;
    --perch-surface-raised: 159.2 37.1% 13.7%;
    --perch-border:         154.3 31.8% 17.3%;
    --perch-border-strong:  157.5 29.6% 21.2%;
    --perch-ring:           151.2 20.2% 46.7%;
    --perch-foreground:           146.7 27.3% 93.5%;
    --perch-foreground-secondary: 150 12.6% 65.9%;
    --perch-foreground-muted:     149 12.8% 55.5%;
    --perch-foreground-faint:     151.4 8.7% 52.7%;
    --perch-pillar-substrate-ink:  141.9 69.2% 58%;
    --perch-pillar-substrate-mark: 141.9 69.2% 58%;
    --perch-pillar-substrate-dim:  158.1 64.4% 51.6%;
    --perch-pillar-authority-ink:   37.7 92.1% 50.2%;
    --perch-pillar-authority-mark:  37.7 92.1% 50.2%;
    --perch-pillar-evidence-ink:   187.9 85.7% 53.3%;
    --perch-pillar-evidence-mark:  187.9 85.7% 53.3%;
    --perch-border-pillar-substrate: 154.3 31.8% 17.3%;
    --perch-border-pillar-authority:  36.9 28.9% 17.6%;
    --perch-border-pillar-evidence:  195.4 37.6% 18.2%;
    --perch-sev-low:      155.2 13.2% 57.1%;
    --perch-sev-medium:    38.6 63.5% 59.2%;
    --perch-sev-high:      37.7 92.1% 50.2%;
    --perch-sev-critical:   0 80.9% 69.2%;
    --perch-danger-mark:    0 69.6% 60%;
    --perch-elevation-popover: none;
  }
}

/* ==========================================================================
   4. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:hsl(var(--perch-background));
  color:hsl(var(--perch-foreground));
  font-family:var(--perch-font-sans);
  font-size:var(--perch-text-sm);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid hsl(var(--perch-ring));outline-offset:1px;border-radius:3px}
.mono{font-family:var(--perch-font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

.eyebrow{
  font-size:var(--perch-text-eyebrow);
  letter-spacing:0.34em;
  font-weight:600;
  line-height:1;
  text-transform:uppercase;
}
.label-tight{ /* security-v2.svg layer label · badge.tsx:7 base geometry */
  font-size:var(--perch-text-2xs);
  font-weight:700;
  letter-spacing:0.13em;
  text-transform:uppercase;
  line-height:1;
}
/* Every separator is ink, not a border colour. Revision 1 painted these with
   --perch-border-strong (1.77:1) — punctuation is still a rendered string. */
.sep{color:hsl(var(--perch-foreground-muted))}

/* ==========================================================================
   5. ADVERSARY-CONTROLLED VALUES  ·  08 §7.7 control 1
      Copied from prototypes/verdict-hold.html so the two drawings agree:
      a 2px leading rail in the caution register, one ADVERSARY-CONTROLLED
      label per slot, one legend per surface. The rail is the marking; the
      label is the legend; neither is a per-value tag (that made the ACTION
      sentence unreadable).
   ========================================================================== */
.adv-val{
  display:inline; font-family:var(--perch-font-mono);
  background:hsl(var(--perch-surface-raised));
  border-left:2px solid hsl(var(--perch-sev-medium));
  padding:1px 5px; border-radius:0 4px 4px 0;
  color:hsl(var(--perch-foreground));
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.advnote{
  display:inline-block; margin-left:.5rem;
  color:hsl(var(--perch-sev-medium));
  font-size:var(--perch-text-2xs); letter-spacing:0.16em; font-weight:600;
  text-transform:uppercase; line-height:1.3; vertical-align:middle;
}
.advlegend{
  margin:.5rem .5rem .625rem; padding:.25rem 0 .25rem .6875rem;
  border-left:2px solid hsl(var(--perch-sev-medium));
  color:hsl(var(--perch-foreground-muted));
  font-size:var(--perch-text-xs); line-height:1.6;
}
.detail .advlegend{margin:0 0 1rem;max-width:46rem}

/* ==========================================================================
   6. CONSOLE SHELL
   ========================================================================== */
.console{
  height:calc(100vh - 108px); min-height:520px;
  display:flex; flex-direction:column;
  overflow:hidden;
  background:hsl(var(--perch-background));
  border-bottom:1px solid hsl(var(--perch-border));
}

/* governance strip — chrome on every route; 04 §1.2 */
.strip{
  position:relative;
  flex:0 0 auto; min-height:var(--perch-governance-strip-height);
  display:flex; align-items:center; gap:.5rem;
  padding:0 .75rem;
  background:hsl(var(--perch-card));
  border-bottom:1px solid hsl(var(--perch-border));
  overflow:hidden; white-space:nowrap;
}
.strip-rail{ /* 2.5px pillar rail · pillars.svg:28 — Alert + Incident only */
  position:absolute; top:0; left:0; right:0;
  height:var(--perch-rail-pillar-thickness); border-radius:var(--perch-radius-rail);
  background:hsl(var(--perch-pillar-authority-mark));
}
.strip .k{color:hsl(var(--perch-pillar-authority-ink))}
.strip .k.deg{color:hsl(var(--perch-sev-high))}
.strip .k.part{color:hsl(var(--perch-sev-critical))}
.strip .k.cold{color:hsl(var(--perch-foreground-muted))}
.strip .v{color:hsl(var(--perch-foreground-muted));letter-spacing:.02em;text-transform:none;font-weight:500}
.strip .v.shed{color:hsl(var(--perch-sev-medium))}
.strip .v.down{color:hsl(var(--perch-sev-critical))}

/* Incident mode band · design-ground §4.3 */
.modeband{
  flex:0 0 auto; min-height:24px;
  display:flex; align-items:center; gap:.5rem; padding:.25rem .75rem;
  background:hsl(var(--perch-pillar-authority-mark) / var(--perch-alpha-chip-fill));
  border-bottom:1px solid hsl(var(--perch-border-pillar-authority));
  color:hsl(var(--perch-pillar-authority-ink));
}
.modeband .m{color:hsl(var(--perch-foreground-muted));text-transform:none;letter-spacing:.02em;font-weight:500;font-size:var(--perch-text-xs)}

.shellbody{flex:1 1 auto;display:flex;min-height:0}

/* colony rail — CommunityRail.tsx:377 verbatim geometry */
.rail{
  flex:0 0 var(--perch-w-rail); width:var(--perch-w-rail);
  background:hsl(var(--perch-surface-chrome));
  border-right:1px solid hsl(var(--perch-border));
  padding:.5rem .625rem 1.25rem;
  display:flex; flex-direction:column; gap:.625rem; align-items:center;
}
.rail-chip{
  position:relative; width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;
  background:hsl(var(--perch-surface-raised));
  color:hsl(var(--perch-foreground-secondary));
  font-size:var(--perch-text-2xs); font-weight:700; letter-spacing:.08em;
}
.rail-chip[data-active="1"]{color:hsl(var(--perch-foreground))}
.rail-chip[data-active="1"]::before{
  content:"";position:absolute;left:-10px;top:8px;width:4px;height:20px;
  border-radius:0 9999px 9999px 0;background:hsl(var(--perch-pillar-substrate-mark));
}

/* sidebar */
.sidebar{
  flex:0 0 var(--perch-w-sidebar); width:var(--perch-w-sidebar);
  background:hsl(var(--perch-surface-chrome));
  border-right:1px solid hsl(var(--perch-border));
  overflow-y:auto; padding:.75rem .5rem 1rem;
}
.sb-group{margin-bottom:1.125rem}
.sb-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 .5rem .375rem; color:hsl(var(--perch-foreground-muted));
}
.sb-head .c{font-size:var(--perch-text-xs);letter-spacing:.06em;font-weight:600}
.sb-row{
  display:flex;align-items:center;gap:.5rem;
  min-height:28px;padding:.25rem .5rem;border-radius:var(--perch-radius-md);
  color:hsl(var(--perch-foreground-secondary));font-size:var(--perch-text-sm);
}
.sb-row:hover{background:hsl(var(--perch-surface-raised))}

<script>

};

let S = {
  state:"busy",
  /* null on purpose: reselect() applies 04 section 2.1's selection law — the
     oldest undecided hold, else the oldest unreviewed finding — so the landing
     row is derived, not chosen. Revision 1 hard-coded a finding. */
  sel:null,
  overlay:null,            /* null | omni-query | omni-cmd | dismiss | snooze */
  dismissArmed:false,

  toast:null,
  minStates:false,
  theme:null,              /* null = follow the system; "dark" | "light" */

/* ==========================================================================

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* <AdversaryString> — 08 section 7.7 control 1, lifted from
   prototypes/verdict-hold.html:1067-1078 so the two drawings cannot drift.
   Control, zero-width and bidi codepoints are escaped and visibly marked; the
   value is capped at 512 rendered characters; it is a plain text node in a
   labelled rail and it never touches a markdown pipeline. Revision 1 had HTML
   entity escaping only, which does nothing about U+202E or a homoglyph in a
   filename that names an irreversible action. The class is built from escapes
   rather than literals so the source file itself carries no control bytes. */
const CTRL_CODEPOINTS = new RegExp(
  "[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f\\u00ad" +
  "\\u200b-\\u200f\\u202a-\\u202e\\u2066-\\u2069\\ufeff]", "g");
function adv(value){
  const cleaned = String(value).replace(CTRL_CODEPOINTS,
    (c) => "\\u" + c.codePointAt(0).toString(16).padStart(4, "0"));
  const capped = cleaned.length > 512 ? cleaned.slice(0, 512) : cleaned;
  return '<span class="adv-val">' + esc(capped) + "</span>";
}
const ADV_LEGEND =
  '<p class="advlegend">Amber-railed values are written by the adversary — host ' +
  'names, file paths, process names, principals, command lines. They render as ' +
  'plain text, with no markdown, no autolinking and no mentions, and control, ' +
  'zero-width and bidi codepoints escaped. Nothing here is ever passed to an ' +
  'agent as instruction.</p>';
/* The queue gets the short form. The full sentence belongs where a decision is
   made, and a 365px pane cannot spend six lines on a legend above an expiring
   destructive action. */
const ADV_LEGEND_QUEUE =
  '<p class="advlegend">Amber-railed values are written by the adversary and ' +
  'render as inert plain text.</p>';
const ADV_LABEL = '<span class="advnote">Adversary-controlled</span>';

/* Render law 2 / voice law L5: never a bare source count. One function, used
   at every call site, with the grammatical singular 06 section 5.2's own
   laneQuiet copy already uses ("1 source / 1 agent"). */
const sa = (src, ag) =>
  `${src} source${src === 1 ? "" : "s"} / ${ag} agent${ag === 1 ? "" : "s"}`;
/* 06 §1 L5: a number carries its unit and the unit is grammatical. */
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

const hhmm   = (ms) => new Date(ms).toISOString().slice(11, 16);
const hhmmss = (ms) => new Date(ms).toISOString().slice(11, 19);
function dur(ms){
  if (ms <= 0) return "00m 00s";
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}h ${p(m)}m ${p(s)}s` : `${p(m)}m ${p(s)}s`;
}
const holdExpiresMs = (h) => h.heldAtMs + FX.holdTtlMs;

function sevChip(sev){

function confDots(c, pillar){

  const op  = [0.40, 0.55, 0.75, 0.90, 1.00][lit - 1];

  for (let i = 0; i < 5; i++){
    d += i < lit
      ? `<i style="background:hsl(var(--perch-pillar-${pillar}-mark));opacity:${op}"></i>`
      : "<i></i>";
  }
  return `<span class="dots" aria-hidden="true">${d}</span>`;
}
const REVIEW_WORD = {

  unreviewed: "not reviewed",
  "not-yet-correlated": "not yet correlated",
};
const reviewMark = (r) => `<span class="rmark" data-r="${r}" aria-hidden="true"></span>`;
function keys(list){

}

function trailSVG(){

/* Three empty-state marks, one per queue, all drawn out of the domain's own

const MARKS = {

<script>
/* ==========================================================================
   PER-STATE DATA SELECTION
   ========================================================================== */
function holdsFor(st){
  if (st === "empty" || st === "loading" || st === "coldstart") return [];
  if (st === "quiet")  return [HOLDS[3]];
  if (st === "highvolume"){
    const out = [];
    for (let i = 0; i < 14; i++){
      const b = HOLDS[i % 4];
      out.push(Object.assign({}, b, {
        id: "hv" + i,
        holdId: b.holdId.slice(0, 6) + String(10 + i).padStart(2, "0"),
        heldAtMs: FX.nowMs - (60 + i * 233) * 1000,
      }));
    }
    return out;
  }
  if (st === "divergence"){
    return [
      Object.assign({}, HOLDS[0], { div:"both" }),
      Object.assign({}, HOLDS[1], { div:"daemon-only" }),
      Object.assign({}, HOLDS[2], { div:"relay-only" }),
      Object.assign({}, HOLDS[3], { div:"superseded" }),
    ];
  }
  if (st === "daemondown")
    return HOLDS.slice(0, 2).map(h => Object.assign({}, h, { div:"relay-only-nodaemon" }));
  return HOLDS;
}
function findingsFor(st){
  if (st === "empty" || st === "coldstart" || st === "loading") return [];
  if (st === "quiet") return FINDINGS.slice(3, 7);
  return FINDINGS;
}
function caseActFor(st){
  if (st === "empty" || st === "coldstart" || st === "loading") return [];
  if (st === "quiet") return CASEACT.slice(0, 1);
  return CASEACT;
}
/* The C9 numbers come off the same per-state fixture as the queue. Revision 1
   hard-coded "87 measurements this week / 12 promoted / 340 did not clear the
   bar" into every state including `empty`, so a screen that said nothing had
   happened this shift reported a busy week four lines higher. A counter that
   never changes across nine states is decoration, not instrumentation. */
function c9For(st){
  if (st === "coldstart" || st === "loading") return null;
  if (st === "empty")
    return { median:null, measurements:0, fraction:"0 of 0", promoted:0,
             notPromoted:0, reviewed:0, total:0 };
  if (st === "quiet")
    return { median:33, measurements:4, fraction:"0 of 2", promoted:1,
             notPromoted:11, reviewed:6, total:9 };
  return { median:41, measurements:9, fraction:"1 of 4", promoted:3,
           notPromoted:24, reviewed:12, total:19 };
}
function governance(st){
  if (st === "coldstart")
    return { key:"GOVERNANCE", cls:"cold", detail:"no snapshot received yet", recv:null };
  if (st === "highvolume")
    return { key:"GOVERNANCE DEGRADED", cls:"deg",
             detail:"quorum available, one or more governors unhealthy", recv:"recv 3s ago" };
  if (st === "daemondown")
    return { key:"GOVERNANCE", cls:"cold",
             detail:"last value was healthy · committee of 1 (solo transport)",
             recv:"recv 6m 12s ago" };
  if (st === "stale")
    return { key:"GOVERNANCE HEALTHY", cls:"",
             detail:"committee of 1 (solo transport)", recv:"recv 94s ago" };
  return { key:"GOVERNANCE HEALTHY", cls:"",
           detail:"committee of 1 (solo transport)", recv:"recv 41m ago" };
}
function swarmMode(st){
  if (st === "highvolume") return "INCIDENT";
  if (st === "busy" || st === "divergence") return "ALERT";
  if (st === "coldstart") return null;
  return "NORMAL";
}
const isLive = (st) => !["coldstart","loading"].includes(st);

/* Selection law — 04 section 2.1: the oldest undecided hold, else the oldest
   unreviewed finding. Revision 1 landed on a finding; this one lands where the
   law says, and J/K walk the same order. */
function orderedRows(){
  const st = S.state, out = [];
  const hs = holdsFor(st).slice().sort((a, b) => a.heldAtMs - b.heldAtMs);
  hs.forEach(h => out.push({ kind:"hold", id:h.id, data:h }));
  if (hs.length && ["busy","quiet","divergence","highvolume"].includes(st))
    out.push({ kind:"snooze", id:"sn1", data:SNOOZE_DUE });
  findingsFor(st).forEach(f => out.push({ kind:"finding", id:f.id, data:f }));
  caseActFor(st).forEach(c => out.push({ kind:"case", id:c.id, data:c }));
  return out;
}
const selected = () => orderedRows().find(r => r.id === S.sel) || orderedRows()[0] || null;

/* ==========================================================================
   GOVERNANCE STRIP  ·  04 section 1.2
   ========================================================================== */
function renderStrip(){
  const g = governance(S.state), mode = swarmMode(S.state), st = S.state;
  const rail = (mode === "ALERT" || mode === "INCIDENT")
    ? '<span class="strip-rail"></span>' : "";
  const bits = [];
  bits.push(`<span class="k ${g.cls}">${g.key}</span>`);
  bits.push(`<span class="sep">·</span><span class="v">${esc(g.detail)}</span>`);
  if (g.recv) bits.push(`<span class="sep">·</span><span class="v mono">${esc(g.recv)}</span>`);
  if (st === "highvolume")
    bits.push('<span class="sep">·</span><span class="v shed">bridge: shedding</span>');
  if (st === "daemondown")
    bits.push('<span class="sep">·</span><span class="v down">daemon unreachable</span>');
  if (st === "stale")
    bits.push('<span class="sep">·</span><span class="v shed">telemetry stale</span>');
  bits.push(st === "coldstart"
    ? '<span class="sep">·</span><span class="v">no watch claimed — classes 1–3 page everyone</span>'
    : `<span class="sep">·</span><span class="v">watch held by ${esc(FX.operatorId)} since ${hhmm(FX.shiftStartMs)}</span>`);
  document.getElementById("strip").innerHTML = rail + bits.join("");

  const mb = document.getElementById("modeband");
  if (mode === "INCIDENT"){
    const c = concentration("execution");
    mb.className = "modeband eyebrow";
    mb.innerHTML = "INCIDENT" +
      `<span class="m">execution · strength 5.42 over ${FX.incidentThreshold.toFixed(1)} · ` +
      `${sa(c.sources, c.agents)} · de-escalation cooldown ${FX.deescalationCooldownS}s</span>`;
  } else {
    mb.className = ""; mb.innerHTML = "";
  }
  document.getElementById("termline").textContent =
    "swarmctl ▸ " + CASES.caseA.name;
}

/* ==========================================================================
   SIDEBAR
   ========================================================================== */
function renderSidebar(){
  const st = S.state, live = isLive(st), c9 = c9For(st);
  const hn = holdsFor(st).length, fn = findingsFor(st).length, cn = caseActFor(st).length;
  const laneStale = st === "stale";
  const quietShift = st === "empty";
  const dash = (v) => live ? v : "";

  /* Every lane number below is computed by concentration(), never typed. */
  let laneRows = "";
  /* Lane telemetry is the substrate, not the queue. It does NOT go quiet just
     because no row is waiting on the operator: an empty queue over three lanes
     above their alert threshold is the exact picture render law 7 exists for. */
  const lanes = LANE_ORDER.map(slug => ({ slug, c: concentration(slug) }))
    .sort((a, b) => b.c.total - a.c.total);
  lanes.slice(0, 4).forEach(({ slug, c }) => {
    const over = live && c.total >= FX.alertThreshold;
    laneRows += `<div class="sb-row">
      <span class="lane-dot" data-over="${over && !laneStale ? 1 : 0}" data-stale="${laneStale && over ? 1 : 0}"></span>
      <span>${slug}</span>
    </div>`;
    if (live && c.total > 0 && over){
      laneRows += `<div class="sb-sub mono">strength ${c.total.toFixed(2)} · alert threshold ${FX.alertThreshold.toFixed(1)}<br>${sa(c.sources, c.agents)}</div>`;
    }
  });

  document.getElementById("sidebar").innerHTML = `
  <div class="sb-group">
    <div class="sb-head"><span class="eyebrow">Watch</span><span class="c">${dash(hn + fn + cn)}</span></div>
    <div class="sb-row" data-active="1"><span>Holds</span><span class="r">${dash(hn)}</span></div>
    <div class="sb-row"><span>Findings</span><span class="r target">${live && c9 ? `${c9.reviewed} / ${c9.total}` : ""}</span></div>
    <div class="sb-row"><span>Case activity</span><span class="r">${dash(cn)}</span></div>
    <div class="sb-row"><span>Named you</span><span class="r" title="absent, not zero — no operator directory exists in a solo deployment">—</span></div>
  </div>

  <div class="sb-group">
    <div class="sb-head"><span class="eyebrow">Threat lanes</span><span class="c">12</span></div>
    ${laneRows}
    <div class="sb-row" style="color:hsl(var(--perch-foreground-muted))"><span style="margin-left:16px">… 8 more</span></div>
  </div>

  <div class="sb-group">
    <div class="sb-head"><span class="eyebrow">Cases</span><span class="c">${live ? (quietShift ? "0 open" : "3 open") : ""}</span></div>
    ${live && !quietShift ? Object.keys(CASES).map(k =>
      `<div class="sb-row"><span class="mono">${caseShort(k)}</span><span class="r mono">${CASES[k].ttlHrs}h left</span></div>`).join("") : ""}
  </div>

  <div class="sb-divider"></div>
  <div class="sb-links">
    <div class="sb-row"><span>Containments</span></div>
    <div class="sb-row"><span>Policy</span></div>
    <div class="sb-row"><span>Tuning</span></div>
    <div class="sb-row"><span>Gaps</span></div>
    <div class="sb-row"><span>Ledger</span></div>
    <div class="sb-row"><span>Watchfloor</span></div>
    <div class="sb-row"><span>Handoff</span></div>
    <div class="sb-row"><span>Settings</span></div>
  </div>`;
}
</script>

function qHead(label, count){

      <b>${c9.promoted}</b> promoted / <b>${c9.notPromoted}</b> did not clear the bar.

function reconcileLine(){
  const st = S.state;

    /* This sentence wraps. It is the only string on screen that says the queue

}

/* ---- the row -----------------------------------------------------------
   Four lines, one anatomy. Line 2 is the subject and it is adversary-

   ------------------------------------------------------------------------ */
function holdRow(h, sel){
  const tok  = SEV_TOKEN[h.sev];

  else if (h.div === "relay-only-nodaemon")
    note = '<span class="divnote">From relay backfill · unconfirmed against the daemon.</span>';
  else if (h.div === "superseded")
    note = '<span class="divnote hard">Another operator recorded the decision on this hold. Your console did not; nothing you press here will run.</span>';

  return `<button class="row" data-id="${h.id}" data-sel="${sel ? 1 : 0}" data-dead="${dead ? 1 : 0}" onclick="select('${h.id}')">
    <span class="rail4" style="background:hsl(var(${tok}))"></span>
    <span class="row-l1">
      <span class="verb">HELD</span><span class="sep">·</span>
      <span class="kind">${h.action}</span>
      <span class="spacer"></span>
      ${sevChip(h.sev)}
    </span>
    <span class="row-l2">${adv(h.subject)}</span>
    <span class="row-l3">
      <span class="mono">${agentShort("ingest")}</span><span class="sep">·</span>
      <span class="mono">${hhmm(h.heldAtMs)}</span>
      <span class="grow"></span>
      ${dead ? "" : `<span class="ttl">expires in ${dur(left)}</span>`}
    </span>
    <span class="row-l4">${sa(c.sources, c.agents)} · <span class="mono">${h.cls}</span></span>
    ${note}
    ${sel ? keys([["G", !dead], ["R", !dead], ["E", true], ["S", false], ["M", true]]) : ""}
  </button>`;
}

function snoozeRow(sel){
  return `<button class="row" data-id="sn1" data-sel="${sel ? 1 : 0}" onclick="select('sn1')">
    <span class="rail4" style="background:hsl(var(--perch-border-strong))"></span>
    <span class="row-l1">
      <span class="verb">SNOOZE DUE</span><span class="sep">·</span>
      <span class="kind">${SNOOZE_DUE.label}</span>
      <span class="spacer"></span>
      <span class="local">local</span>
    </span>
    <span class="row-l2">${adv(SNOOZE_DUE.host)}</span>
    <span class="row-l3"><span class="mono">${SNOOZE_DUE.id}</span><span class="sep">·</span><span>${SNOOZE_DUE.line}</span></span>
    <span class="row-l4"><span class="mono">kind:30300</span>, client-computed · <span class="mono">${SNOOZE_DUE.cls}</span></span>
    ${sel ? keys([["Enter", true], ["S", true], ["M", true]]) : ""}
  </button>`;
}

function findingRow(f, sel){
  const pillar = AGENTS[f.agentKey].pillar;
  const c = concentration(f.cls);
  return `<button class="row" data-id="${f.id}" data-sel="${sel ? 1 : 0}" onclick="select('${f.id}')">
    <span class="rail4" style="background:hsl(var(--perch-border-strong))"></span>
    <span class="row-l1">
      ${reviewMark(f.review)}
      <span class="kind">${f.strategy}</span>
      <span class="spacer"></span>
      <span class="mono" style="font-size:var(--perch-text-xs);color:hsl(var(--perch-foreground-muted))">${hhmm(f.atMs)}</span>
    </span>
    <span class="row-l2">${adv(f.host)}</span>
    <span class="row-l3">
      <span class="mono">${agentShort(f.agentKey)}</span><span class="sep">·</span>
      <span class="mono">${f.conf.toFixed(2)}</span>${confDots(f.conf, pillar)}
      <span class="grow"></span>
      <span${f.review === "reviewed" ? ' style="color:hsl(var(--perch-pillar-substrate-ink))"'
           : f.review === "not-yet-correlated" ? ' style="color:hsl(var(--perch-sev-medium))"' : ""}>${
        REVIEW_WORD[f.review]}${f.reviewAction ? " · " + f.reviewAction : ""}</span>
    </span>
    <span class="row-l4">${sa(c.sources, c.agents)} · <span class="mono">${f.cls}</span></span>
    ${sel ? keys([["C", f.review !== "not-yet-correlated"], ["D", f.review !== "not-yet-correlated"],
                  ["I", f.review !== "not-yet-correlated"], ["S", true], ["E", true]]) : ""}
  </button>`;
}

function caseRow(c, sel){
  return `<button class="row" data-id="${c.id}" data-sel="${sel ? 1 : 0}" onclick="select('${c.id}')">
    <span class="rail4" style="background:hsl(var(--perch-border-pillar-evidence))"></span>
    <span class="row-l1">
      <span class="kind">${caseShort(c.caseKey)}</span>
      <span class="spacer"></span>
      <span class="mono" style="font-size:var(--perch-text-xs);color:hsl(var(--perch-foreground-muted))">${hhmm(c.at)}</span>
    </span>
    <span class="row-l2" style="font-size:var(--perch-text-sm)">${esc(c.line)}</span>
    <span class="row-l4">a NIP-10 reply in a case channel you joined</span>
    ${sel ? keys([["Enter", true], ["M", true]]) : ""}
  </button>`;
}

function emptyBlock(mark, title, body, label, href){
  return `<div class="emptystate">
    <span class="mark">${MARKS[mark]}</span>
    <h4>${title}</h4>
    <p>${body}</p>
    ${label ? `<a href="${href}" onclick="return false">${label} →</a>` : ""}
  </div>`;
}
function skeletons(n){
  let s = "";
  for (let i = 0; i < n; i++) s += '<div class="skel"><i></i><i></i></div>';
  return s;
}

function renderInbox(){
  const st = S.state, el = document.getElementById("inbox"), sel = S.sel;

  if (st === "coldstart"){
    el.innerHTML = `
    ${qHead("Holds")}
    ${c9Strip()}
    <div class="coldstart">
      <h4>Loading the watch</h4>
      <p>Nothing has arrived yet. Three things must land before this queue is trustworthy, and
      they land in this order:</p>
      <ol>
        <li>REQ {kinds:[26006]} — the hold alarm subscription</li>
        <li>query_needs_action — the relay's stored kind:46010 notices</li>
        <li>GET /v1/response/holds — the daemon, which is the authority</li>
      </ol>
      <p class="small">Until step 3 answers, this queue shows what the relay has and says so. The
      relay carries the notification; the daemon's open-hold list is the record.</p>
    </div>`;
    return;
  }

  if (st === "loading"){
    el.innerHTML = `
    ${qHead("Holds", null)}
    ${c9Strip()}
    ${skeletons(3)}
    ${qHead("Findings to review", null)}
    ${skeletons(4)}
    ${qHead("Case activity", null)}
    ${skeletons(1)}
    <div style="padding:.25rem .75rem 1rem;font-size:var(--perch-text-xs);color:hsl(var(--perch-foreground-muted))">
      Queue headings are real; counts read <span class="mono">count unavailable</span> rather than zero.</div>`;
    return;
  }

  const holds = holdsFor(st).slice().sort((a, b) => a.heldAtMs - b.heldAtMs);
  const finds = findingsFor(st), cases = caseActFor(st), c9 = c9For(st);
  let html = "";

  /* --- banners above queue 1 ------------------------------------------- */
  if (st === "stale"){
    html += `<div class="banner">
      <span class="h eyebrow">Gap in the evidence stream</span>
      Sequence 4,472 did not arrive; the next envelope was 4,478. 6 events are missing from this
      view. This is a gap in what Perch received, not a gap in what the daemon recorded.
      <div style="margin-top:.375rem"><a href="#" onclick="return false">Reconcile against the daemon →</a></div>
    </div>
    <div class="banner">
      <span class="h eyebrow">Telemetry stale</span>
      No concentration snapshot for 94s. The threat-class indicators in the sidebar are the last
      received values, not current ones.
    </div>`;
  }
  if (st === "daemondown"){
    html += `<div class="banner down">
      <span class="h eyebrow">Daemon unreachable</span>
      Perch cannot reach swarm_detect at <span class="mono">${FX.daemonUrl}</span>. You can read
      history; you cannot record a decision or release a containment. An open containment lease's
      own 900s TTL is the only backstop while this lasts.
    </div>`;
  }
  if (st === "highvolume"){
    html += `<div class="banner">
      <span class="h eyebrow">${holds.length} holds open</span>
      A queue this deep is a tuning problem, not a staffing one.
      <div style="margin-top:.375rem"><a href="#" onclick="return false">Open the tuning bench →</a></div>
      <div class="meta" style="margin-top:.375rem">PERCH_QUEUE_DEPTH_ALARM = ${FX.queueDepthAlarm}.
      The flat age-ordered list is retained: no grouping, no truncation, no cap.</div>
    </div>`;
  }

  const allEmpty = holds.length === 0 && finds.length === 0 && cases.length === 0;

  /* One empty state for the whole inbox when all four queues are zero.
     Revision 1 stacked three near-identical blocks behind one repeated disc. */
  if (allEmpty){
    html += qHead("Holds", 0) + c9Strip() + reconcileLine();
    html += `<div class="emptystate" style="max-width:26rem">
      <span class="mark">${MARKS.threshold}</span>
      <h4>Nothing is waiting on you</h4>
      <p>No held actions, no due snoozes, no findings, no case activity. 6 destructive actions ran
      in this window without a hold — below <span class="mono">human_gate_severity</span>, or
      matched by an allow rule.</p>
      <p>${FX.gaps.techniques} techniques across ${FX.gaps.detectors} detectors are declared
      uncovered, so a quiet shift is partly a statement about coverage.</p>
      <p><a href="/policy" onclick="return false">See which rule decided →</a></p>
      <p><a href="/gaps" onclick="return false">See declared gaps →</a></p>
    </div>
    ${qHead("Findings to review", 0)}
    ${qHead("Case activity", 0)}`;
    el.innerHTML = html;
    return;
  }

  /* --- queue 1 : HOLDS -------------------------------------------------- */
  html += qHead("Holds", holds.length);
  html += c9Strip();
  html += reconcileLine();
  if (holds.length) html += ADV_LEGEND_QUEUE;
  if (holds.length === 0){
    html += emptyBlock("threshold", "Nothing is waiting on you",
      "No held actions, no due snoozes. 6 destructive actions ran in this window without a hold — below <span class='mono'>human_gate_severity</span>, or matched by an allow rule.",
      "See which rule decided", "/policy");
  } else {
    holds.forEach(h => { html += holdRow(h, h.id === sel); });
    if (["busy","quiet","divergence","highvolume"].includes(st)) html += snoozeRow(sel === "sn1");
  }

  /* --- queue 2 : NAMED YOU ---------------------------------------------
     Deliberately not rendered. In a solo deployment its header is ABSENT,
     not zero — nothing in Ambush names an operator. 04 section 2.1.        */

  /* --- queue 3 : FINDINGS TO REVIEW ------------------------------------ */
  html += qHead("Findings to review", finds.length && c9 ? `${c9.reviewed} / ${c9.total}` : 0);
  if (st === "highvolume"){
    html += `<div class="shed-row">
      — 340 finding cards coalesced into 12 (bridge over budget 09:14:01–09:14:09) —
      <details><summary>what was suppressed</summary>
      <table>
        <tr><td>execution</td><td>host-ops-1</td><td>184</td></tr>
        <tr><td>data-exfiltration</td><td>build-agent-07</td><td>96</td></tr>
        <tr><td>credential-access</td><td>mail-01</td><td>41</td></tr>
        <tr><td>persistence</td><td>vpn-gw-02</td><td>19</td></tr>
      </table></details>
    </div>`;
  }
  if (finds.length === 0){
    html += emptyBlock("trail", "No findings this shift",
      `${FX.gaps.techniques} techniques across ${FX.gaps.detectors} detectors are declared uncovered — a quiet queue is partly a statement about coverage.`,
      "See declared gaps", "/gaps");
  } else {
    finds.forEach(f => { html += findingRow(f, f.id === sel); });
  }

  /* --- queue 4 : CASE ACTIVITY ----------------------------------------- */
  html += qHead("Case activity", cases.length);
  if (cases.length === 0){
    html += emptyBlock("region", "No open cases",
      "A case opens when a destructive action is held, when a correlated incident includes 2 or more members, or when you promote a finding by hand. 24 findings did not clear that bar this shift.",
      "Review the promotion bar", "/settings#case-promotion");
  } else {
    cases.forEach(c => { html += caseRow(c, c.id === sel); });
  }

  el.innerHTML = html;
}
</script>

<script>
/* ==========================================================================
   DETAIL PANE — the Verdict Row
   Render law 1: the five slots are a const array, in fixed order, and an
   unfillable slot renders an explicit absence rather than collapsing.
   ========================================================================== */
const SLOTS = ["Action","Blast radius","If you undo","Why we are asking","What granting opens"];

function provenanceBlock(cardKind){
  return `<dl class="prov">
    <dt class="eyebrow">Ambush record</dt>
    <dd>ed25519 · <span class="state unatt">NO SIGNATURE OF ITS OWN</span>
      <span class="note">This card is a copy. ${cardKind} carries no signature in Ambush today, so
      nothing here can be checked offline. The daemon holds the record.</span>
      <span class="note"><button class="chip" style="margin-top:.375rem;font-size:var(--perch-text-xs);padding:.25rem .5rem"
        onclick="say('Re-reads this artifact from swarm_detect by id and compares it byte for byte with the copy on the relay. It checks no signature, because there is none to check.')">Check against the daemon</button></span>
    </dd>
    <dt class="eyebrow">Relay envelope</dt>
    <dd><span class="state">secp256k1</span> · <span class="npub">${FX.bridgePubkey}</span>
      <span class="note">Transport only. The envelope shows this card reached the relay from the
      bridge's key and was not altered in transit. It says nothing about whether the daemon
      produced it. The key is rendered whole: a truncated key is forgeable by vanity grinding.</span>
    </dd>
  </dl>`;
}

function detailHold(h){
  const disabled = S.state === "daemondown" || h.div === "relay-only" || h.div === "superseded";
  const expired    = h.div === "relay-only";
  const superseded = h.div === "superseded";
  const c    = concentration(h.cls);
  const left = holdLeft(h);
  const leases = CONTAINMENT_ACTIONS.includes(h.action);

  const inverseRow = h.inverse
    ? `<span class="head">Reversible — <span class="mono" style="display:inline;margin:0">${h.inverse}</span> on ${adv(h.blast.value)}.</span>
       ${esc(h.inverseSummary)}. Release runs it and the receipt reports whether it worked, in five
       RollbackStepStatus values — the receipt is the answer, not the 200.`
    : `<span class="head neg">No executable inverse</span>
       <span class="mono">resolve_inverse(${h.action}) → None</span>
       No inverse operation is defined for ${h.action}. Undoing this is a manual operation on your
       side. ${leases
         ? "The containment lease stays in effect until its own TTL expires or you release it."
         : "Nothing was contained, so there is nothing to release — the effect stands until you undo it by hand."}`;

  /* WHAT GRANTING OPENS is TWO objects and they are never merged.
     issue_lease mints a CAPABILITY lease for any allowed action at decision
     time (policy.lease_ttl_ms = 60,000). A CONTAINMENT lease is a different
     object with a different TTL (runtime.containment.lease_ttl_ms = 900,000)
     and only 4 of the 12 destructive actions mint one. */
  const leaseRow = `
    <span class="head">capability lease · ${h.action} · scope ${h.blast.kind}:${esc(h.blast.value)} ·
      ${FX.capabilityLeaseTtlMs / 1000}s</span>
    Minted when you decide, not when the hold opened. It expires
    ${FX.capabilityLeaseTtlMs / 1000}s after your decision whether or not the action has dispatched.
    <span class="mono">${leases
      ? `containment lease: yes — ${h.action} is one of the four containment actions.
A ContainmentLease opens on /leases with its own ${FX.containmentLeaseTtlMs / 1000}s TTL, and a
rollback receipt follows its release.`
      : `containment lease: none — ${h.action} is not one of the four containment actions.
Nothing opens on /leases, nothing counts down there, and no rollback receipt is produced.`}</span>`;

  return `
  <div class="detail-rail" style="background:hsl(var(--perch-pillar-authority-mark))"></div>
  <div class="detail-inner">${crosshairs()}
    <div class="d-title">
      <div style="min-width:0">
        <h2>${h.action}</h2>
        <span class="sub">hold ${h.holdId} · ${caseShort(h.caseKey)} · opened ${hhmmss(h.heldAtMs)}Z<br>
          channel ${CASES[h.caseKey].id}</span>
      </div>
      <div style="margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-shrink:0">
        ${sevChip(h.sev)}
        <span class="label-tight" style="color:hsl(var(--perch-sev-high));border:1px solid hsl(var(--perch-border-pillar-authority));border-radius:9999px;padding:5px 8px 4px">Destructive</span>
      </div>
    </div>

    ${ADV_LEGEND}

    <dl class="fields">
      <dt class="eyebrow">${SLOTS[0]}</dt>
      <dd><span class="head">${{
          isolate_host:      "Cut all network connectivity for ",
          block_egress:      "Block all network egress to ",
          quarantine_file:   "Move to the quarantine store: ",
          revoke_credential: "Revoke the credential for ",
        }[h.action]}${adv(h.subject)}.</span>${ADV_LABEL}
        <span class="mono">${h.subjectLabel} = ${esc(h.subject)}
${h.detail.map(([k, v]) => `${k.padEnd(18)}${v}`).join("\n")}</span>
      </dd>

      <dt class="eyebrow">${SLOTS[1]}</dt>
      <dd>
        <div class="notch" style="--nh:var(--perch-pillar-evidence-mark)">
          <span class="nlabel label-tight">Blast radius</span>
          <span class="nannot">ResponseBlastRadiusPreview · simulated_only: true</span>
          <span class="core">${esc(h.blast.impact)} · scope ${esc(h.blast.kind)}</span>
          <span class="mono" style="display:block;margin-top:.375rem;color:hsl(var(--perch-foreground-muted))">scope_value       ${esc(h.blast.value)}
max_affected      ${h.blast.max}
capabilities      ${h.blast.caps.join(", ")}</span>
          <span style="display:block;margin-top:.5rem">${esc(h.blast.summary)}. ${ADV_LABEL}</span>
        </div>
      </dd>

      <dt class="eyebrow">${SLOTS[2]}</dt>
      <dd>${inverseRow}</dd>

      <dt class="eyebrow">${SLOTS[3]}</dt>
      <dd><span class="head">No policy rule matched → the static gate asked for a human.</span>
        The static gate asks a human for any destructive action at ${FX.humanGateSeverity} or above.
        This request is ${h.sev}.
        <span class="mono">rule_name    static.human_gate
verdict      require_human
threat_class ${h.cls}                (request-carried)
severity     ${h.sev}                (request-carried)
concentration ${c.total.toFixed(6)} · ${sa(c.sources, c.agents)} · peak ${c.peak.toFixed(2)}</span>
        <a href="/policy" onclick="return false">See /policy — 3 rules, none matched this triple</a>
      </dd>

      <dt class="eyebrow">${SLOTS[4]}</dt>
      <dd>${leaseRow}</dd>
    </dl>

    <div class="hr"></div>
    <div class="ev-head">
      <span class="t eyebrow">Evidence</span>
      <span class="n">${sa(c.sources, c.agents)}</span>
      <span style="color:hsl(var(--perch-pillar-evidence-mark))">${trailSVG()}</span>
    </div>
    ${evidenceTable(h.cls)}
    ${sourceNote(c)}

    <div class="hr"></div>
    ${provenanceBlock("swarm:hold:v1")}

    <div class="hr"></div>
    ${expired
      ? `<div class="toast">This hold expired at ${hhmmss(holdExpiresMs(h))}Z and nothing was
         dispatched. The row stays in this queue for the shift.
         <a href="/ledger" onclick="return false" style="color:hsl(var(--perch-pillar-evidence-ink))">open in the Ledger</a></div>`
      : superseded
      ? `<div class="toast bad"><b>Another operator's decision is the one that executed.</b>
         The daemon's compare-and-set into <span class="mono">deciding</span> admitted one console
         and returned <span class="mono">409 hold_already_deciding</span> to this one. Your signed
         intent card is on the relay and is permanent; it is not the decision.
         <span style="display:block;margin-top:.375rem;color:hsl(var(--perch-foreground-muted))">
         This state needs a wire value that does not exist yet — see the Spec notes, open item O-1.
         </span></div>`
      : `<button class="grant" data-armed="${S.grantArmed ? 1 : 0}" ${disabled ? "disabled" : ""} onclick="armGrant()">
           Record my decision and send it to the daemon <kbd style="float:right">G</kbd>
         </button>
         ${S.grantArmed ? `<div class="armed"><span class="h eyebrow">Armed</span>
           A second stroke records. It is gated on the BLAST RADIUS block having been fully visible
           for 1500 ms on this hold_id, and it is ignored on key-repeat. The two-stroke gate, its
           dwell timer and its confirmation are drawn in
           <span class="mono" style="display:inline;margin:0">prototypes/verdict-hold.html</span>,
           which owns the hold state of this pane.</div>` : ""}
         <div class="controls" style="margin-top:.5rem">
           <button class="chip refuse" ${S.state === "daemondown" ? "disabled" : ""} onclick="say('Refused. Recorded as a signed refusal in this case, and posted separately to the daemon. Nothing dispatches.')">Refuse <span class="g">R</span></button>
           <button class="chip" onclick="say('Promote opens a case channel and the incident record a verdict needs. It does not route this to anyone — no operator directory exists in either tree.')">Promote to a case <span class="g">E</span></button>
           <button class="chip" disabled>Snooze <span class="g">S</span></button>
         </div>
         <div class="ctl-hint">
           Perch does not authorize. The daemon re-derives policy and governance from scratch before
           anything dispatches, in a different process.
           <span class="dis">Snooze is disabled: a held action cannot be snoozed. It expires on its
           own in ${dur(left)} and nothing runs. Refuse it (R) if you do not want it to run.</span>
         </div>
         <div class="ctl-hint expiry">This hold expires in ${dur(left)}. After that the daemon
           dispatches nothing.</div>
         ${disabled && S.state === "daemondown"
           ? `<div class="toast bad">Cannot reach the daemon. Nothing has been published and no
              decision has been delivered.
              <button class="chip" style="padding:.125rem .375rem;font-size:var(--perch-text-xs)" onclick="say('Retry queued. It re-sends identical signed bytes; the relay dedupes by event id.')">retry</button></div>`
           : ""}
      `}
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}
  </div>`;
}

/* Evidence, grouped by real agent — render law 2's expansion. */
function evidenceTable(cls){
  if (!S.evidenceOpen) return "";
  const byAgent = {};
  (LANE_DEPOSITS[cls] || []).forEach(([ago, conf, agentKey, strategyId, eventId]) => {
    (byAgent[agentKey] = byAgent[agentKey] || []).push([strategyId, conf, ago, eventId]);
  });
  let rows = "";
  Object.keys(byAgent).forEach(k => {
    const strategies = new Set(byAgent[k].map(d => d[0]));
    rows += `<tr><td class="ev-group" colspan="3">${agentFull(k)} — ${sa(strategies.size, 1)}</td></tr>`;
    byAgent[k].forEach(([strategyId, conf, ago]) => {
      rows += `<tr><td>${agentShort(k)}:${strategyId}</td>
        <td class="r">${conf.toFixed(2)} ${confDots(conf, AGENTS[k].pillar)} → ${strengthAt(conf, ago).toFixed(3)}</td>
        <td class="r">${hhmmss(FX.nowMs - ago * 1000)}Z</td></tr>`;
    });
  });
  return `<table class="ev-table">${rows}</table>`;
}

/* Render law 2's explanation. No glyph: copy-ban-list row `shield-glyph` is P0
   and its pattern carries the warning sign with no exemption. The caution
   register here is a 2px leading rail plus an eyebrow plus words. */
function sourceNote(c){
  return `<div class="ev-note">
    <span class="h">How this count is made</span>
    ${sa(c.sources, c.agents)} — that is ${c.sources} strategy-scoped ids resolving to ${c.agents}
    real agent${c.agents === 1 ? "" : "s"}, against a min_sources_for_escalation of ${FX.minSources}.
    resolve_deposits writes each deposit's agent_id as
    <span class="mono" style="display:inline;margin:0">{agent}:{strategy_id}</span>, so one agent
    running ${c.sources} detectors clears the bar on its own.
  </div>`;
}
</script>

<script>
/* Dismiss arithmetic. Suppression is keyed on (threat_class, event_id), so it
   reaches detectors the operator never reviewed. Both branches are reachable in
   this fixture: f1/f2/f4 cross alert_threshold and open the modal, f5/f7 do not
   and commit inline. Every number is recomputed, never typed. */
function dismissPreview(f){
  const before = concentration(f.cls);
  const after  = concentration(f.cls, [f.eventId]);
  return {
    before: before.total, after: after.total,
    removed: before.deposits - after.deposits,
    crosses: before.total >= FX.alertThreshold && after.total < FX.alertThreshold,
    beforeC: before, afterC: after,
  };
}

function detailFinding(f){
  const pillar = AGENTS[f.agentKey].pillar;
  const ntc = f.review === "not-yet-correlated";
  const daemonDown = S.state === "daemondown";
  const dis = ntc || daemonDown;
  const c = concentration(f.cls);
  const d = dismissPreview(f);

  return `
  <div class="detail-rail" style="background:hsl(var(--perch-pillar-substrate-mark))"></div>
  <div class="detail-inner">${crosshairs()}
    <div class="d-title">
      <div style="min-width:0">

      `<button onclick="say('Snoozed — ${p}.');S.overlay=null;render()">${p}</button>`).join("")}</div>` : ""}

function renderDetail(){
  const el = document.getElementById("detail"), st = S.state;
  if (st === "coldstart" || st === "loading"){
    el.innerHTML = `<div class="detail-rail" style="background:hsl(var(--perch-border-strong))"></div>
      <div class="detail-inner"><div class="emptystate">
      <span class="mark">${MARKS.region}</span>
      <h4>${st === "loading" ? "Loading the held action" : "Nothing selected yet"}</h4>
      <p>${st === "loading"
        ? "The five verdict fields render in a fixed order. They appear together or not at all."
        : "The verdict pane fills when the queue does. It never renders a partial field set."}</p></div></div>`;
    return;
  }
  const r = selected();
  if (!r){
    /* 06 section 5.2's watchAll copy assumes the substrate is quiet too. It is
       not here, and saying "nothing crossed a threshold" over a lane at 2.65
       against 2.0 would be false. Both branches render. */
    const top = LANE_ORDER.map(slug => ({ slug, c: concentration(slug) }))
      .sort((a, b) => b.c.total - a.c.total)[0];
    const above = top.c.total >= FX.alertThreshold;
    el.innerHTML = `<div class="detail-rail" style="background:hsl(var(--perch-border-strong))"></div>
      <div class="detail-inner"><div class="emptystate" style="max-width:30rem">
      <span class="mark">${MARKS.threshold}</span>
      <h4>The watch is clear</h4>
      <p>Last deposit landed 6m ago. Mode is Normal.</p>
      <p>${above
        ? `That is not the same as quiet. The busiest threat class, ${top.slug}, is at
           ${top.c.total.toFixed(2)} against an alert threshold of ${FX.alertThreshold.toFixed(1)},
           from ${sa(top.c.sources, top.c.agents)}. An alert is not a hold: nothing there has
           requested a destructive action, so nothing is waiting on you.`
        : `Nothing here means nothing crossed a threshold, not that nothing happened — the busiest
           threat class, ${top.slug}, is at ${top.c.total.toFixed(2)} against an alert threshold of
           ${FX.alertThreshold.toFixed(1)}.`}</p>
      <a href="/watch-floor" onclick="return false">Open the Watchfloor →</a></div></div>`;
    return;
  }
  if (r.kind === "hold")         el.innerHTML = detailHold(r.data);
  else if (r.kind === "finding") el.innerHTML = detailFinding(r.data);
  else if (r.kind === "case")    el.innerHTML = detailCase(r.data);
  else                           el.innerHTML = detailSnooze();
}

<script>
/* ==========================================================================
   OVERLAYS: the omnibox (query + command) and the Dismiss dialog
   ========================================================================== */
function renderOverlay(){
  const el = document.getElementById("overlay");
  if (S.overlay === "omni-query"){
    el.innerHTML = `<div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
      <div class="omni" role="dialog" aria-label="Ledger query">
        <div class="omni-input">
          <span class="omni-scope">Ledger · everything</span>
          <span class="omni-q">in:${CASES.caseA.id.slice(0,8)} after:2026-03-17 block_egress<span class="caret"></span></span>
        </div>
        <div class="omni-sec eyebrow">Matches — 12</div>
        <div class="omni-item" data-sel="1"><span class="mono">swarm:hold:v1</span> block_egress · 198.51.100.20 <span class="m">${caseShort("caseA")} · 09:14</span></div>
        <div class="omni-item"><span class="mono">swarm:receipt:v1</span> isolate_host · dispatched <span class="m">${caseShort("caseA")} · 09:16</span></div>
        <div class="omni-item"><span class="mono">swarm:verdict:v1</span> refuse · block_egress <span class="m">${caseShort("caseC")} · 08:41</span></div>
        <div class="omni-item"><span class="mono">swarm:finding:v1</span> suspicious_scripting · host-ops-1 <span class="m">execution · 09:14</span></div>
        <div class="omni-foot">
          <span class="mono">from:</span> <span class="mono">in:</span> <span class="mono">after:</span>
          <span class="mono">before:</span> are operators.
          <span class="mono">class:</span> <span class="mono">action:</span> <span class="mono">host:</span>
          <span class="mono">agent:</span> are text terms, not filters — strategy_id, host_id,
          receipt_id and lease_id are searchable as text but not selectable as filters, because
          NIP-01 indexes only single-letter tags and these events are signed.
          <div style="margin-top:.375rem">Type <span class="mono">&gt;</span> to switch to commands.
          <kbd>Esc</kbd> closes.</div>
        </div>
      </div></div>`;
    return;
  }
  if (S.overlay === "omni-cmd"){
    el.innerHTML = `<div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
      <div class="omni" role="dialog" aria-label="Commands">
        <div class="omni-input">
          <span class="omni-scope">Command</span>
          <span class="omni-q">&gt; <span class="caret"></span></span>
        </div>
        <div class="omni-sec eyebrow">Commands</div>
        <div class="omni-item" data-sel="1">&gt; take the watch <span class="m">/handoff</span></div>
        <div class="omni-item">&gt; end watch <span class="m">/handoff</span></div>
        <div class="omni-item">&gt; release containment ${CONTAINMENT.a} <span class="m">Containments</span></div>
        <div class="omni-item">&gt; open gaps <span class="m">/gaps</span></div>
        <div class="omni-item">&gt; export this result set <span class="m">/ledger</span></div>
        <div class="omni-foot">
          Commands that write are never executed on <kbd>Enter</kbd> alone — they open the surface
          with the action staged. The palette is navigation and staging, never a second
          authorization path.
        </div>
      </div></div>`;
    return;
  }
  if (S.overlay === "dismiss"){
    const r = selected();
    const f = r && r.kind === "finding" ? r.data : FINDINGS[0];
    const d = dismissPreview(f);
    el.innerHTML = `<div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>Dismiss this finding and suppress ${plural(d.removed, "deposit")}?</h3>
        <p>Dismissing records <span class="mono">false_positive: true</span> and drops every deposit
        that carries this finding's telemetry event id <span class="mono">${f.eventId}</span> in
        threat class <span class="mono">${f.cls}</span>, from every detector, with a timestamp at or
        before this marker — ${plural(d.removed, "deposit")},
        ${sa(d.beforeC.sources, d.beforeC.agents)} before, ${sa(d.afterC.sources, d.afterC.agents)} after.</p>
        <table>
          <tr><td>concentration for ${f.cls}</td><td class="v">${d.before.toFixed(6)} → ${d.after.toFixed(6)}</td></tr>
          <tr><td>alert_threshold</td><td class="v">${FX.alertThreshold.toFixed(2)}</td></tr>
        </table>
        <p>This lane will fall below its alert threshold. Suppression is keyed on
        (threat class, event id), not on the detector, so detectors you have not reviewed are
        suppressed too. It appears as an explicit suppression row on the lane timeline.</p>
        <div class="acts">
          <button class="chip dismiss" onclick="S.overlay=null;S.dismissArmed=false;say('Dismissed and suppressed. Recorded by ${FX.operatorId} in Perch at ${hhmmss(FX.nowMs)}Z.');render()">Dismiss and suppress</button>
          <button class="chip" onclick="S.overlay=null;S.dismissArmed=false;render()">Cancel</button>
        </div>
      </div></div>`;
    return;
  }
  el.innerHTML = "";
}

/* ==========================================================================
   PROTOTYPE STATE PANEL
   ========================================================================== */
function renderStates(){
  const b = document.getElementById("statesbody");
  const on = (g, v) =>
    (g === "state" && S.state === v) ||
    (g === "ov" && (S.overlay || "null") === v) ||
    (g === "sel" && S.sel === v) ||
    (g === "theme" && (S.theme || "system") === v) ? 1 : 0;
  const btn = (g, v, label) => `<button data-on="${on(g, v)}" onclick="setG('${g}','${v}')">${label}</button>`;
  b.innerHTML = `
  <div class="grp"><span>State</span><div class="btns">
    ${STATES.map(s => btn("state", s, STATE_LABEL[s])).join("")}
  </div></div>
  <div class="grp"><span>Detail</span><div class="btns">
    ${btn("sel","hA","hold · leased")}
    ${btn("sel","hD","hold · unleased")}
    ${btn("sel","f1","finding")}
    ${btn("sel","f6","not yet correlated")}
    ${btn("sel","f3","reviewed finding")}
    ${btn("sel","sn1","due snooze")}
    ${btn("sel","c1","case activity")}
  </div></div>
  <div class="grp"><span>Overlay</span><div class="btns">
    ${btn("ov","omni-query","⌘K query")}
    ${btn("ov","omni-cmd","⌘K command")}
    ${btn("ov","dismiss","dismiss dialog")}
    ${btn("ov","null","none")}
  </div></div>
  <div class="grp"><span>Theme</span><div class="btns">
    ${btn("theme","system","system")}
    ${btn("theme","light","light")}
    ${btn("theme","dark","dark")}
  </div></div>
  <div class="note"><kbd>J</kbd><kbd>K</kbd> move · <kbd>C</kbd><kbd>D</kbd><kbd>I</kbd> verdict ·
  <kbd>S</kbd> snooze · <kbd>E</kbd> promote · <kbd>G</kbd><kbd>R</kbd> hold ·
  <kbd>M</kbd><kbd>U</kbd> local · <kbd>⌘K</kbd> omnibox ·
  <kbd>Esc</kbd> closes, never marks read</div>`;
}
function applyTheme(){
  const root = document.documentElement;
  root.classList.remove("light", "dark");
  if (S.theme) { root.setAttribute("data-theme", S.theme); root.classList.add(S.theme); }
  else root.removeAttribute("data-theme");
}
function setG(g, v){
  if (g === "state"){
    S.state = v; S.dismissArmed = false; S.grantArmed = false; S.toast = null;
    reselect();
  }
  if (g === "ov")    S.overlay = v === "null" ? null : v;
  if (g === "sel"){  S.sel = v; S.dismissArmed = false; S.grantArmed = false; S.toast = null; }
  if (g === "theme"){ S.theme = v === "system" ? null : v; applyTheme(); }
  pushHash(); render();
}
function reselect(){
  const rows = orderedRows();
  if (rows.find(r => r.id === S.sel)) return;
  const hold = rows.find(r => r.kind === "hold" && !["relay-only","superseded"].includes(r.data.div));
  const find = rows.find(r => r.kind === "finding" && r.data.review === "unreviewed");
  S.sel = ((hold || find || rows[0]) || {}).id;
}
function toggleStates(){
  const p = document.getElementById("states");
  S.minStates = !S.minStates;
  p.setAttribute("data-min", S.minStates ? "1" : "0");
  document.getElementById("stbtn").textContent = S.minStates ? "show" : "hide";
}

/* ==========================================================================
   INTERACTION
   ========================================================================== */
function select(id){ S.sel = id; S.dismissArmed = false; S.grantArmed = false; S.toast = null; pushHash(); render(); }
function say(m){ S.toast = m; render(); }
function verdict(v){
  const r = selected();
  if (!r || r.kind !== "finding") return;
  say(`${v} recorded. Recorded by ${FX.operatorId} in Perch at ${hhmmss(FX.nowMs)}Z. The daemon's own receipt shows that a human was asked, not which one answered.`);
}
function armDismiss(){
  const r = selected();
  if (!r || r.kind !== "finding") return;
  const f = r.data, d = dismissPreview(f);
  if (!S.dismissArmed){ S.dismissArmed = true; render(); return; }
  if (d.crosses){ S.overlay = "dismiss"; render(); return; }
  S.dismissArmed = false;
  say(`Dismissed and suppressed. ${plural(d.removed, "deposit")} removed; concentration for ${f.cls} ${d.before.toFixed(6)} → ${d.after.toFixed(6)} against an alert threshold of ${FX.alertThreshold.toFixed(2)}. It did not cross the line.`);
}
function armGrant(){
  if (!S.grantArmed){ S.grantArmed = true; render(); return; }
  say("The second stroke is gated on the BLAST RADIUS dwell timer, which lives in prototypes/verdict-hold.html.");
}

window.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k"){
    e.preventDefault();
    S.overlay = S.overlay === "omni-query" ? "omni-cmd" : "omni-query";
    render(); return;
  }
  if (e.key === "Escape"){
    /* Escape closes the topmost surface and NEVER marks read. Buzz binds bare
       Escape to mark-channel-read; a queue must not be clearable by accident. */
    if (S.overlay){ S.overlay = null; render(); return; }
    if (S.dismissArmed || S.grantArmed){ S.dismissArmed = false; S.grantArmed = false; render(); return; }
    if (S.toast){ S.toast = null; render(); }
    return;
  }
  if (S.overlay === "omni-query" && e.key === ">"){ e.preventDefault(); S.overlay = "omni-cmd"; render(); return; }
  if (S.overlay) return;
  /* useAppShellKeyboardShortcuts.ts:60 ignores event.repeat, and so does this. */
  if (mod || e.altKey || e.repeat) return;

  const rows = orderedRows(); if (!rows.length) return;
  let i = rows.findIndex(r => r.id === S.sel); if (i < 0) i = 0;
  const r = rows[i], k = e.key.toLowerCase();

  if (k === "j"){ e.preventDefault(); select(rows[Math.min(i + 1, rows.length - 1)].id); return; }
  if (k === "k"){ e.preventDefault(); select(rows[Math.max(i - 1, 0)].id); return; }
  if (!r) return;

  if (r.kind === "finding"){
    if (r.data.review === "not-yet-correlated" && "cdi".includes(k)){
      e.preventDefault();
      say("No incident record, and feedback needs one. Promote to a case (E) to create it.");
      return;
    }
    if (k === "c"){ e.preventDefault(); verdict("Confirm"); return; }
    if (k === "i"){ e.preventDefault(); verdict("Investigate"); return; }
    if (k === "d"){ e.preventDefault(); armDismiss(); return; }
    if (k === "s"){ e.preventDefault(); S.overlay = "snooze"; render(); return; }
  }
  if (r.kind === "hold"){
    if (k === "g"){ e.preventDefault(); armGrant(); return; }
    if (k === "r"){ e.preventDefault(); say("Refused. Recorded as a signed refusal in this case, and posted separately to the daemon. Nothing dispatches."); return; }
    if (k === "s"){ e.preventDefault(); say(`A held action cannot be snoozed. It expires on its own in ${dur(holdLeft(r.data))} and nothing runs. Refuse it (R) if you do not want it to run.`); return; }
  }
  if (k === "e"){ e.preventDefault(); say("Promote opens a case channel and the incident record a verdict needs. It does not route this to anyone — no operator directory exists in either tree."); return; }
  if (k === "m"){ e.preventDefault(); say("Marked done. localStorage only, per-pubkey, capped at 500 items. Done is not a decision, and the copy never says resolved."); return; }
  if (k === "u"){ e.preventDefault(); say("Marked unread. Local only. Read, Done, Reviewed and Decided are four different facts."); return; }
  if (e.key === "Enter"){ e.preventDefault(); say("Enter opens — the case, the lane, the containment detail. It is the only open verb."); return; }
});

/* ==========================================================================
   DEEP LINKS.  The FRAGMENT is canonical:
       watch.html#state=daemondown&sel=hA&ov=dismiss&theme=light
   The fragment form is the one prototypes/watchfloor-ledger.html already uses,
   and it survives a file:// double-click where a query string does not.
   Revision 1 read `location.search` only, which meant the two prototypes in the
   set that implemented deep links implemented two different mechanisms. The
   query form still parses so revision-1 links keep working, and every state
   change rewrites the fragment so a reviewer can copy the address bar.
   ========================================================================== */
function readLink(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  const q = new URLSearchParams(location.search.replace(/^\?/, ""));
  const get = (k) => p.get(k) !== null ? p.get(k) : q.get(k);
  const st = get("state");   if (st && STATES.includes(st)) S.state = st;
  const th = get("theme");   if (th === "light" || th === "dark") S.theme = th;
  const ov = get("ov");      if (ov) S.overlay = ov === "null" ? null : ov;
  const sel = get("sel");
  if (sel && orderedRows().find(r => r.id === sel)) S.sel = sel;
  reselect();
}
let suppressHash = false;
function pushHash(){
  const p = new URLSearchParams();
  p.set("state", S.state);
  if (S.sel) p.set("sel", S.sel);
  if (S.overlay) p.set("ov", S.overlay);
  if (S.theme) p.set("theme", S.theme);
  suppressHash = true;
  history.replaceState(null, "", "#" + p.toString());
  suppressHash = false;
}
window.addEventListener("hashchange", () => {
  if (suppressHash) return;
  readLink(); applyTheme(); render();
});

/* ========================================================================== */
function render(){
  renderStrip(); renderSidebar(); renderInbox(); renderDetail();
  renderOverlay(); renderStates();
}

  <p><b style="color:hsl(var(--perch-foreground))">CANONICAL — used verbatim from
  <code>build/fixtures/perch-demo-fixture.json</code>:</b> the clock (shift start
  <code>1773734400000</code> = 08:00:00Z on 2026-03-17; “now” is
  <code>clock.timestamps.open_row_ms</code> = <code>1773738965000</code> = 09:16:05Z, the instant the

  <code>cast.daemon.ingest_agent_id</code>; the case channel
  <code>27799e23-ab25-4659-b381-3de47ea7ca4d</code>; the incident id
  <code>incident:hunt-evt-1:1773738882400</code>; holds <code>h_a07aeacf</code> (isolate_host,

  <ul>
    <li><b style="color:hsl(var(--perch-foreground))">No px font sizes and no 8px text.</b> Every
      size derives from <code>--buzz-type-rem</code>, which is
      <code>globals/typography.css:15-17</code>'s own name, so Cmd +/- zoom AND the accessibility

      variable name is declared or read, because ThemeProvider writes 38 of them inline on the root

    <li><b style="color:hsl(var(--perch-foreground))">Escape never marks read.</b> It closes the
