[graph]
targets = []
all-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "notify v7 still pulls instant transitively and there is no safe replacement available in the current major line" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is still used transitively by the shipped rustls stack and the upstream replacement requires a coordinated dependency migration" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "BSD-1-Clause",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# WHY THESE ARE `skip` ENTRIES AND NOT `-A duplicate`
#
# `cargo deny check bans -A duplicate`, which tools/check-supply-chain.sh used to
# pass, suppresses EVERY duplicate forever -- including ones that do not exist
# yet. It cannot be made to fail, so it is not a gate. A version-pinned
# `[[bans.skip]]` breaks the moment a NEW duplicate appears or a skipped one moves
# version, which is the entire point of the check. Each entry names the dependency
# that pins the old major so it can be retired when that dependency moves.
#
# Reviewed 2026-08-11 (phase 280 / GATEFIX-04). Re-review whenever any named
# pinning dependency is upgraded.
#
# THIS GATE HAS TWO MEASURED LIMITATIONS, NOT ONE. Both are recorded here so the
# duplicate coverage is not read as complete.
#
# MEASURED LIMITATION 1 -- DEV-DEPENDENCY DUPLICATES ARE NOT REPORTED.
# A duplicate introduced solely through a workspace member's DEV-dependency is
# not reported by cargo-deny 0.19.4, with or without `[graph] exclude-dev = false`.
# Verified by adding `base64 = "0.21"` to swarm-crypto: as a `[dependencies]` entry
# the gate fails (`found 2 duplicate entries for crate 'base64'`, exit 2); as a
# `[dev-dependencies]` entry it reports `bans ok` even though Cargo.lock carries
# both 0.21.7 and 0.22.1. Normal-dependency duplicates ARE caught.
#
# MEASURED LIMITATION 2 -- OPTIONAL-FEATURE SUBGRAPHS ARE NOT SCANNED.
# `[graph] all-features = false` above means the resolved graph is the DEFAULT
# feature set. `z3` (swarm-evolution and swarm-runtime, `z3 = ["dep:z3"]`,
# default-off) is the only non-default feature in the workspace -- swarm-pheromone's
# `nats` is on by default -- so everything reachable only through `--features z3` is
# invisible to every check in this file, duplicates included.
#
# Measured 2026-08-11 on the pristine tree by flipping ONLY `all-features` to true:
#
#   cargo deny check bans
#   error[duplicate]: found 2 duplicate entries for crate 'block-buffer'   (0.10.4 / 0.12.0)
#   error[duplicate]: found 2 duplicate entries for crate 'const-oid'      (0.9.6  / 0.10.2)
#   error[duplicate]: found 2 duplicate entries for crate 'cpufeatures'    (0.2.17 / 0.3.0)
#   error[duplicate]: found 2 duplicate entries for crate 'crypto-common'  (0.1.7  / 0.2.1)
#   error[duplicate]: found 2 duplicate entries for crate 'digest'         (0.10.7 / 0.11.3)
#   bans FAILED
#   EXIT=2
#
# Five duplicates, and NO `[[bans.skip]]` entry below accounts for any of them.
# All five are one RustCrypto generation split, pulled in on a single path:
#   z3 0.20 -> (build) z3-sys 0.11 -> zip 8.6 -> {hmac 0.13, pbkdf2 0.13, sha1 0.11}
#   -> digest 0.11 / crypto-common 0.2 / block-buffer 0.12 / const-oid 0.10,
# against the digest 0.10 generation the rest of the workspace uses via sha2 0.10 /
# ed25519-dalek 2.x. The 19 skips below all still match under all-features (zero
# `unmatched-skip` warnings), so this is purely additional, uncovered surface.
#
# WHY IT IS NOT CLOSED HERE BY WIDENING THE GRAPH. `all-features = true` also
# fails the LICENSE check on the same z3 build subgraph, for two crates that are
# not in `[licenses] allow` above:
#
#   cargo deny check advisories licenses sources
#   error[rejected]: libbz2-rs-sys v0.2.4 -- "bzip2-1.0.6" is not explicitly allowed
#     bzip2 0.6.1 -> zip 8.6.0 -> (build) z3-sys 0.11.0 -> z3 0.20.0
#   error[rejected]: zlib-rs v0.6.3 -- "Zlib" is not explicitly allowed
#     flate2 1.1.9 -> zip 8.6.0 -> (build) z3-sys 0.11.0 -> z3 0.20.0
#   advisories ok, licenses FAILED, sources ok
#   EXIT=4
#
# So widening the graph requires widening `[licenses] allow` or carrying license
# exceptions -- the SAME governance decision, and the same Zlib blocker, that the
# tonic/prost 0.14 migration was reverted for below. Making it as a side effect of
# a duplicate-dependency cleanup is exactly the move this file refuses elsewhere,
# so it is disclosed rather than taken. Closing it means one decision about what
# the project will ship under, after which `all-features = true` plus five
# version-pinned skips for the crates named above is a mechanical follow-up.
#
# ATTEMPTED AND DELIBERATELY REVERTED: migrating our own swarm-ingest-tetragon
# from tonic/prost 0.13 to 0.14 (plus tonic-prost / tonic-prost-build) does
# collapse prost, prost-derive, tonic and socket2 -- 19 duplicates down to 16 --
# and it compiles and passes the suite. It was reverted because prost-build 0.14
# pulls petgraph 0.8 -> hashbrown 0.15 -> foldhash 0.1.5, which is Zlib-licensed
# and NOT in `[licenses] allow` above. The only ways to land it are to widen the
# license allow-list or to carry a license exception, and neither is a decision to
# make as a side effect of a duplicate-dependency cleanup. Filed as follow-up
# work, with the exact blocker recorded here.
skip = [
  # --- Transitive on the runtime graph, pinned by an upstream crate's old major ---
  { crate = "thiserror@1.0.69", reason = "async-nats 0.47 and x509-parser 0.16 (asn1-rs 0.6) still pin thiserror 1.x" },
  { crate = "thiserror-impl@1.0.69", reason = "proc-macro half of thiserror 1.x above" },
  { crate = "rand@0.8.6", reason = "async-nats 0.47 (nkeys, nuid, tokio-websockets) pins the rand 0.8 family" },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8 family above" },
  { crate = "rand_core@0.6.4", reason = "ed25519-dalek 2.x pins rand_core 0.6; our workspace pin matches it deliberately" },
  { crate = "getrandom@0.2.17", reason = "backs rand_core 0.6 above" },
  { crate = "getrandom@0.3.4", reason = "backs the rand 0.9 family pulled in by quinn-proto 0.11.16" },

  # SECURITY REVIEW ITEM -- escalated rather than silently skipped.
  # Two independent sets of TLS trust anchors are on the graph: webpki-roots 1.0.7
  # (our reqwest/rustls stack) and 0.26.11 (async-nats 0.47 -> tokio-websockets
  # 0.10). Trust roots are not an ordinary duplicate: the two crates ship different
  # snapshots of the Mozilla root program, so the NATS client and the HTTP client
  # can disagree about which CAs are trusted. Accepted for now only because
  # collapsing it requires an async-nats upgrade. This is a standing action item.
  { crate = "webpki-roots@0.26.11", reason = "SECURITY REVIEW ITEM: second TLS trust-anchor set, pinned by async-nats 0.47 -> tokio-websockets 0.10; collapse when async-nats moves to webpki-roots 1.x" },

  # --- Target-gated: Windows / wasm / UEFI support that does not build on the CI target ---
  { crate = "windows-core@0.57.0", reason = "target-gated; older windows-* stack held by a transitive dependency" },
  { crate = "windows-implement@0.57.0", reason = "target-gated; windows-core 0.57 family" },
  { crate = "windows-interface@0.57.0", reason = "target-gated; windows-core 0.57 family" },
  { crate = "windows-result@0.1.2", reason = "target-gated; windows-core 0.57 family" },
  { crate = "windows-sys@0.52.0", reason = "target-gated; older windows-sys major held by a transitive dependency" },
  { crate = "wit-bindgen@0.51.0", reason = "target-gated; wasm32-wasi bindings only" },
  { crate = "r-efi@5.3.0", reason = "target-gated; UEFI target support only" },
  { crate = "bitflags@1.3.2", reason = "target-gated; transitive dependency on bitflags 1.x" },

  # --- Our own old major, collapsible but blocked; see the note above ---
  { crate = "prost@0.13.5", reason = "swarm-ingest-tetragon pins prost/tonic 0.13; opentelemetry-otlp 0.31 brings 0.14. Collapsible, blocked on the Zlib-licensed foldhash that prost-build 0.14 pulls in" },
  { crate = "prost-derive@0.13.5", reason = "proc-macro half of prost 0.13 above" },
  { crate = "tonic@0.13.1", reason = "swarm-ingest-tetragon pins tonic 0.13; opentelemetry-proto 0.31 brings 0.14. Same blocker as prost above" },
  { crate = "socket2@0.5.10", reason = "held by tonic 0.13's transport stack; collapses with the tonic 0.14 migration above" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
