# Supply-chain review ledger (SUPPLY-01, SUPPLY-02).
#
# `deny.toml`'s `[advisories].ignore` entries accept ONLY `{ id, reason }` --
# cargo-deny 0.19.4 rejects any other key with `error[unexpected-keys]`,
# verified at HEAD by adding a third key to a live entry and re-running
# `cargo deny check advisories`. So the three fields every ignore and skip
# entry is required to carry -- a `last-checked` date, a blast-radius note,
# and a clearing condition -- cannot live inside `deny.toml` itself without
# breaking cargo-deny's schema. This file is the companion ledger instead.
#
# `tools/check-supply-chain.sh` parses this file AND `deny.toml` with the
# stdlib TOML parser (`tomllib`, not a line regex) and cross-validates them
# before ever invoking `cargo deny` or `cargo audit`:
#   - every `[advisories].ignore` id in deny.toml must have a matching
#     `[advisories_ignore.<id>]` table here (MISSING_LEDGER_ENTRY otherwise);
#   - every `[[bans.skip]]` crate in deny.toml must have a matching
#     `[bans_skip."<crate>@<version>"]` table here, keyed by the exact same
#     string deny.toml uses for its `crate` field (MISSING_LEDGER_ENTRY);
#   - a ledger table naming an id/crate NOT in deny.toml is an
#     ORPHAN_LEDGER_ENTRY -- this is the "argv/deny.toml drift" failure mode:
#     an orphan cannot leak into the derived `cargo audit --ignore` argv,
#     which is built from deny.toml's ignore list, not from this ledger;
#   - every matched table must carry `last_checked` (a native TOML local
#     date -- an unquoted `YYYY-MM-DD` literal, so a malformed calendar date
#     or a string given by mistake is a hard failure, not silently accepted),
#     a non-empty `blast_radius`, and a non-empty `clearing_condition`;
#   - a duplicate `id` inside deny.toml's `ignore` ARRAY is caught directly
#     (TOML's own duplicate-key rule already makes a duplicate table BELOW
#     impossible -- `tomllib` raises "Cannot declare ... twice" -- so only
#     the deny.toml array side needs an explicit check).
#
# Keying ledger entries as `[advisories_ignore.<id>]` / `[bans_skip."..."]`
# tables (not an array of tables) means TOML itself refuses a duplicate
# ledger entry at parse time -- there is no way to accidentally define the
# same id/crate twice in this file.
#
# Every date below was set or re-confirmed 2026-09-07 while re-verifying
# codex's `287-CODEX-PREP.md` supply-chain audit at HEAD for Phase 287 Task A
# (SUPPLY-01/02). Three of the pre-existing rationales it flagged as stale
# were corrected in `deny.toml` itself at the same time (rustls-pemfile is a
# DIRECT dependency, not transitive; webpki-roots 0.26.11 re-exports the
# locked 1.0.7 roots rather than shipping an independent snapshot; instant is
# reachable via nostr in swarm-perch-bridge, not only via notify) -- see the
# corrected `reason` strings and comments in `deny.toml` for the detail; this
# ledger's `blast_radius` / `clearing_condition` fields carry the full
# account so `deny.toml`'s inline `reason` can stay short.

schema_version = 1

# ============================================================================
# [advisories].ignore -- RUSTSEC advisories accepted rather than fixed.
# ============================================================================

[advisories_ignore.RUSTSEC-2024-0384]
last_checked = 2026-09-07
blast_radius = """\
"instant" is an "unmaintained" (informational, not a known vulnerability) \
advisory. Reachable via TWO independent paths, re-verified against Cargo.lock \
at HEAD: (1) notify 7.0.0 -> notify-types 1.0.1 -> instant, pulled in by \
swarm-runtime-http's `notify` file-watch dependency; and (2) nostr 0.44.8 -> \
instant, pulled in DIRECTLY by swarm-perch-bridge (`nostr = { version = \
"0.44", ... }` in its Cargo.toml) and again transitively through \
swarm-perch-bridge's own path dependency on workspace/crates/ambush-ws-client, \
which also depends on nostr. Both paths use instant only for internal \
monotonic-clock/Duration bookkeeping (file-watch debounce timers; nostr \
relay-connection timing) -- no attacker-controlled input is parsed by \
instant itself, and no public API of ours re-exports its types.\
"""
clearing_condition = """\
Clears when BOTH paths move off instant: notify-types' upstream migration \
away from instant (tracked via the notify crate's release notes), AND \
nostr's migration to `web-time`/std Instant (or dropping/pinning an older \
nostr line that predates the instant dependency), OR when swarm-runtime-http \
drops the `notify` dependency and swarm-perch-bridge drops/replaces `nostr` \
and ambush-ws-client's dependency on it.\
"""

[advisories_ignore.RUSTSEC-2025-0134]
last_checked = 2026-09-07
blast_radius = """\
"rustls-pemfile" is an "unmaintained" (informational, not a known \
vulnerability) advisory -- the crate's repository is archived and its \
maintainers recommend migrating to rustls-pki-types' `PemObject` trait. \
Re-verified at HEAD: rustls-pemfile is a DIRECT dependency of \
swarm-runtime-http (`Cargo.toml:21`, `rustls-pemfile = "2"`), called \
directly at `serve.rs:222` (`rustls_pemfile::certs`) and `serve.rs:230` \
(`rustls_pemfile::private_key`) to parse the operator-supplied TLS \
certificate/key PEM files at HTTPS-listener startup. This is NOT a \
transitive dependency of some other rustls-stack crate, and the prior \
"still used transitively" rationale was stale. Blast radius is confined to \
server startup parsing local, operator-provided files -- not untrusted \
network input.\
"""
clearing_condition = """\
Clears when swarm-runtime-http's two call sites in serve.rs migrate to \
rustls-pki-types' `PemObject` trait (the crate's own documented \
replacement) and the `rustls-pemfile` dependency is removed from \
swarm-runtime-http/Cargo.toml.\
"""

