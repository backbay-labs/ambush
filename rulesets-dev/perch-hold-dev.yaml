# rulesets-dev/perch-hold-dev.yaml — the LIVE-RESPONSE development profile.
#
# 00-DECISIONS D4 gives each milestone its runtime mode: First card is accepted
# on `detect_only`, The hold on `live_response`. Those cannot be the same file —
# First card's evidence rests on a profile that cannot execute — so this is a
# second profile beside `perch-dev.yaml` rather than a flip of it (W3-33).
#
# It differs from `perch-dev.yaml` in exactly four places, each forced by the
# mode: `runtime.mode`, a durable `runtime.containment.lease_store_path`, a
# durable pheromone backend (`require_durable_live_response: true` refuses
# `in_memory` under `live_response`), and its own store directory so a
# live-response run cannot read or write the detect-only profile's holds.
#
# It is DEBUG-SIGNED. A release daemon refuses this signature, which is the
# intended behaviour: nothing signed by the in-repo key may enforce in
# production.
# Otherwise it is `perch-dev.yaml`: the operator surface on, a file-backed
# incident store, a longer audit tail, and one console principal carrying the
# dev operator's Nostr public key.
#
# Signed with the in-repo DEBUG key (`cargo run -p swarm-runtime-http --bin
# sign_dev_ruleset -- rulesets-dev/perch-hold-dev.yaml`). A release daemon refuses
# that signature by design: production signs its own rulesets. Re-sign after
# every edit; `swarmctl validate --config rulesets-dev/perch-dev.yaml` checks.
#
# It lives beside, not inside, rulesets/: the startup attestation
# (rulesets/attestation.json, signed with the repo-owned key that is not in
# the repository) enumerates every YAML under rulesets/, so a file there that
# the manifest does not cover fails the attestation for every daemon in the
# checkout and blocks live_response outright.
#
# The principal's nostr_pubkey is the well-known dev operator identity
# scripts/provision-perch.sh derives and prints; export AMBUSH_PRIVATE_KEY to
# use another key, then update the value here and re-sign.
schema_version: 1
name: perch-dev
description: Operator-console development profile (detect_only, debug-signed)

runtime:
  mode: live_response
  telemetry_sources:
    - name: synthetic-process
      subject: telemetry.synthetic.process
    # - name: sentinel-infra
    #   bridge:
    #     kind: sentinel
    #     endpoint: http://127.0.0.1:9100/metrics
  max_in_flight_actions: 4
  drain_timeout_ms: 30000
  require_durable_live_response: true
  max_heap_pressure: 0.90
  governance_degraded_tick_threshold: 3
  partition_contingency_lease_ttl_ms: 300000
  partition_contingency_blast_radius_cap: 1
  # Set secret_dir when using @secret:file-name adapter references.
  secret_dir:
  # B1. Holds are durable on this profile: without a path a restart forgets
  # every open hold, so a destructive action nobody decided disappears from the
  # operator's queue with no record. The directory is relative to this file.
  response:
    hold_store_path: data/perch-hold-dev/holds
  # D4: `live_response` is the mode The hold is accepted on, and a lease that a
  # restart forgets is a containment nobody can release. Both stores sit beside
  # this file.
  containment:
    lease_store_path: data/perch-hold-dev/leases

detection:
  # Supported strategies: suspicious_process_tree, dns_exfiltration,
  # lateral_movement, credential_access, suspicious_scripting,
  # persistence, supply_chain, network_connect, infrastructure_anomaly,
  # fileless_execution, behavioral_anomaly
  strategy: suspicious_process_tree
  # Multi-strategy mode (takes precedence over `strategy` when present):
  # strategies:
  #   - suspicious_process_tree
  #   - infrastructure_anomaly
  high_confidence_threshold: 0.90
  medium_confidence_threshold: 0.70
  # Optional per-strategy profile overrides:
  # profiles:
  #   network_connect:
  #     suspicious_ports: [4444, 5555]
  #     process_port_allowlist:
  #       curl: [80, 443]
  #   infrastructure_anomaly:
  #     min_sustained_high_cpu_samples: 2
  #     correlation_window_secs: 120
  #   fileless_execution:
  #     min_region_size_bytes: 8192
  #     privileged_target_processes: [lsass, winlogon]
  #   behavioral_anomaly:
  #     min_host_observations: 6
  #     baseline_half_life_secs: 7200
  #     rare_role_tools: [powershell.exe, wmic.exe]

pheromone:
  default_half_life_secs: 3600.0
  evaporation_threshold: 0.01
  min_sources_for_escalation: 2
  alert_threshold: 2.0
  incident_threshold: 5.0
  deescalation_cooldown_secs: 300
  response_playbook:
    rules:
      - threat_class: execution
        severity: HIGH
        min_confidence: 0.90
        max_confidence: 1.00
        actions:
          - type: deploy_decoy
            decoy_type: honeypot
            target_zone: dmz
          - type: escalate
            summary: execution spike crossed the high-confidence autonomous threshold
            urgency: HIGH
      - threat_class: command_and_control
        severity: CRITICAL
        min_confidence: 0.95
        max_confidence: 1.00
        actions:
          - type: block_egress
            target: 203.0.113.10
          - type: escalate
            summary: critical C2 activity matched the emergency response playbook
            urgency: CRITICAL
  # For a durable shared substrate, switch backend.kind to jet_stream
  # and add:
  #   url: nats://127.0.0.1:4222
  #   connect_timeout_ms: 5000
  #   gc_page_size: 512
  backend:
    kind: local_journal
    path: data/perch-hold-dev/pheromone

policy:
  human_gate_severity: HIGH
  lease_ttl_ms: 60000
  max_actions_per_scope_per_minute: 5
  rules:
    - name: execution-after-hours-autorespond
      decision: allow
      threat_class: execution
      actions: [deploy_decoy, escalate]
      min_severity: HIGH
      max_severity: CRITICAL
      time_window_utc:
        start_hour_utc: 0
        end_hour_utc: 24
      max_actions_per_agent_per_minute: 4
      reason: execution playbook actions are allowed for elevated execution findings
    - name: command-and-control-emergency-block
      decision: allow
      threat_class: command_and_control
      actions: [block_egress, escalate]
      min_severity: CRITICAL
      max_severity: CRITICAL
      time_window_utc:
        start_hour_utc: 0
        end_hour_utc: 24
      max_actions_per_agent_per_minute: 2
      reason: critical C2 traffic can trigger immediate containment and escalation
    - name: credential-access-destructive-deny
      decision: deny
      threat_class: credential_access
      actions: [revoke_credential]
      min_severity: LOW
      max_severity: HIGH
      reason: low-confidence credential access findings stay operator-driven by default

response_adapter:
  kind: sandbox

# Optional canonical finding forwarding for external SIEM sinks.
# siem_forward:
#   kind: splunk_hec
#   endpoint: https://splunk.example/services/collector/event
#   auth_token: "@secret:env:SWARM_SPLUNK_TOKEN"
#   timeout_ms: 5000
#   dead_letter_path: ./siem-dead-letter.jsonl

# Optional routed notification channels for operator-facing alerts.
# notification_channels:
#   pager:
#     target_url: https://hooks.example/swarm/pager
#     auth_token: "@secret:env:SWARM_NOTIFY_TOKEN"
#     request_signature:
#       header: X-Swarm-Signature
#       secret: "@secret:env:SWARM_NOTIFY_HMAC"
#     timeout_ms: 5000
#     rate_limit:
#       max_notifications: 5
#       window_ms: 60000
#     quiet_hours:
#       start_hour_utc: 0
#       end_hour_utc: 6
#     dead_letter_path: ./notification-pager.jsonl
#
# notification_routing:
#   dedup_window_ms: 1000
#   rules:
#     - min_severity: HIGH
#       threat_class: execution
#       channels: [pager]
#
# Providence-native incident lifecycle uses the reserved channel name
# `providence_webhook`. Set `target_url` to the Providence incidents
# collection endpoint (for example `https://providence.example/incidents`).
# Swarm will create, update, and resolve incidents through that endpoint and
# expose Providence reachability/auth state on `/healthz` and `/readyz`.

audit:
  bundle_store:
    kind: memory
  recent_decisions_limit: 200

investigation:
  enabled: false
  worker_count: 1
  max_pending_jobs: 16
  time_budget_ms: 250
  bundle_store:
    kind: memory

correlation:
  enabled: true
  time_window_ms: 300000
  min_shared_keys: 1
  candidate_limit: 32
  incident_store:
    kind: local_files
    directory: data/incidents

canary:
  enabled: true
  slot_id: canary-primary
  # Optional rollout baseline scope. This becomes required when
  # detection.strategies enables more than one active strategy.
  strategy_id:
  observation_window_events: 2
  max_candidate_only_rate: 0.25
  max_baseline_miss_rate: 0.25
  max_detect_latency_us: 10000
  max_total_detections: 8

promotion:
  enabled: true
  window_id: production-primary
  # Optional production fallback scope. When omitted, promotion inherits
  # the completed canary baseline strategy after validating it is still active.
  strategy_id:
  observation_window_events: 2
  max_promoted_only_rate: 0.20
  max_fallback_recovery_rate: 0.20
  max_detect_latency_us: 10000
  max_total_detections: 12

evolution:
  enabled: false
  observation_window_secs: 3600
  drift_threshold_pct: 0.40
  minimum_observations: 3
  cooldown_secs: 900
  max_variants_per_cycle: 2
  shortlist_count: 1
  population_size: 16
  pareto_tournament_size: 4
  max_proposals_per_hour: 4
  fitness_weights:
    detection_rate: 0.40
    false_positive_cost: 0.30
    speed: 0.15
    threat_class_coverage: 0.15
  safety_gate:
    invariant_bundle_paths:
      - safety/office-detector-admission.yaml
    enable_z3: false
  assurance:
    require_solver_summary: false
    min_detector_catch_rate: 0.25
    allowed_solver_statuses:
      - proved
      - disabled
    coverage_overrides: []
    harvest:
      results_dir: data/evolution-assurance-cases
      max_cases_per_proposal: 8
      max_events_per_case: 16
    waiver:
      allowed_operator_ids: []
      max_ttl_secs: 3600
      max_actionable_gap_count: 4
  paths:
    replay_results_dir: data/replay-runs
    experiment_results_dir: data/experiments
    verification_results_dir: data/verifications
    shadow_results_dir: data/shadows
    strategy_memory_results_dir: data/strategy-memory
    strategy_scorecard_results_dir: data/strategy-scorecards
    evolution_proof_results_dir: data/evolution-proofs
    evolution_queue_results_dir: data/evolution-queue
    evolution_selection_results_dir: data/evolution-selections
    evolution_bridge_results_dir: data/evolution-selection-bridges
    evolution_handoff_results_dir: data/evolution-handoffs
    evolution_pressure_results_dir: data/evolution-pressures
    evolution_draft_results_dir: data/evolution-drafts
    evolution_draft_promotion_results_dir: data/evolution-draft-promotions
    evolution_materialization_results_dir: data/evolution-materializations
    evolution_validation_results_dir: data/evolution-validation-bundles
    evolution_reconciliation_results_dir: data/evolution-reconciliations
    evolution_mutation_results_dir: data/evolution-mutations
    evolution_mutation_materialization_batch_results_dir: data/evolution-mutation-materialization-batches
    evolution_mutation_validation_batch_results_dir: data/evolution-mutation-validation-batches
    evolution_ranking_results_dir: data/evolution-rankings
    evolution_population_results_dir: data/evolution-population
    canary_results_dir: data/canaries

deception:
  enabled: false
  lifecycle_results_dir: data/deception-lifecycle
  rotation_interval_secs: 86400
  cleanup_grace_secs: 3600
  interaction_fitness_weight: 0.15
  playbook:
    entries:
      - name: finance-canary-file
        decoy_type: canary_token
        target_zone: finance
        host_profile: linux-app
        placement_strategy: high_value_path
        monitoring:
          file_paths:
            - /srv/data/finance/payroll.xlsx
          threat_class: initial_access
          severity: HIGH
          confidence: 0.99
      - name: dmz-ssh-honeypot
        decoy_type: honeypot
        target_zone: dmz
        host_profile: ssh-bastion
        placement_strategy: network_segment
        monitoring:
          honeypot_ports: [2222]
          threat_class: lateral_movement
          severity: HIGH
          confidence: 0.99
      - name: ops-canary-credential
        decoy_type: canary_token
        target_zone: core
        host_profile: domain-admin
        placement_strategy: baseline
        monitoring:
          canary_credentials:
            - svc-backup-canary
          threat_class: initial_access
          severity: HIGH
          confidence: 0.99

memory:
  enabled: false
  knowledge_graph_results_dir: data/knowledge-graph
  temporal_window_secs: 3600
  knowledge_retention_days: 90

identity:
  agent_key_dir: data/agent-keys
  registry_dir: data/agent-identity

operator_surface:
  enabled: true
  bind_addr: "127.0.0.1:7766"
  runtime_base_url: "http://127.0.0.1:9090"
  public_base_url: "http://127.0.0.1:7766"
  allowed_embed_origins: []
  max_list_results: 50
  widget_token_ttl_secs: 900
  auth:
    principals:
      - operator_id: console
        token_env: SWARM_OPERATOR_TOKEN
        scopes: [read, rehearse, approve, maintenance]
        # sha256("ambush-perch-dev-operator-v1") as a secp256k1 secret; see
        # scripts/provision-perch.sh.
        nostr_pubkey: 1fa40f70991b6b985253eb8c143e372b77df5d571e2263702af2c84082f02905

# The versioned platform READ api (`/v2/api/*`), which is where the daemon's
# tuning report lives -- the thing a Dismiss has to move for the milestone to
# mean anything (docs/PERCH-DEV.md step 8). It authenticates in two layers:
# `x-api-key` against one of the hashes below, then `Authorization: Bearer`
# against an operator principal above. With no key here the whole surface
# answers 401 `missing x-api-key header`, which is why this block exists.
#
# The key is the WELL-KNOWN dev value `dev-platform-token`
# (.env.perch.example), hashed: sha256("dev-platform-token"). It is exactly as
# public as the dev operator secret this file already trusts, it grants `read`
# and nothing else, and the surface it opens binds 127.0.0.1. A release daemon
# refuses this file's signature outright.
platform_api:
  keys:
    - name: perch-dev-read
      key_hash: "0bd6c0f49d373beb88473abbb0f5114b6db18d2c6e8078df0391c637c39024b2"
      scopes: [read]

# The bridge: the daemon's only writer of daemon-sourced facts to the relay
# (12-PLAN-FIRST-CARD.md Task 14, decisions D-FC-1 and D-FC-5).
perch:
  enabled: true
  # The HOST here must equal the relay's own RELAY_URL host, not merely resolve
  # to the same socket. The relay binds row zero to the connection's Host header
  # (workspace/crates/ambush-relay/src/tenant.rs) and seeds exactly one community
  # for its RELAY_URL host at startup; docker-compose.yml sets
  # `RELAY_URL: ws://localhost:3000`, so `ws://127.0.0.1:3000` -- the same socket
  # -- is an UNMAPPED host and every frame is refused closed. It is also the host
  # the desktop adds as its community, which is what puts the console and the
  # bridge in the same record.
  relay_url: "ws://localhost:3000"
  nostr_seed_env: PERCH_BRIDGE_NOSTR_SEED
  # MUST resolve outside the repository (tools/check-worktree-clean.sh sweeps with find).
  spool_dir: "/tmp/ambush-perch-dev/spool"
  case_ttl_seconds:
    default: 2592000
  # Twelve standing lanes, one per standard threat class, created by the bridge at startup (D-FC-5).
  lane_channels:
    lateral_movement: "154eea36-c787-4bf7-9c84-4424b0184395"
    data_exfiltration: "c4c31b06-02a7-46c3-a0cb-8dba1f220be1"
    privilege_escalation: "bef7e4d9-3f8c-46f4-96a0-1e3bb88e741d"
    command_and_control: "56c17d5c-aeb3-48c8-b05a-088bc53b43f3"
    initial_access: "f0255b44-3e2f-4e6d-a55f-64eeeaf79c70"
    persistence: "955ef466-1b4f-4369-8e26-09494de7c9ff"
    supply_chain: "3c6fdb45-c783-47ba-b59e-3bd5e7eae750"
    defense_evasion: "ebf7c500-6bcb-4916-8a6e-d5db7cb18ea3"
    credential_access: "6c461f1b-688e-470b-8301-6547f35dc07c"
    discovery: "884aa52b-8ef7-47ef-919b-31b3606067ee"
    execution: "a30249d7-446b-4135-8e9f-8704a5a052b1"
    impact: "7e8f562f-5484-4e5f-9140-d071d7c4b60c"
