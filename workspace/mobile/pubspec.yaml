name: ambush
description: Ambush mobile client
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Grapheme-cluster segmentation, for deciding whether a message body is
  # nothing but emoji. Already present transitively via the Flutter SDK;
  # declared here because we import it directly.
  characters: ^1.4.0
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3
  lucide_icons_flutter: ^3.1.0
  http: ^1.4.0
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.1
  connectivity_plus: ^7.0.0
  nostr: ^2.0.0
  pointycastle: ^4.0.0
  url_launcher: ^6.3.2
  gpt_markdown: ^1.1.6
  highlight: ^0.7.0
  intl: ^0.20.2
  uuid: ^4.5.1
  file_selector: ^1.1.0
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  image: ^4.8.0
  google_mlkit_selfie_segmentation: ^0.10.1
  photo_manager: ^3.11.0
  video_player: ^2.10.1
  package_info_plus: ^10.0.0
  app_badge_plus: ^1.2.10
  app_links: ^6.4.0
  scrollable_positioned_list: ^0.3.8
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  camera_platform_interface: ^2.13.1
  crypto: ^3.0.7
  custom_lint: ^0.8.0
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    # Generated by `just mobile-emoji-data` from the same emoji-mart dataset
    # desktop uses. Do not hand-edit.
    - assets/emoji/emoji-data.json
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono-BoldItalic.ttf
          weight: 700
          style: italic
