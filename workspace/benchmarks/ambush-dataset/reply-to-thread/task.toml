schema_version = "1.3"

[task]
name = "ambush-native/reply-to-thread"
description = "Answer a financial projection in the thread started by the user."
authors = [{ name = "Ambush" }]
keywords = ["ambush-native", "messaging", "threading"]

[metadata]
evaluation_layer = "regression"
difficulty = "easy"
category = "collaboration"
tags = ["messaging", "threading", "implicit-behavior"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 30.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 1024
storage_mb = 1024
