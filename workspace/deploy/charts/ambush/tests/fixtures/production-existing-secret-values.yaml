# Production / GitOps shape: external services, existingSecret. Renders only;
# `ct install` is not asked to satisfy the external services.
relayUrl: wss://ambush.example.com
ownerPubkey: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
secrets:
  existingSecret: ambush-secrets
externalPostgresql:
  url: "postgres://ambush:pw@postgres.example.com:5432/ambush"
externalRedis:
  url: "redis://:pw@redis.example.com:6379"
s3:
  endpoint: "https://s3.us-east-1.amazonaws.com"
  bucket: "ambush-media"
persistence:
  git:
    enabled: true
    accessMode: ReadWriteOnce
    size: 50Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
podDisruptionBudget:
  enabled: false
