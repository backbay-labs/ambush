name: ambush-prod

services:
  relay:
    image: ${AMBUSH_IMAGE:-ghcr.io/backbay-labs/ambush:main}
    env_file:
      - .env
    environment:
      AMBUSH_BIND_ADDR: 0.0.0.0:3000
      AMBUSH_HEALTH_PORT: "8080"
      AMBUSH_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-ambush}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ambush}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      AMBUSH_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      AMBUSH_S3_ADDRESSING_STYLE: path
      AMBUSH_S3_ACCESS_KEY: ${AMBUSH_S3_ACCESS_KEY:?set AMBUSH_S3_ACCESS_KEY}
      AMBUSH_S3_SECRET_KEY: ${AMBUSH_S3_SECRET_KEY:?set AMBUSH_S3_SECRET_KEY}
      AMBUSH_S3_BUCKET: ${AMBUSH_S3_BUCKET:-ambush-media}
      AMBUSH_GIT_REPO_PATH: /data/git
      AMBUSH_AUTO_MIGRATE: ${AMBUSH_AUTO_MIGRATE:-false}
      AMBUSH_GIT_CONFORMANCE_PROBE: ${AMBUSH_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${AMBUSH_HTTP_PORT:-3000}:3000"
    volumes:
      - ambush-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - ambush-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambush}
      POSTGRES_USER: ${POSTGRES_USER:-ambush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ambush-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - ambush-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ambush-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - ambush-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AMBUSH_S3_ACCESS_KEY:?set AMBUSH_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AMBUSH_S3_SECRET_KEY:?set AMBUSH_S3_SECRET_KEY}
    volumes:
      - ambush-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - ambush-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AMBUSH_S3_ACCESS_KEY: ${AMBUSH_S3_ACCESS_KEY:?set AMBUSH_S3_ACCESS_KEY}
      AMBUSH_S3_SECRET_KEY: ${AMBUSH_S3_SECRET_KEY:?set AMBUSH_S3_SECRET_KEY}
      AMBUSH_S3_BUCKET: ${AMBUSH_S3_BUCKET:-ambush-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${AMBUSH_S3_ACCESS_KEY}" "$${AMBUSH_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${AMBUSH_S3_BUCKET}"
        mc anonymous set none "local/$${AMBUSH_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - ambush-net

volumes:
  ambush-postgres-data:
    labels:
      com.backbay.ambush.volume: postgres
  ambush-redis-data:
    labels:
      com.backbay.ambush.volume: redis
  ambush-minio-data:
    labels:
      com.backbay.ambush.volume: minio
  ambush-git-data:
    labels:
      com.backbay.ambush.volume: git

networks:
  ambush-net:
    driver: bridge
    labels:
      com.backbay.ambush.network: production
