services:
  swarm-detect:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      # Config stays read-only. `data/` is layered writable on top because
      # identity.agent_key_dir resolves to <config parent>/data/agent-keys and
      # FileAgentKeyStore::load_or_create must WRITE a per-deployment key there
      # on first start. A named volume also keeps that identity stable across
      # restarts; an anonymous or tmpfs mount would mint a new AgentId each boot.
      - ./rulesets:/app/rulesets:ro
      - swarm-identity:/app/rulesets/data
    environment:
      RUST_LOG: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  nats:
    image: docker.io/library/nats:2.11.17-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    profiles:
      - nats
    ports:
      - "127.0.0.1::4222"
      - "127.0.0.1::8222"
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

x-phase285-authority-topology:
  accounts:
    - phase285-runtime
    - phase285-witness
    - phase285-witness-store
  principals:
    phase285-runtime:
      imports: [swarm.governance.witness.v1]
      mounts: [runtime-credentials, phase285-ca]
    phase285-witness:
      imports: [swarm.governance.witness.store.v1]
      exports: [swarm.governance.witness.v1]
      mounts: [witness-signing-key, witness-client-credentials, phase285-ca]
    phase285-witness-store:
      exports: [swarm.governance.witness.store.v1]
      mounts: [raw-store-credentials, witness-public-key, phase285-ca]
    phase285-init:
      serves: []
      mounts: [init-credentials, witness-signing-key, phase285-ca]
  transport:
    url: tls://nats.phase285.test:4222
    pinned_ca: phase285-ca
    server_name: nats.phase285.test
  forbidden:
    - wildcard-service-import
    - cross-role-credential-mount
    - init-serving-subject

volumes:
  nats-data:
  swarm-identity:
