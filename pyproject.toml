[project]
name = "swarm-team-six"
version = "0.1.0"
description = "Autonomous, self-evolving threat hunting swarm"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "async-nats>=0.2",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "networkx>=3.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["kernel"]

[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "swarm_team_six._bridge"
