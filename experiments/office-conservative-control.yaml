name: office_conservative_control
description: Conservative suspicious process-tree seed that preserves the office safety corpus while leaving bounded execution headroom for measured autonomous gap closure
corpus:
  suite: ../scenario-suites/hellcat-office-v1.yaml
verification:
  corpus: ../verifications/office-detector-safety-v1.yaml
candidate:
  strategy: suspicious_process_tree
  strategy_id: office_conservative_control
  description: Candidate profile keeps the office safety corpus covered but omits broader office and collaboration execution branches
  profile:
    suspicious_parents:
      - winword
      - outlook
      - acrord32
    suspicious_children:
      - powershell
      - cmd
    high_confidence_threshold: 0.9
    medium_confidence_threshold: 0.7
lineage:
  parent_strategy_id: suspicious_process_tree
  mutation: conservative_control
  rationale: Establish a replayable bounded seed with known execution headroom for autonomous gap-expansion benchmarking
gates:
  require_known_bad_coverage: true
  max_false_positive_delta: 0
  max_detect_latency_delta_us: 10000
